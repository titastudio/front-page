    if (printedCorrections) delta.truth = Engine.round(delta.truth + printedCorrections * 0.9, 2);
    /* Press releases are free copy and quietly corrosive. */
    var prCount = stories.filter(function (st) { return st.pressRelease; }).length;
    if (prCount) {
      delta.truth = Engine.round(delta.truth - prCount * 0.8, 2);
      delta.professionalism = Engine.round(delta.professionalism - prCount * 0.6, 2);
    }
    s.reputation = Engine.applyReputation(s.reputation, delta);

    stories.forEach(function (st) {
      s.tagCounts[st.category] = (s.tagCounts[st.category] || 0) + 1;
      if (st.investigationId) s.tagCounts.Investigation = (s.tagCounts.Investigation || 0) + 1;
    });
    s.identity = Engine.deriveIdentity(s.tagCounts, Data.IDENTITY_RULES);

    /* --- archive ----
     * INVARIANT: archive entries are self-contained snapshots. They copy the
     * text they need at write time, because today's story objects are thrown
     * away tonight and can never be looked up again. */
    var edition = {
      day: s.day,
      dateLine: App.dateLine(),
      paperName: s.paper.name,
      headlineText: s.today.headline,
      headlineStyle: s.today.headlineStyle,
      leadTitle: lead ? lead.title : null,
      leadCategory: lead ? lead.category : null,
      leadPhoto: lead && lead.photo ? lead.photo.label : null,
      stories: stories.map(function (st) {
        return { title: st.title, category: st.category, section: st.section, truth: st.truth };
      }),
      ads: ads.map(function (ad) { return ad.name; }),
      pageCount: s.pageCount,
      stock: s.paperStock,
      quality: quality, satisfaction: Engine.round(satisfaction, 1),
      copies: copies, revenue: revenue, adRevenue: adMoney,
      expenses: expenses, profit: profit,
      typos: typos, identity: s.identity.name,
      rivals: s.today.rivals.map(function (r) { return { name: r.name, headline: r.headline }; }),
      invResult: invResult,
      missedBreaking: !!s.today.missedBreaking,
      weather: s.today.weather,
      forecastId: s.today.forecast ? s.today.forecast.id : null,
      horoscope: s.today.horoscope,
      correctionsPrinted: printedCorrections,
      correctionsSkipped: Math.max(0, owed.length - printedCorrections),
      inserts: (s.inserts || []).slice(),
      printRun: run ? run.printed : copies,
      unsold: run ? run.unsold : 0,
      soldOut: run ? run.soldOut : false,
      demand: demand,
      adsPulled: pulled,
      theme: s.theme,
      threadsCovered: stories.filter(function (st) { return st.threadId; }).map(function (st) { return st.threadName; }),
      marketShare: Engine.marketShare(copies, s.rivals || []),
      teasers: (s.today.teasers || []).slice(),
      sideIncome: sideIncome, channelMoney: channelMoney,
      distribution: s.distribution, streak: s.streak,
      comicPanel: strip.panels[Math.max(0, s.comic.panel - 1)],
      districts: JSON.parse(JSON.stringify(s.districts)),
      classifieds: classifiedMoney,
      era: s.era,
      subjectsNamed: stories.filter(function (st) { return !!st.subject; }).length,
      editorialStance: s.today.editorialChoice || null,
      perceivedTrust: Engine.perceivedTrust(Engine.reputationAverage(s.reputation), s.satisfactionHistory)
    };
    s.archive.push(edition);
    s.lastEdition = edition;
    s.today.published = true;
    s.today.groupResults = groupResults.map(function (g) {
      return { id: g.group.id, name: g.group.name, satisfaction: g.satisfaction, delta: g.delta };
    });
    s.streak = profit >= 0 ? s.streak + 1 : 0;

    /* Letters that were printed are marked handled here, not when chosen. */
    stories.forEach(function (st) {
      if (!st.letter) return;
      var l = s.letters.filter(function (x) { return x.id === st.letter.id; })[0];
      if (l) l.handled = true;
    });
    if (invStory && invResult && invResult.outcome === 'vindicated') s.stats.vindicated += 1;
    if (pulled.length) App.toast(pulled[0] + ' pulled its advertising.', 'bad');

    /* Stories left on the spike may come back later, bigger. */
    var placedIds = {};
    Object.keys(a).forEach(function (k) { placedIds[a[k]] = true; });
    s.today.stories.forEach(function (st) {
      if (placedIds[st.id] || st.wire || st.pressRelease || st.correction || st.letter) return;
      if (st.importance >= 65 && s.passedOn.length < 8) {
        s.passedOn.push({ day: s.day, story: JSON.parse(JSON.stringify(st)) });
      }
    });

    if (s.challenge) s.challenge.score = Engine.challengeScore(edition);
    /* --- rival editors react to what you printed --- */
    (s.rivals || []).forEach(function (rv) {
      var editor = Data.RIVAL_EDITORS[rv.id];
      if (!editor) return;
      var reaction = Engine.rivalReaction(editor, edition);
      if (reaction && editor.lines[reaction]) {
        s.rivalEditors[rv.id] = { reaction: reaction, day: s.day, line: editor.lines[reaction], editor: editor.name };
      }
    });
    edition.rivalReactions = Object.keys(s.rivalEditors)
      .filter(function (k) { return s.rivalEditors[k].day === s.day; })
      .map(function (k) { return s.rivalEditors[k]; });

    /* --- ethics ledger counters --- */
    s.stats.sourcesNamed = (s.stats.sourcesNamed || 0)
      + stories.filter(function (st) { return st.whistleblower && st.whistleblower.protected === false; }).length;
    s.stats.embargoesBroken = (s.stats.embargoesBroken || 0)
      + stories.filter(function (st) { return st.embargo && s.day < st.embargo.untilDay; }).length;
    s.stats.advertorials = (s.stats.advertorials || 0)
      + stories.filter(function (st) { return st.advertorial; }).length;

    App.checkAchievements();
    App.sound('press');
    generateLetters(quality, typos, adLoad, stories);
    App.save(true);
    if (!App.silentPress) App.go('results');
  }

  function generateLetters(quality, typos, adLoad, stories) {
    var s = App.state;
    App.roll(function (r) {
      var n = r.int(0, 2);
      for (var i = 0; i < n; i++) {
        var kind = 'idea';
        if (typos >= 2 || adLoad > 0.75 || quality < 45) kind = r.chance(0.7) ? 'complaint' : 'idea';
        else if (quality > 70) kind = r.chance(0.7) ? 'praise' : 'idea';
        var text = r.pick(Data.LETTER_TEMPLATES[kind]).replace('{who}', r.pick(Data.LETTER_SIGNERS));
        s.letters.push({ id: 'l-' + s.day + '-' + i, kind: kind, text: text, day: s.day, handled: false });
      }
      if (s.letters.length > 30) s.letters = s.letters.slice(-30);
    });
  }

  /* Exposed so the balance harness (and the tutorial demo) can run a day
   * without driving the UI. doPress is otherwise private on purpose. */
  App.doPress = doPress;
  App.leadStory = leadStory;

  /* ---------- auto-player ----------
   * Plays one day with a simple strategy. Used by the long-run balance
   * simulation, which would take hours through the interface. NOT used by the
   * game itself — a human always goes through the screens. */
  App.autoPlayDay = function (opts) {
    opts = opts || {};
    var s = App.state;
    if (!s.today) App.gen.day();
    if (s.today.published) return null;
    var slots = App.slots();
    var taken = {};

    slots.filter(function (sl) { return sl.role !== 'ad' && sl.role !== 'fixed'; }).forEach(function (sl) {
      var best = null, bestScore = -1;
      s.today.stories.forEach(function (st) {
        if (taken[st.id]) return;
        var fit = Engine.slotFit(st, sl);
        if (opts.sloppy) fit = 100 - fit;
        if (fit > bestScore) { bestScore = fit; best = st; }
      });
      if (best) { s.today.assignments[sl.id] = best.id; taken[best.id] = true; }
    });
    slots.filter(function (sl) { return sl.role === 'ad'; }).forEach(function (sl, i) {
      var ad = s.today.ads[i];
      if (ad) s.today.assignments[sl.id] = ad.id;
    });

    var lead = leadStory();
    if (!lead) return null;
    var style = Data.HEADLINE_STYLES.filter(function (x) { return x.id === (opts.headline || 'objective'); })[0]
      || Data.HEADLINE_STYLES[0];
    s.today.headlineStyle = style.id;
    s.today.headline = App.roll(function (r) {
      return (style.prefix + r.pick(Data.HEADLINE_DRESS[style.mood]).replace('{h}', lead.title)).toUpperCase();
    });
    /* Auto-play always refuses the bribe and prints through breaking news, so
     * the simulation measures the economy rather than the dialogs. */
    s.today.spikeOffered = true;
    s.today.breakingOffered = true;
    App.silentPress = true;
    doPress();
    App.silentPress = false;
    return s.lastEdition;
  };

  App.simulate = function (days, opts) {
    var out = [];
    for (var i = 0; i < days; i++) {
      var ed = App.autoPlayDay(opts);
      if (ed) out.push(ed);
      App.endDayQuiet();
    }
    return out;
  };

  /* =========================================================================
   * RESULTS — the morning after
   * ====================================================================== */
  App.screens.results = {
    render: function () {
      var s = App.state;
      var ed = s.lastEdition;
      if (!ed) { App.go('office'); return h('div'); }

      return h('div.screen.screen--results', {}, [
        App.topbar('newsroom'),
        h('div.results', {}, [
          h('div.results__left', {}, [renderPrintedFront(ed), renderRivals(ed)]),
          h('div.results__right', {}, [renderLedger(ed), renderReactions(), renderSleep()])
        ])
      ]);
    }
  };

  function renderPrintedFront(ed) {
    return App.panel('It printed', [
      h('div.printed', { 'data-testid': 'printed-front' }, [
        h('div.masthead', {}, [
          h('div.masthead__rule'),
          h('h1.masthead__name', { text: ed.paperName }),
          h('div.masthead__line', { text: ed.dateLine + ' · ' + App.num(ed.copies) + ' copies' }),
          h('div.masthead__rule')
        ]),
        h('h2.headline.headline--printed', { 'data-testid': 'printed-headline', text: ed.headlineText }),
        h('p.printed__sub', { text: ed.leadTitle + (ed.leadPhoto ? ' · ' + ed.leadPhoto : '') }),
        h('div.printed__marks', {}, [
          mark('Quality', Math.round(ed.quality)),
          mark('Reader mood', Math.round(ed.satisfaction)),
          mark('Typos', ed.typos, ed.typos > 0)
        ]),
        ed.missedBreaking ? h('p.printed__miss', { text: 'You printed while the story broke elsewhere. Readers noticed.' }) : null,
        ed.invResult ? h('p.printed__inv' + (ed.invResult.amount >= 0 ? '.is-good' : '.is-bad'), {
          'data-testid': 'inv-result',
          text: investigationLine(ed.invResult)
        }) : null
      ])
    ], { testid: 'panel-printed' });
  }

  function investigationLine(res) {
    var map = {
      vindicated: 'The investigation held up completely. Other papers are chasing you.',
      published: 'The investigation ran. Nobody has denied it yet.',
      disputed: 'The subject disputes everything and you cannot quite prove it.',
      thin: 'It read as thin, and it was. A quiet correction is being drafted.',
      debunked: 'It fell apart within hours. That one hurt.',
      lawsuit: 'Their lawyers wrote before lunch. Settlement paid.'
    };
    return map[res.outcome] + ' ' + (res.amount >= 0 ? '+' : '') + App.money(res.amount);
  }

  function mark(label, value, bad) {
    return h('div.mark' + (bad ? '.mark--bad' : ''), {}, [
      h('span.mark__v', { text: value }), h('span.mark__l', { text: label })
    ]);
  }

  function renderLedger(ed) {
    return App.panel('The ledger', [
      h('div.ledger', { 'data-testid': 'ledger' }, [
        line('Copies sold', App.num(ed.copies)),
        line('Cover sales', App.money(ed.revenue)),
        line('Advertising', App.money(ed.adRevenue)),
        line('Wages, paper, rent', App.money(-ed.expenses)),
        ed.invResult && ed.invResult.amount ? line('Investigation', App.money(ed.invResult.amount)) : null,
        h('div.ledger__rule'),
        line(ed.profit >= 0 ? 'Profit' : 'Loss', App.money(ed.profit), ed.profit >= 0 ? 'good' : 'bad'),
        line('In the account', App.money(App.state.money))
      ])
    ], { testid: 'panel-ledger' });
  }

  function line(label, value, tone) {
    return h('div.ledger__line' + (tone ? '.ledger__line--' + tone : ''), {}, [
      h('span', { text: label }), h('span', { text: value })
    ]);
  }

  function renderReactions() {
    var groups = App.state.today.groupResults || [];
    return App.panel('Who liked it', groups.map(function (g) {
      return h('div.reaction', { 'data-testid': 'reaction' }, [
        h('span.reaction__name', { text: g.name }),
        h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(g.satisfaction) + '%' })]),
        h('span.reaction__delta' + (g.delta >= 0 ? '.is-good' : '.is-bad'), {
          text: (g.delta >= 0 ? '+' : '') + App.num(g.delta)
        })
      ]);
    }), { testid: 'panel-reactions' });
  }

  function renderRivals(ed) {
    return App.panel('What the others led with', (ed.rivals || []).map(function (r) {
      return h('div.rival', {}, [
        h('span.rival__name', { text: r.name }),
        h('span.rival__head', { text: r.headline })
      ]);
    }), { testid: 'panel-rivals' });
  }

  function renderSleep() {
    var s = App.state;
    var canReprint = s.lastEdition && !s.lastEdition.lateEdition && s.money > 400;
    return h('div.sleepbar', {}, [
      canReprint ? h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'late-edition',
        text: 'Run a late edition · ' + App.money(380),
        onclick: function () {
          /* A 9pm reprint: costs money, buys back some of the day. */
          s.money -= 380;
          var extra = Math.round(s.lastEdition.copies * 0.14);
          s.lastEdition.copies += extra;
          s.lastEdition.lateEdition = true;
          s.money = Engine.round(s.money + extra * s.coverPrice * 0.5, 2);
          s.circulation += extra;
          App.toast('Late edition on the streets by nine. ' + App.num(extra) + ' extra copies.', 'good');
          App.go('results');
        }
      }) : null,
      h('p.sleepbar__note', { text: 'The presses are cooling. Tomorrow the phone starts at six.' }),
      h('button.btn.btn--print', {
        'data-testid': 'sleep', text: 'Sleep',
        onclick: function () { App.endDay(); }
      })
    ]);
  }

  /* =========================================================================
   * END OF DAY
   * ====================================================================== */
  /* endDay without the navigation, for the simulator. */
  App.endDayQuiet = function () {
    App.silentPress = true;
    App.endDay();
    App.silentPress = false;
  };

  App.endDay = function () {
    var s = App.state;
    var prevDate = Engine.dateFromDay(s.day, s.startYear);
    s.day += 1;
    var nowDate = Engine.dateFromDay(s.day, s.startYear);

    /* --- weather: yesterday's forecast is checked this morning --- */
    if (s.lastForecast) {
      var actual = App.roll(function (r) { return r.pick(Data.WEATHER_KINDS).id; });
      if (Engine.weatherHit(s.lastForecast, actual)) {
        s.stats.weatherRight += 1;
        s.readers.retirees && (s.readers.retirees.loyalty = Engine.clamp(s.readers.retirees.loyalty + 0.8, 0, 100));
      } else {
        s.stats.weatherWrong += 1;
        s.readers.retirees && (s.readers.retirees.loyalty = Engine.clamp(s.readers.retirees.loyalty - 0.5, 0, 100));
      }
    }

    /* --- loans accrue daily and are called on the due date --- */
    s.loans.forEach(function (loan) {
      if (loan.balance <= 0) return;
      loan.balance = Engine.round(loan.balance + Engine.loanInterest(loan.balance, loan.ratePerDay), 2);
      if (Engine.loanIsCallable(loan, s.day)) {
        var take = Math.min(loan.balance, Math.max(0, s.money));
        s.money = Engine.round(s.money - take, 2);
        loan.balance = Engine.round(loan.balance - take, 2);
        if (loan.balance <= 0.5) {
          loan.balance = 0;
          s.stats.loansCleared += 1;
          App.toast(loan.name + ' is paid off.', 'good');
        } else {
          loan.dueDay = s.day + 14;
          s.reputation.professionalism = Engine.clamp(s.reputation.professionalism - 2, 0, 100);
          App.toast(loan.name + ' extended the term. They were not pleased.', 'bad');
        }
      }
    });

    /* --- rivals run their own papers --- */
    App.roll(function (r) {
      (s.rivals || []).forEach(function (rv) {
        rv.quality = Engine.clamp(rv.quality + r.int(-4, 4), 25, 92);
        rv.circulation = Engine.rivalDayResult(rv, s.city.population, r);
        /* Reactive rivals: they differentiate against your identity. */
        if (s.identity && s.identity.tag && rv.taste && rv.taste.indexOf(s.identity.tag) >= 0 && r.chance(0.2)) {
          rv.taste = rv.taste.filter(function (t) { return t !== s.identity.tag; });
          if (!rv.taste.length) rv.taste = ['Community'];
        }
        if (s.lastEdition) rv.yearEditions.push({ quality: rv.quality, copies: rv.circulation });
      });
    });

    /* --- newsprint price shocks --- */
    if (s.paperShock && s.day >= s.paperShock.untilDay) s.paperShock = null;
    if (!s.paperShock) {
      App.roll(function (r) {
        if (r.chance(0.02)) {
          var shock = r.pick(Data.PAPER_SHOCKS);
          s.paperShock = { id: shock.id, name: shock.name, multiplier: shock.multiplier,
            untilDay: s.day + shock.days, blurb: shock.blurb };
          App.toast(shock.name + '. ' + shock.blurb, shock.multiplier > 1 ? 'bad' : 'good');
        }
      });
    }

    /* --- union: a good year means a pay negotiation --- */
    if (s.day % 84 === 0 && s.staff.length >= 3 && !s.union) {
      var demand = Engine.unionDemand(s.staff, s.profitHistory);
      if (demand.risePercent > 3) {
        s.union = { risePercent: demand.risePercent, cost: demand.cost, day: s.day, status: 'open' };
        App.toast('The staff have asked for a ' + demand.risePercent + '% rise.', 'bad');
      }
    }

    /* --- the election is decided, partly by your coverage --- */
    if (s.election && !s.election.result && s.day >= s.election.resultDay) {
      s.election.result = App.roll(function (r) {
        return Engine.electionResult(s.election.candidates, s.election.coverage, s.city.mood, r);
      });
      App.toast(s.election.result[0].name + ' has won the election.', 'good');
    }

    /* --- the annual awards --- */
    if (nowDate.year !== prevDate.year) {
      App.runCeremony(prevDate.year);
      if (App.silentPress) delete s.pendingCeremony;   /* the simulator does not attend */
    }

    /* Investigations advance for whoever is assigned. */
    s.investigations.forEach(function (inv) {
      if (inv.status !== 'open') return;
      inv.days += 1;
      var crew = s.staff.filter(function (st) { return inv.assigned.indexOf(st.id) >= 0; });
      if (crew.length) {
        inv.evidence = App.roll(function (r) { return Engine.investigationProgress(inv, crew, r); });
        /* INVARIANT: a single source cannot carry a story past 70. Two
         * independent accounts are what turn a rumour into journalism. */
        inv.sourceCount = inv.sourceCount || 1;
        inv.evidence = Engine.clamp(inv.evidence, 0, Engine.evidenceCeiling(inv.sourceCount));
        /* The archive pays rent: prior coverage of this subject means you
         * already know who to call. Requires the Archive Room upgrade. */
        if (App.hasUpgrade('archive')) {
          var rel = Engine.archiveRelevance(s.archive, inv.category, s.day);
          if (rel.bonus > 0 && !inv.archiveCredited) {
            inv.evidence = Engine.clamp(inv.evidence + rel.bonus, 0, 100);
            inv.archiveCredited = rel.bonus;
          }
        }
      }
    });

    /* Staff tire; coffee helps. */
    var load = {
      pages: s.pageCount,
      investigations: s.investigations.filter(function (i) { return i.status === 'open'; }).length,
      staffCount: s.staff.length,
      coffee: App.hasUpgrade('coffee'),
      plants: App.hasUpgrade('plants'),
      restDay: Engine.dateFromDay(s.day, s.startYear).isSunday
    };
    s.staff.forEach(function (st) {
      st.energy = Engine.clamp(st.energy + Engine.energyChange(st, load), 5, 100);
      st.experience += 1;
      if (st.experience % 14 === 0) {
        st.accuracy = Engine.clamp(st.accuracy + 3, 0, 100);
        st.creativity = Engine.clamp(st.creativity + 2, 0, 100);
      }
      st.mood = st.energy < 40 ? 'worn out' : (st.energy < 70 ? 'tired' : 'settled');
    });

    /* Burnout with teeth, and rivals poaching your best people. */
    App.roll(function (r) {
      var leavers = [];
      s.staff.forEach(function (st) {
        if (r.chance(Engine.burnoutRisk(st))) { leavers.push({ st: st, why: 'burnout' }); return; }
        var strong = (st.speed + st.accuracy + st.creativity) / 3;
        if (strong > 74 && s.lastEdition && s.lastEdition.quality > 72 && r.chance(0.06)) {
          leavers.push({ st: st, why: 'poached' });
        }
      });
      leavers.forEach(function (l) {
        s.staff = s.staff.filter(function (x) { return x.id !== l.st.id; });
        s.investigations.forEach(function (inv) {
          inv.assigned = inv.assigned.filter(function (x) { return x !== l.st.id; });
        });
        /* A departing reporter takes their sources with them. */
        Data.SOURCES.forEach(function (src) {
          if (src.feeds.indexOf(l.st.specialty) >= 0) {
            s.sources[src.id] = Engine.clamp((s.sources[src.id] || 35) - 12, 0, 100);
          }
        });
        App.toast(l.st.name + (l.why === 'burnout' ? ' has resigned. They were exhausted.' : ' was poached by a rival.'), 'bad');
      });
      /* Staff with politics resign over an editorial line they cannot stomach. */
      s.staff.slice().forEach(function (st) {
        var clash = Engine.staffPoliticsClash(st, s.editorialStances);
        if (clash > 0.5 && r.chance(clash * 0.12)) {
          s.staff = s.staff.filter(function (x) { return x.id !== st.id; });
          App.toast(st.name + ' resigned over the line the paper is taking.', 'bad');
        }
      });

      /* Mentorship: a senior paired with a junior passes on the craft. */
      s.staff.forEach(function (st) {
        if (!st.mentor) return;
        var senior = s.staff.filter(function (x) { return x.id === st.mentor; })[0];
        if (!senior) { st.mentor = null; return; }
        var gain = Engine.mentorshipGain(senior, st);
        st.accuracy = Engine.clamp(st.accuracy + gain, 0, 100);
        st.creativity = Engine.clamp(st.creativity + gain * 0.7, 0, 100);
      });

      /* Sickness and leave. */
      s.staff.forEach(function (st) {
        if (st.away && st.away <= s.day) { st.away = null; }
        else if (!st.away && r.chance(0.012)) {
          st.away = s.day + r.int(2, 6);
          App.toast(st.name + ' is off sick until day ' + st.away + '.');
        }
      });

      /* Somebody leaks tomorrow's front page. */
      if (s.lastEdition && r.chance(0.03) && s.staff.length) {
        var leaker = r.pick(s.staff);
        s.leak = { day: s.day, who: leaker.name };
        App.toast('Your front page leaked to a rival. Somebody talked.', 'bad');
      }

      /* Interns grow into reporters. */
      s.staff.forEach(function (st) {
        if (st.role === 'intern' && st.experience >= 40) {
          st.role = 'reporter';
          st.salary = App.salaryFor(st);
          App.toast(st.name + ' is a reporter now.', 'good');
        }
      });
    });

    /* The city drifts. */
    App.roll(function (r) {
      s.city.population = Math.round(s.city.population * (1 + (r.next() - 0.42) * 0.004));
      s.city.mood = Engine.clamp(s.city.mood + r.int(-3, 3), 10, 95);
      s.city.economy = Engine.clamp(s.city.economy + r.int(-2, 2), 10, 95);
    });

    /* Real bankruptcy: no loan left to take and deep in the red. */
    var owedTotal = Engine.sum(s.loans, function (l) { return l.balance; });
    if (s.money < -1500 && owedTotal > 0 && s.money - owedTotal < -8000) {
      App.gameOver('The paper could not cover its debts. The press was sold on a wet Tuesday.');
      return;
    }
    if (s.money < -3000) {
      App.ask('The bank called',
        'You are ' + App.money(-s.money) + ' under. Sell the press and close the paper, or keep printing and hope.',
        function () { App.wipe(); App.go('boot'); }, 'Close the paper');
    }

    s.lastForecast = null;
    App.gen.day();
    if (s.today && s.today.forecast) s.lastForecast = s.today.forecast.id;
    App.checkAchievements();
    App.save(true);
    if (!App.silentPress) App.go('office');
  };

  /* ---------- achievements ----------
   * Pure read of state; safe to call as often as you like. */
  App.checkAchievements = function () {
    var s = App.state;
    Data.ACHIEVEMENTS.forEach(function (a) {
      if (s.achievements.indexOf(a.id) >= 0) return;
      var ok = false;
      try { ok = a.test(s); } catch (e) { ok = false; }
      if (ok) {
        s.achievements.push(a.id);
        App.toast('Achievement: ' + a.name, 'good');
      }
    });
  };

  /* ---------- the annual ceremony ----------
   * Judged from the archive. Rivals are scored on their own year so this is a
   * contest, not a participation trophy. */
  App.runCeremony = function (year) {
    var s = App.state;
    if (s.lastCeremonyYear === year) return;
    s.lastCeremonyYear = year;

    var yearStart = (year - s.startYear) * Engine.DAYS_PER_MONTH * Engine.MONTHS_PER_YEAR + 1;
    var yearEnd = yearStart + Engine.DAYS_PER_MONTH * Engine.MONTHS_PER_YEAR - 1;
    var mine = s.archive.filter(function (e) { return e.day >= yearStart && e.day <= yearEnd; });
    if (mine.length < 5) return;   /* too few editions to judge */

    var myYear = Engine.scoreYear(mine);
    var results = [];
    Data.AWARDS.forEach(function (award) {
      var myScore = award.score(myYear);
      var best = { name: s.paper.name, score: myScore, isYou: true };
      (s.rivals || []).forEach(function (rv) {
        var eds = (rv.yearEditions || []).slice(-mine.length);
        if (!eds.length) return;
        var rvYear = {
          editions: eds.length,
          avgQuality: Engine.avg(eds, function (e) { return e.quality; }),
          bestQuality: Math.max.apply(null, eds.map(function (e) { return e.quality; })),
          totalCopies: Engine.sum(eds, function (e) { return e.copies; }),
          totalProfit: 0, investigations: Math.round(eds.length / 30),
          vindicated: Math.round(eds.length / 60), typos: Math.round(eds.length * 0.6),
          corrections: 0, photos: Math.round(eds.length * 0.5),
          localShare: 0.3, avgTruth: 55 + (rv.reputation - 50) * 0.4
        };
        var sc = award.score(rvYear);
        if (sc > best.score) best = { name: rv.name, score: sc, isYou: false };
      });
      results.push({ award: award, winner: best.name, isYou: best.isYou, score: Engine.round(best.score, 1) });
    });

    var won = results.filter(function (r) { return r.isYou; });
    won.forEach(function (r) { s.awardsWon.push({ year: year, awardId: r.award.id, name: r.award.name }); });
    if (won.length > (s.stats.bestAwardYear || 0)) s.stats.bestAwardYear = won.length;
    s.pendingCeremony = { year: year, results: results, myYear: myYear, editions: mine.length };
    (s.rivals || []).forEach(function (rv) { rv.yearEditions = []; });
    App.checkAchievements();
  };

  /* ---------- endgame ---------- */
  App.gameOver = function (reason) {
    var s = App.state;
    s.retired = true;
    s.endingReason = reason;
    App.save(true);
    App.go('ending');
  };
})();

</script>
<!-- ==== app_extras.js ==== -->
<script>
/* ===========================================================================
 * app_extras.js — the screens that are not the loop: hiring, equipment,
 * the archive, and the reader/reputation read-out.
 * ======================================================================== */
(function () {
  'use strict';
  var h = App.h;

  /* =========================================================================
   * STAFF
   * ====================================================================== */

  /* Candidates are DERIVED, not stored: seeded off (seed, day) so the same
   * day always shows the same three people, across re-renders and reloads,
   * without ever touching state.rngCursor. */
  function candidatesForToday() {
    var s = App.state;
    var r = Engine.rng((s.seed ^ (s.day * 7919)) >>> 0);
    var roles = Data.STAFF_ROLES;
    var out = [];
    for (var i = 0; i < 3; i++) {
      var role = r.pick(roles).id;
      var c = App.makeStaff(r, role, r.pick(Data.STAFF_NAMES));
      c.id = 'cand-' + s.day + '-' + i;
      c.salary = App.salaryFor(c);
      out.push(c);
    }
    return out;
  }
  App.candidatesForToday = candidatesForToday;

  App.screens.staff = {
    render: function () {
      var s = App.state;
      var tier = App.officeTier();
      return h('div.screen', {}, [
        App.topbar('staff'),
        h('div.two', {}, [
          App.panel('On the payroll', [
            h('p.panel__note', {
              text: s.staff.length + ' of ' + tier.desks + ' desks used · '
                + App.money(Engine.sum(s.staff, function (x) { return x.salary; })) + '/day in wages'
            }),
            /* Never pass staffCard straight to .map — the index arrives as the
             * isCandidate flag and every staffer after the first grows a Hire
             * button that clones them for free. */
            h('div.staffgrid', { 'data-testid': 'staff-list' }, s.staff.length
              ? s.staff.map(function (p) { return staffCard(p, false); })
              : [h('p.daycard__empty', { text: 'Nobody works here. That is going to show in the paper.' })])
          ], { testid: 'panel-staff' }),
          App.panel('At the door', [
            h('p.panel__note', { text: 'Three people came in today. Tomorrow they will have found something else.' }),
            h('div.staffgrid', { 'data-testid': 'candidates' }, candidatesForToday().map(function (c) {
              return staffCard(c, true);
            }))
          ], { testid: 'panel-hire' })
        ])
      ]);
    }
  };

  function staffCard(person, isCandidate) {
    var s = App.state;
    var role = Data.STAFF_ROLES.filter(function (r) { return r.id === person.role; })[0] || { label: person.role, effect: '' };
    var full = s.staff.length >= App.officeTier().desks;

    return h('article.card.card--staff', { 'data-testid': isCandidate ? 'candidate' : 'staffer' }, [
      h('div.card__top', {}, [
        h('span.tag.tag--role', { text: role.label }),
        h('span.tag', { text: person.specialty })
      ]),
      h('div.staffcard__head', {}, [
        App.sprite('reporter', 34),
        h('div', {}, [
          h('h3.card__title', { text: person.name }),
          h('span.staffcard__mood', { text: isCandidate ? App.money(person.salary) + '/day' : person.mood + ' · ' + App.money(person.salary) + '/day' })
        ])
      ]),
      h('div.card__stats', {}, [
        bar('Speed', person.speed), bar('Accuracy', person.accuracy), bar('Craft', person.creativity),
        isCandidate ? null : bar('Energy', person.energy)
      ]),
      h('p.staffcard__effect', { text: role.effect }),
      (!isCandidate && person.role === 'reporter') ? h('div', {}, [
        h('span.card__foot', { text: 'Beat' }),
        h('div.chips', { 'data-testid': 'beats-' + person.id }, ['Politics', 'Crime', 'Sports', 'Business', 'Community'].map(function (cat) {
          return h('button.chip' + (person.beat === cat ? '.chip--on' : ''), {
            'data-testid': 'beat-' + cat, text: cat,
            onclick: function () {
              person.beat = person.beat === cat ? null : cat;
              App.save(true);
              App.go('staff');
            }
          });
        }))
      ]) : null,
      isCandidate
        ? h('button.btn.btn--small', {
          'data-testid': 'hire-' + person.role,
          disabled: full,
          text: full ? 'No desk free' : 'Hire',
          onclick: function () {
            if (s.staff.length >= App.officeTier().desks) { App.toast('No desk free. Move office first.', 'bad'); return; }
            var hire = JSON.parse(JSON.stringify(person));
            hire.id = 'st-' + s.day + '-' + Math.floor(Math.random() * 9999);
            s.staff.push(hire);
            s.money -= person.salary * 3;   /* three days up front */
            App.toast(person.name + ' starts tomorrow.', 'good');
            App.save(true);
            App.go('staff');
          }
        })
        : h('button.btn.btn--ghost.btn--small', {
          'data-testid': 'fire-' + person.id, text: 'Let go',
          onclick: function () {
            App.ask('Let ' + person.name + ' go?',
              'Wages stop tonight. Their open investigations carry on without them.',
              function () {
                s.staff = s.staff.filter(function (x) { return x.id !== person.id; });
                s.investigations.forEach(function (inv) {
                  inv.assigned = inv.assigned.filter(function (x) { return x !== person.id; });
                });
                s.reputation.professionalism = Engine.clamp(s.reputation.professionalism - 1, 0, 100);
                App.go('staff');
              }, 'Let them go');
          }
        })
    ]);
  }

  function bar(label, value) {
    return h('div.meter', {}, [
      h('span.meter__label', { text: label }),
      h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(value) + '%' })]),
      h('span.meter__num', { text: Math.round(value) })
    ]);
  }

  /* =========================================================================
   * SHOP
   * ====================================================================== */
  App.screens.shop = {
    render: function () {
      var s = App.state;
      return h('div.screen', {}, [
        App.topbar('office'),
        h('div.one', {}, [
          App.panel('Equipment', [
            h('p.panel__note', { text: 'Bought once, kept forever. Everything here also turns up as furniture in the office.' }),
            h('div.shopgrid', { 'data-testid': 'shop-list' }, Data.UPGRADES.map(function (u) {
              var owned = App.hasUpgrade(u.id);
              var locked = u.requires && !App.hasUpgrade(u.requires);
              return h('article.card.card--shop' + (owned ? '.card--owned' : ''), { 'data-testid': 'upgrade-' + u.id }, [
                h('div.shopcard__head', {}, [
                  App.sprite(u.sprite, 40),
                  h('div', {}, [
                    h('h3.card__title', { text: u.name }),
                    h('span.card__foot', { text: owned ? 'Owned' : App.money(u.cost) })
                  ])
                ]),
                h('p.card__copy', { text: u.blurb }),
                locked ? h('span.card__foot', { text: 'Needs the earlier model first.' }) : null,
                owned ? null : h('button.btn.btn--small', {
                  'data-testid': 'buy-' + u.id,
                  disabled: locked || s.money < u.cost,
                  text: 'Buy',
                  onclick: function () {
                    s.money -= u.cost;
                    s.upgrades.push(u.id);
                    App.toast(u.name + ' delivered.', 'good');
                    App.save(true);
                    App.go('shop');
                  }
                })
              ]);
            })),
            h('button.btn.btn--ghost.btn--small', {
              'data-testid': 'shop-back', text: 'Back to the office',
              onclick: function () { App.go('office'); }
            })
          ], { testid: 'panel-shop' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * ARCHIVE — the long game. Every edition, forever.
   * ====================================================================== */
  App.screens.archive = {
    render: function (params) {
      var s = App.state;
      var idx = params.index !== undefined ? params.index : s.archive.length - 1;

      if (!s.archive.length) {
        return h('div.screen', {}, [
          App.topbar('archive'),
          h('div.one', {}, [App.panel('The archive', [
            h('p.daycard__empty', { text: 'Empty. It fills one edition at a time, and it never empties again.' })
          ], { testid: 'panel-archive' })])
        ]);
      }

      idx = Engine.clamp(idx, 0, s.archive.length - 1);
      var ed = s.archive[idx];

      return h('div.screen', {}, [
        App.topbar('archive'),
        h('div.two.two--archive', {}, [
          App.panel('Bound volumes', [
            h('p.panel__note', { text: s.archive.length + ' edition' + (s.archive.length === 1 ? '' : 's') + ' on the shelf.' }),
            h('div.volumes', { 'data-testid': 'volume-list' }, s.archive.map(function (e, i) {
              return h('button.volume' + (i === idx ? '.volume--on' : ''), {
                'data-testid': 'volume-' + i,
                onclick: function () { App.go('archive', { index: i }); }
              }, [
                h('span.volume__date', { text: e.dateLine }),
                h('span.volume__head', { text: e.headlineText }),
                h('span.volume__meta', { text: App.num(e.copies) + ' copies · q' + Math.round(e.quality) })
              ]);
            }).reverse())
          ], { testid: 'panel-volumes' }),

          App.panel('Edition', [
            h('div.printed.printed--archive', { 'data-testid': 'archive-edition' }, [
              h('div.masthead', {}, [
                h('div.masthead__rule'),
                h('h1.masthead__name', { text: ed.paperName }),
                h('div.masthead__line', { text: ed.dateLine + ' · ' + ed.pageCount + ' pages · ' + ed.identity }),
                h('div.masthead__rule')
              ]),
              h('h2.headline.headline--printed', { 'data-testid': 'archive-headline', text: ed.headlineText }),
              h('p.printed__sub', { text: ed.leadTitle }),
              h('p.printed__weather', { text: 'Weather that day: ' + (ed.weather || 'unrecorded') }),
              h('div.archive__inside', {}, [
                h('h4', { text: 'Inside' }),
                h('ul.archive__list', {}, ed.stories.map(function (st) {
                  return h('li', { text: st.title + '  (' + st.category + ')' });
                }))
              ]),
              ed.ads.length ? h('p.archive__ads', { text: 'Advertisers: ' + ed.ads.join(', ') }) : null,
              h('div.printed__marks', {}, [
                mark('Quality', Math.round(ed.quality)),
                mark('Copies', App.num(ed.copies)),
                mark(ed.profit >= 0 ? 'Profit' : 'Loss', App.money(Math.abs(ed.profit)))
              ]),
              h('div.archive__nav', {}, [
                h('button.btn.btn--ghost.btn--small', {
                  'data-testid': 'archive-prev', disabled: idx <= 0, text: '← Older',
                  onclick: function () { App.go('archive', { index: idx - 1 }); }
                }),
                h('button.btn.btn--ghost.btn--small', {
                  'data-testid': 'archive-next', disabled: idx >= s.archive.length - 1, text: 'Newer →',
                  onclick: function () { App.go('archive', { index: idx + 1 }); }
                })
              ])
            ])
          ], { testid: 'panel-archive' })
        ])
      ]);
    }
  };

  function mark(label, value, bad) {
    return h('div.mark' + (bad ? '.mark--bad' : ''), {}, [
      h('span.mark__v', { text: value }), h('span.mark__l', { text: label })
    ]);
  }

  /* =========================================================================
   * READERS — analytics and reputation
   * ====================================================================== */
  App.screens.readers = {
    render: function () {
      var s = App.state;
      var repKeys = [
        ['truth', 'Truthfulness'], ['entertainment', 'Entertainment'],
        ['professionalism', 'Professionalism'], ['localTrust', 'Local trust'],
        ['investigation', 'Investigation'], ['humor', 'Humour']
      ];

      var top = Object.keys(s.tagCounts).sort(function (a, b) { return s.tagCounts[b] - s.tagCounts[a]; }).slice(0, 6);

      return h('div.screen', {}, [
        App.topbar('readers'),
        h('div.two', {}, [
          App.panel('Who reads you', [
            h('div.readers', { 'data-testid': 'reader-list' }, Data.READER_GROUPS.map(function (g) {
              var rec = s.readers[g.id] || { loyalty: 0, readers: 0 };
              return h('div.readerrow', {}, [
                h('div.readerrow__head', {}, [
                  h('span.readerrow__name', { text: g.name }),
                  h('span.readerrow__num', { text: App.num(rec.readers) + ' readers' })
                ]),
                h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(rec.loyalty) + '%' })]),
                h('span.readerrow__likes', { text: 'Wants: ' + g.likes.join(', ') })
              ]);
            }))
          ], { testid: 'panel-readers', aside: App.num(s.circulation) + ' copies' }),

          h('div', {}, [
            App.panel('Reputation', [
              h('div.repgrid', { 'data-testid': 'reputation' }, repKeys.map(function (pair) {
                return h('div.reprow', {}, [
                  h('span.reprow__k', { text: pair[1] }),
                  h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(s.reputation[pair[0]]) + '%' })]),
                  h('span.reprow__v', { text: Math.round(s.reputation[pair[0]]) })
                ]);
              }))
            ], { testid: 'panel-reputation' }),

            App.panel('What you actually print', [
              top.length
                ? h('div.tagcloud', {}, top.map(function (t) {
                  return h('span.tagcount', { text: t + ' ×' + s.tagCounts[t] });
                }))
                : h('p.daycard__empty', { text: 'Nothing yet. The city has no idea who you are.' }),
              h('p.identity', { 'data-testid': 'identity-line' }, [
                h('span.identity__label', { text: 'Readers call you' }),
                h('strong.identity__name', { text: s.identity.name })
              ])
            ], { testid: 'panel-identity' })
          ])
        ])
      ]);
    }
  };
})();

</script>
<!-- ==== app_meta.js ==== -->
<script>
/* ===========================================================================
 * app_meta.js — the screens that sit outside the daily loop: the annual
 * awards ceremony, achievements, the front page wall, visual themes, and the
 * ending. These read state and rarely write it.
 * ======================================================================== */
(function () {
  'use strict';
  var h = App.h;

  /* =========================================================================
   * AWARDS CEREMONY
   * Triggered by App.runCeremony() at year rollover, which parks the results
   * on state.pendingCeremony. The office screen routes here when it sees one.
   * ====================================================================== */
  App.screens.ceremony = {
    render: function () {
      var s = App.state;
      var c = s.pendingCeremony;
      if (!c) { App.go('office'); return h('div'); }
      var won = c.results.filter(function (r) { return r.isYou; });

      return h('div.screen', {}, [
        App.topbar('office'),
        h('div.one', {}, [
          App.panel('The ' + c.year + ' Press Awards', [
            h('p.panel__note', {
              text: c.editions + ' editions judged · average quality '
                + Math.round(c.myYear.avgQuality) + ' · ' + App.num(c.myYear.totalCopies) + ' copies sold'
            }),
            h('div.awards', { 'data-testid': 'award-list' }, c.results.map(function (r) {
              return h('div.award' + (r.isYou ? '.award--won' : ''), { 'data-testid': 'award-row' }, [
                h('div.award__head', {}, [
                  h('span.award__name', { text: r.award.name }),
                  h('span.award__winner', { text: r.winner })
                ]),
                h('p.award__blurb', { text: r.award.blurb }),
                r.isYou ? h('span.award__ribbon', { text: 'WON' }) : null
              ]);
            })),
            h('p.ceremony__verdict', {
              'data-testid': 'ceremony-verdict',
              text: won.length === 0
                ? 'Nothing this year. The table clapped politely and went back to the wine.'
                : (won.length === 1
                  ? 'One award. Somebody cried in the taxi and will deny it.'
                  : won.length + ' awards. The newsroom did not open until eleven the next morning.')
            }),
            h('button.btn.btn--go', {
              'data-testid': 'close-ceremony', text: 'Back to work',
              onclick: function () {
                delete App.state.pendingCeremony;
                App.save(true);
                App.go('office');
              }
            })
          ], { testid: 'panel-ceremony' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * TROPHIES — achievements, awards won, and the front page wall
   * ====================================================================== */
  App.screens.trophies = {
    render: function () {
      var s = App.state;
      /* The wall shows your best front pages, judged on quality. */
      var wall = s.archive.slice().sort(function (a, b) { return b.quality - a.quality; }).slice(0, 6);

      return h('div.screen', {}, [
        App.topbar('archive'),
        h('div.two', {}, [
          h('div', {}, [
            App.panel('The wall', [
              wall.length
                ? h('div.wall', { 'data-testid': 'wall' }, wall.map(function (ed) {
                  return h('div.wall__frame', {}, [
                    h('div.wall__date', { text: ed.dateLine }),
                    h('div.wall__head', { text: ed.headlineText }),
                    h('div.wall__meta', { text: 'quality ' + Math.round(ed.quality) + ' · ' + App.num(ed.copies) + ' copies' })
                  ]);
                }))
                : h('p.daycard__empty', { text: 'Nothing framed yet. Print something worth keeping.' })
            ], { testid: 'panel-wall' }),

            App.panel('Awards', [
              s.awardsWon.length
                ? h('div.chips', {}, s.awardsWon.map(function (a) {
                  return h('span.tagcount', { text: a.name + ' · ' + a.year });
                }))
                : h('p.daycard__empty', { text: 'No awards yet. They are judged each December.' })
            ], { testid: 'panel-awards' })
          ]),

          App.panel('Achievements', [
            h('p.panel__note', { text: s.achievements.length + ' of ' + Data.ACHIEVEMENTS.length + ' unlocked' }),
            h('div.achlist', { 'data-testid': 'achievements' }, Data.ACHIEVEMENTS.map(function (a) {
              var got = s.achievements.indexOf(a.id) >= 0;
              return h('div.ach' + (got ? '.ach--on' : ''), {}, [
                h('span.ach__mark', { text: got ? '★' : '·' }),
                h('div', {}, [
                  h('span.ach__name', { text: got ? a.name : '???' }),
                  h('span.ach__blurb', { text: a.blurb })
                ])
              ]);
            }))
          ], { testid: 'panel-achievements' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * THEMES — cosmetic only, applied as a data-theme attribute on <body>
   * ====================================================================== */
  App.applyTheme = function () {
    document.body.setAttribute('data-theme', App.state ? App.state.theme : 'newsprint');
  };

  App.screens.themes = {
    render: function () {
      var s = App.state;
      return h('div.screen', {}, [
        App.topbar('office'),
        h('div.one', {}, [
          App.panel('How the paper looks', [
            h('p.panel__note', { text: 'Cosmetic only. Nothing here changes a single number.' }),
            h('div.shopgrid', { 'data-testid': 'theme-list' }, Data.THEMES.map(function (t) {
              var owned = t.cost === 0 || (s.ownedThemes || []).indexOf(t.id) >= 0;
              var active = s.theme === t.id;
              return h('article.card.card--shop' + (active ? '.card--owned' : ''), { 'data-testid': 'theme-' + t.id }, [
                h('h3.card__title', { text: t.name }),
                h('p.card__copy', { text: t.blurb }),
                active
                  ? h('span.card__foot', { text: 'In use' })
                  : h('button.btn.btn--small', {
                    'data-testid': 'use-theme-' + t.id,
                    disabled: !owned && s.money < t.cost,
                    text: owned ? 'Use it' : 'Buy ' + App.money(t.cost),
                    onclick: function () {
                      if (!owned) {
                        s.money -= t.cost;
                        s.ownedThemes = (s.ownedThemes || []).concat([t.id]);
                      }
                      s.theme = t.id;
                      App.applyTheme();
                      App.save(true);
                      App.go('themes');
                    }
                  })
              ]);
            })),
            h('button.btn.btn--ghost.btn--small', {
              'data-testid': 'themes-back', text: 'Back to the office',
              onclick: function () { App.go('office'); }
            })
          ], { testid: 'panel-themes' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * ENDING
   * ====================================================================== */
  App.screens.ending = {
    render: function () {
      var s = App.state;
      var years = Math.max(1, Math.ceil(s.day / (Engine.DAYS_PER_MONTH * Engine.MONTHS_PER_YEAR)));
      var best = s.archive.slice().sort(function (a, b) { return b.quality - a.quality; })[0];

      return h('div.screen', {}, [
        h('div.boot', {}, [
          h('div.boot__masthead', {}, [
            h('div.boot__kicker', { text: 'Final edition' }),
            h('h1.boot__title', { text: s.paper.name }),
            h('div.boot__rule'),
            h('p.boot__sub', { text: s.endingReason || 'You put down the pen.' })
          ]),
          h('div.boot__panel', {}, [
            h('div.grid2', {}, [
              kv('Years in print', String(years)),
              kv('Editions', App.num(s.archive.length)),
              kv('Final circulation', App.num(s.circulation)),
              kv('Awards', String(s.awardsWon.length)),
              kv('Corrections printed', String(s.stats.correctionsPrinted)),
              kv('Stories spiked for money', String(s.stats.spikesTaken))
            ]),
            best ? h('p.daycard__lead', {}, [
              h('span.daycard__label', { text: 'Your best front page' }),
              h('em', { text: best.headlineText }),
              h('span.card__foot', { text: best.dateLine })
            ]) : null,
            h('p.boot__foot', {
              text: s.stats.spikesTaken > 0
                ? 'The archive remembers what you printed. It also remembers the gaps.'
                : 'You never once took the money. The archive is clean.'
            }),
            h('button.btn.btn--go', {
              'data-testid': 'start-again', text: 'Start a new paper',
              onclick: function () { App.wipe(); App.go('boot'); }
            })
          ])
        ])
      ]);
    }
  };

  function kv(label, value) {
    return h('div.kv', {}, [h('span.kv__k', { text: label }), h('span.kv__v', { text: value })]);
  }

  /* Retiring is a choice, not only a failure state. */
  App.retire = function () {
    App.ask('Hand over the paper?',
      'You keep the archive and the reputation. Somebody else gets the six o\'clock phone calls.',
      function () { App.gameOver('You retired, and the paper carried on without you.'); },
      'Retire');
  };
})();

</script>
<!-- ==== app_empire.js ==== -->
<script>
/* ===========================================================================
 * app_empire.js — everything above the daily paper: the city's districts,
 * property, other media, distribution, the proprietor, lawsuits, the archive
 * exporter, the daily challenge, office decorating, the darkroom, and
 * succession. These are the long-game screens.
 * ======================================================================== */
(function () {
  'use strict';
  var h = App.h;

  /* =========================================================================
   * THE CITY — districts, heat map, distribution, subscriptions
   * ====================================================================== */
  App.screens.city = {
    render: function () {
      var s = App.state;
      return h('div.screen', {}, [
        App.topbar('city'),
        h('div.two', {}, [
          h('div', {}, [renderDistricts(), renderHeatMap()]),
          h('div', {}, [renderDistribution(), renderSubscriptions(), renderRivalTable()])
        ])
      ]);
    }
  };

  function renderDistricts() {
    var s = App.state;
    return App.panel('The districts', [
      h('p.panel__note', { text: 'Cover a neighbourhood and it reads you. Ignore it and it drifts.' }),
      h('div.districts', { 'data-testid': 'districts' }, Data.DISTRICTS.map(function (d) {
        var rec = s.districts[d.id] || { loyalty: 0, readers: 0 };
        return h('div.district', {}, [
          h('div.district__head', {}, [
            h('span.district__name', { text: d.name }),
            h('span.district__num', { text: App.num(rec.readers) + ' readers' })
          ]),
          h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(rec.loyalty) + '%' })]),
          h('span.readerrow__likes', { text: 'Cares about: ' + d.likes.join(', ') })
        ]);
      }))
    ], { testid: 'panel-districts' });
  }

  function renderHeatMap() {
    var s = App.state;
    var pages = Object.keys(s.heatMap).sort(function (a, b) { return Number(a) - Number(b); });
    return App.panel('What actually gets read', [
      pages.length
        ? h('div.heat', { 'data-testid': 'heatmap' }, pages.map(function (p) {
          var v = s.heatMap[p];
          return h('div.heat__row', {}, [
            h('span.heat__page', { text: 'Page ' + p }),
            h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(v * 100) + '%' })]),
            h('span.heat__v', { text: Math.round(v * 100) + '%' })
          ]);
        }))
        : h('p.daycard__empty', { text: 'Print an edition and we will find out.' }),
      h('p.press__cost', { text: 'Front-page teasers pull readers deeper into the paper.' })
    ], { testid: 'panel-heat' });
  }

  function renderDistribution() {
    var s = App.state;
    return App.panel('Distribution', Data.DISTRIBUTION_DEALS.map(function (deal) {
      var active = s.distribution === deal.id;
      var locked = deal.needCirculation && s.circulation < deal.needCirculation;
      return h('div.press__row', {}, [
        h('span.press__label', { text: Math.round(deal.cut * 100) + '% cut' }),
        h('button.chip' + (active ? '.chip--on' : ''), {
          'data-testid': 'deal-' + deal.id,
          disabled: active || locked || s.money < deal.cost,
          title: deal.blurb + (locked ? ' Needs ' + App.num(deal.needCirculation) + ' copies.' : ''),
          text: deal.name + (deal.cost ? ' · ' + App.money(deal.cost) : ''),
          onclick: function () {
            s.money -= deal.cost;
            s.distribution = deal.id;
            App.toast('Terms signed.', 'good');
            App.save(true);
            App.go('city');
          }
        })
      ]);
    }).concat([
      h('p.press__cost', { text: 'The cut comes off every cover price before you see a penny.' })
    ]), { testid: 'panel-distribution' });
  }

  function renderSubscriptions() {
    var s = App.state;
    return App.panel('Subscriptions', [
      h('p.panel__note', { text: App.num(s.subscribers) + ' subscribers. They buy whatever you print.' }),
      h('div.press__row', {}, [
        h('span.press__label', { text: 'Daily drive spend' }),
        h('div.chips', { 'data-testid': 'sub-chips' }, [0, 60, 150, 320].map(function (amount) {
          return h('button.chip' + (s.subscriptionSpend === amount ? '.chip--on' : ''), {
            'data-testid': 'sub-' + amount,
            text: amount === 0 ? 'None' : App.money(amount) + '/day',
            onclick: function () { s.subscriptionSpend = amount; App.save(true); App.go('city'); }
          });
        }))
      ]),
      h('p.press__cost', { text: 'Door-to-door only converts if the paper is worth subscribing to.' })
    ], { testid: 'panel-subscriptions' });
  }

  function renderRivalTable() {
    var s = App.state;
    var all = (s.rivals || []).map(function (r) { return r; });
    return App.panel('The competition', [
      h('div.ledger', { 'data-testid': 'rival-table' }, [
        h('div.ledger__line.ledger__line--good', {}, [
          h('span', { text: s.paper.name }), h('span', { text: App.num(s.circulation) })
        ])
      ].concat(all.map(function (r) {
        return h('div.ledger__line', {}, [
          h('span', { text: r.name }), h('span', { text: App.num(r.circulation) })
        ]);
      })).concat([
        h('div.ledger__rule'),
        h('div.ledger__line', {}, [
          h('span', { text: 'Your market share' }),
          h('span', { text: Math.round(Engine.marketShare(s.circulation, all) * 100) + '%' })
        ])
      ])),
      h('div.chips', {}, all.map(function (r) {
        var price = Engine.rivalValuation(r);
        return h('button.chip', {
          'data-testid': 'buyout-' + r.id,
          disabled: s.money < price,
          text: 'Buy ' + r.name + ' · ' + App.money(price),
          onclick: function () {
            App.ask('Buy ' + r.name + '?',
              'You absorb their readers and their masthead disappears from the city. It costs ' + App.money(price) + '.',
              function () {
                s.money -= price;
                s.circulation += Math.round(r.circulation * 0.6);
                Object.keys(s.readers).forEach(function (k) {
                  s.readers[k].readers = Math.round(s.readers[k].readers * 1.18);
                });
                s.rivals = s.rivals.filter(function (x) { return x.id !== r.id; });
                s.stats.rivalsBought = (s.stats.rivalsBought || 0) + 1;
                App.toast('You own ' + r.name + '. Their staff are already updating their CVs.', 'good');
                App.checkAchievements();
                App.save(true);
                App.go('city');
              }, 'Buy them');
          }
        });
      }))
    ], { testid: 'panel-rivals-table' });
  }

  /* =========================================================================
   * THE COMPANY — property, media channels, proprietor, lawsuits
   * ====================================================================== */
  App.screens.company = {
    render: function () {
      return h('div.screen', {}, [
        App.topbar('city'),
        h('div.two', {}, [
          h('div', {}, [renderProperty(), renderChannels()]),
          h('div', {}, [renderProprietor(), renderLawsuits(), renderSuccession()])
        ])
      ]);
    }
  };

  function renderProperty() {
    var s = App.state;
    return App.panel('Property', Data.PROPERTIES.map(function (p) {
      var owned = s.properties.indexOf(p.id) >= 0;
      return h('div.press__row', {}, [
        h('span.press__label', { text: p.income ? App.money(p.income) + '/day' : 'no rent' }),
        h('button.chip' + (owned ? '.chip--on' : ''), {
          'data-testid': 'buy-property-' + p.id,
          disabled: owned || s.money < p.cost,
          title: p.blurb,
          text: p.name + (owned ? ' · owned' : ' · ' + App.money(p.cost)),
          onclick: function () {
            s.money -= p.cost;
            s.properties.push(p.id);
            App.toast('Deeds signed: ' + p.name, 'good');
            App.save(true);
            App.go('company');
          }
        })
      ]);
    }), { testid: 'panel-property' });
  }

  function renderChannels() {
    var s = App.state;
    var year = Engine.dateFromDay(s.day, s.startYear).year;
    return App.panel('Other media', Data.CHANNELS.map(function (ch) {
      var owned = s.channels.indexOf(ch.id) >= 0;
      var needsProp = ch.needs && s.properties.indexOf(ch.needs) < 0;
      var tooEarly = ch.needYear && year < ch.needYear;
      return h('div.press__row', {}, [
        h('span.press__label', { text: App.money(ch.upkeep) + '/day' }),
        h('button.chip' + (owned ? '.chip--on' : ''), {
          'data-testid': 'buy-channel-' + ch.id,
          disabled: owned || needsProp || tooEarly || s.money < ch.cost,
          title: ch.blurb + (tooEarly ? ' Not until ' + ch.needYear + '.' : '')
            + (needsProp ? ' Needs the studio.' : ''),
          text: ch.name + (owned ? ' · running' : ' · ' + App.money(ch.cost)),
          onclick: function () {
            s.money -= ch.cost;
            s.channels.push(ch.id);
            App.toast(ch.name + ' launches tomorrow.', 'good');
            App.save(true);
            App.go('company');
          }
        })
      ]);
    }).concat([
      h('p.press__cost', { text: 'Every channel reuses the same newsroom. They pay per reader, not per copy.' })
    ]), { testid: 'panel-channels' });
  }

  function renderProprietor() {
    var s = App.state;
    var current = Data.PROPRIETORS.filter(function (p) { return p.id === s.proprietor; })[0] || Data.PROPRIETORS[0];
    var mood = current.id === 'none' ? null : Engine.proprietorMood(s.editorialStances, current);
    if (mood !== null) s.proprietorMood = mood;

    return App.panel('Ownership', [
      h('p.rumour__title', { text: current.name }),
      h('p.card__copy', { text: current.blurb }),
      mood !== null ? h('div', {}, [
        h('span.press__label', { text: 'Their mood' }),
        h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(mood) + '%' })]),
        h('p.press__cost', {
          'data-testid': 'proprietor-mood',
          text: mood < 35
            ? 'They are unhappy with the line the paper is taking.'
            : (mood > 65 ? 'They are delighted, which is its own problem.' : 'They are watching.')
        })
      ]) : null,
      current.id === 'none'
        ? h('div.chips', {}, Data.PROPRIETORS.filter(function (p) { return p.id !== 'none'; }).map(function (p) {
          return h('button.chip', {
            'data-testid': 'sell-to-' + p.id,
            text: 'Sell a stake to ' + p.name + ' · +' + App.money(p.buyIn),
            title: p.blurb,
            onclick: function () {
              App.ask('Sell a stake to ' + p.name + '?',
                'You get ' + App.money(p.buyIn) + ' today. They get opinions about your editorial line for ever.',
                function () {
                  s.money += p.buyIn;
                  s.proprietor = p.id;
                  App.toast('The papers are signed.', 'good');
                  App.save(true);
                  App.go('company');
                }, 'Sell');
            }
          });
        }))
        : h('button.btn.btn--ghost.btn--small', {
          'data-testid': 'buy-back',
          disabled: s.money < (current.buyIn || 0) * 2,
          text: 'Buy back the stake · ' + App.money((current.buyIn || 0) * 2),
          onclick: function () {
            s.money -= (current.buyIn || 0) * 2;
            s.proprietor = 'none';
            App.toast('The paper is yours again.', 'good');
            App.save(true);
            App.go('company');
          }
        })
    ], { testid: 'panel-proprietor' });
  }

  function renderLawsuits() {
    var s = App.state;
    var open = s.lawsuits.filter(function (l) { return l.status === 'open'; });
    if (!open.length) {
      return App.panel('Legal', [
        h('p.daycard__empty', { text: 'No claims outstanding. Enjoy it.' }),
        h('p.press__cost', {
          text: 'A lawyer on staff cuts settlements and lets you run thinner evidence.'
        })
      ], { testid: 'panel-legal' });
    }
    return App.panel('Legal', open.map(function (claim) {
      var hasLawyer = s.staff.some(function (x) { return x.role === 'lawyer'; });
      var offer = Engine.settlementOffer(claim.claim, claim.evidence + (hasLawyer ? 18 : 0));
      return h('div.inv', { 'data-testid': 'lawsuit' }, [
        h('div.inv__title', { text: 'Claim over: ' + claim.title }),
        h('div.inv__meta', {
          text: 'They want ' + App.money(claim.claim) + ' · your evidence '
            + Math.round(claim.evidence) + '%' + (hasLawyer ? ' · lawyer on staff' : '')
        }),
        h('div.inv__actions', {}, [
          h('button.btn.btn--small', {
            'data-testid': 'settle-' + claim.id,
            text: 'Settle for ' + App.money(offer.settle),
            onclick: function () {
              s.money -= offer.settle;
              claim.status = 'settled';
              s.reputation.truth = Engine.clamp(s.reputation.truth - 1, 0, 100);
              App.toast('Settled quietly.', 'bad');
              App.save(true); App.go('company');
            }
          }),
          h('button.btn.btn--ghost.btn--small', {
            'data-testid': 'fight-' + claim.id,
            text: 'Fight it (' + Math.round(offer.winChance * 100) + '% win)',
            onclick: function () {
              var won = App.roll(function (r) { return r.chance(offer.winChance); });
              claim.status = won ? 'won' : 'lost';
              if (won) {
                s.reputation.professionalism = Engine.clamp(s.reputation.professionalism + 5, 0, 100);
                App.toast('You won. Print it again, bigger.', 'good');
              } else {
                s.money -= offer.fightExpected;
                s.reputation.truth = Engine.clamp(s.reputation.truth - 6, 0, 100);
                App.toast('You lost. That was expensive.', 'bad');
              }
              App.save(true); App.go('company');
            }
          })
        ])
      ]);
    }), { testid: 'panel-legal' });
  }

  /* ---------- succession ----------
   * Retirement that continues the paper: a new editor inherits the archive,
   * a reputation floor, and whatever standing the last one earned. */
  function renderSuccession() {
    var s = App.state;
    var score = Engine.careerScore(s);
    var inh = Engine.inheritance(score);
    return App.panel('Succession', [
      h('p.panel__note', { text: 'Generation ' + s.generation + ' · career score ' + App.num(score) }),
      h('p.card__copy', {
        text: 'Hand the paper to the next editor. The archive, the masthead and the city carry over; '
          + 'the money and the reputation reset to what you earned.'
      }),
      h('div.grid2', {}, [
        kv('They start with', App.money(inh.money)),
        kv('Reputation floor', String(Math.round(inh.reputationFloor))),
        kv('Circulation', App.num(Math.round(inh.circulation))),
        kv('Editions inherited', App.num(s.archive.length))
      ]),
      h('button.btn.btn--small', {
        'data-testid': 'succeed',
        text: 'Hand over the paper',
        onclick: function () { App.succeed(); }
      })
    ], { testid: 'panel-succession' });
  }

  function kv(label, value) {
    return h('div.kv', {}, [h('span.kv__k', { text: label }), h('span.kv__v', { text: value })]);
  }

  App.succeed = function () {
    var s = App.state;
    var score = Engine.careerScore(s);
    var inh = Engine.inheritance(score);
    App.ask('Hand over the paper?',
      'A new editor takes the chair tomorrow. Everything you printed stays on the shelf.',
      function () {
        s.generation += 1;
        s.career = { lastScore: score, generations: (s.career ? s.career.generations : 0) + 1 };
        s.money = Math.round(inh.money);
        s.circulation = Math.round(inh.circulation);
        Object.keys(s.reputation).forEach(function (k) {
          s.reputation[k] = Engine.clamp(Math.max(s.reputation[k] * 0.7, inh.reputationFloor), 0, 100);
        });
        s.loans = [];
        s.staff.forEach(function (st) { st.energy = 100; });
        App.toast('Generation ' + s.generation + ' takes the chair.', 'good');
        App.save(true);
        App.go('office');
      }, 'Hand it over');
  };

  /* =========================================================================
   * WORKSHOP — office decorating, darkroom, masthead, sound, export, challenge
   * ====================================================================== */
  App.screens.workshop = {
    render: function () {
      return h('div.screen', {}, [
        App.topbar('office'),
        h('div.two', {}, [
          h('div', {}, [renderDecorate(), renderDarkroom()]),
          h('div', {}, [renderMasthead(), renderExport(), renderChallenge()])
        ])
      ]);
    }
  };

  /* Free placement: the office is a grid and furniture goes where you put it. */
  function renderDecorate() {
    var s = App.state;
    s.layout = s.layout || {};
    var owned = Data.OFFICE_FURNITURE.filter(function (f) { return f.tier <= s.officeTier; });
    Data.UPGRADES.forEach(function (u) {
      if (App.hasUpgrade(u.id) && u.sprite && !owned.some(function (f) { return f.sprite === u.sprite; })) {
        owned.push({ sprite: u.sprite, label: u.name, tier: 1 });
      }
    });
    var cells = 24;

    return App.panel('Arrange the office', [
      h('p.panel__note', { text: 'Pick a thing, then pick a square. Purely for your own satisfaction.' }),
      h('div.chips', { 'data-testid': 'furniture-picker' }, owned.map(function (f) {
        var on = s.pickedFurniture === f.sprite;
        return h('button.chip' + (on ? '.chip--on' : ''), {
          'data-testid': 'pick-' + f.sprite, text: f.label,
          onclick: function () { s.pickedFurniture = on ? null : f.sprite; App.go('workshop'); }
        });
      })),
      h('div.floor', { 'data-testid': 'floor' }, Array.apply(null, Array(cells)).map(function (_, i) {
        var sprite = s.layout[i];
        return h('div.floor__cell' + (sprite ? '.floor__cell--full' : ''), {
          'data-testid': 'cell-' + i,
          onclick: function () {
            if (sprite) { delete s.layout[i]; }
            else if (s.pickedFurniture) { s.layout[i] = s.pickedFurniture; }
            App.save(true);
            App.go('workshop');
          }
        }, [sprite ? App.sprite(sprite, 34) : null]);
      })),
      h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'clear-floor', text: 'Clear the floor',
        onclick: function () { s.layout = {}; App.save(true); App.go('workshop'); }
      })
    ], { testid: 'panel-decorate' });
  }

  /* Darkroom: spend time developing a photo, gambling on the result. */
  function renderDarkroom() {
    var s = App.state;
    if (!App.hasUpgrade('darkroom')) {
      return App.panel('Darkroom', [
        h('p.daycard__empty', { text: 'You do not have a darkroom. The shop sells one.' })
      ], { testid: 'panel-darkroom' });
    }
    var pool = (s.today ? s.today.stories : []).filter(function (st) {
      return st.photo && st.photo.quality < 70 && !st.photo.developed;
    });
    return App.panel('Darkroom', [
      h('p.panel__note', { text: 'A weak negative can be rescued. It can also be ruined.' }),
      pool.length
        ? h('div.spike', { 'data-testid': 'darkroom-list' }, pool.slice(0, 5).map(function (st) {
          return h('article.card', { 'data-testid': 'negative' }, [
            h('h3.card__title', { text: st.title }),
            h('div.card__foot', { text: st.photo.label + ' · quality ' + Math.round(st.photo.quality) }),
            h('button.chip', {
              'data-testid': 'develop',
              text: 'Develop it',
              onclick: function () {
                App.roll(function (r) {
                  var roll = r.next();
                  st.photo.developed = true;
                  if (roll > 0.62) {
                    st.photo.quality = Engine.clamp(st.photo.quality + r.int(18, 34), 0, 100);
                    st.photo.label = 'Rescued print';
                    App.toast('It came up beautifully.', 'good');
                  } else if (roll > 0.2) {
                    st.photo.quality = Engine.clamp(st.photo.quality + r.int(4, 12), 0, 100);
                    App.toast('A little sharper.');
                  } else {
                    st.photo.quality = Engine.clamp(st.photo.quality - r.int(10, 22), 0, 100);
                    st.photo.label = 'Over-developed';
                    App.toast('You left it in too long.', 'bad');
                  }
                });
                App.save(true);
                App.go('workshop');
              }
            })
          ]);
        }))
        : h('p.daycard__empty', { text: 'Nothing on the spike needs rescuing today.' })
    ], { testid: 'panel-darkroom' });
  }

  function renderMasthead() {
    var s = App.state;
    return App.panel('The nameplate', [
      h('h1.masthead__name', { text: s.paper.name, style: App.mastheadCss(), 'data-testid': 'masthead-preview' }),
      h('div.chips', { 'data-testid': 'masthead-styles' }, Data.MASTHEAD_STYLES.map(function (m) {
        return h('button.chip' + (s.masthead === m.id ? '.chip--on' : ''), {
          'data-testid': 'masthead-' + m.id, text: m.name,
          onclick: function () { s.masthead = m.id; App.save(true); App.go('workshop'); }
        });
      })),
      h('div.press__row', {}, [
        h('span.press__label', { text: 'Motto' }),
        h('input.field__input', {
          'data-testid': 'motto-input', type: 'text', maxlength: '48', value: s.paper.motto,
          onchange: function (e) { s.paper.motto = e.target.value || s.paper.motto; App.save(true); }
        })
      ]),
      h('div.press__row', {}, [
        h('span.press__label', { text: 'Sound' }),
        h('button.chip' + (s.sound ? '.chip--on' : ''), {
          'data-testid': 'toggle-sound', text: s.sound ? 'On' : 'Off',
          onclick: function () { s.sound = !s.sound; App.sound('key'); App.save(true); App.go('workshop'); }
        })
      ])
    ], { testid: 'panel-masthead' });
  }

  /* Export: the whole archive as a printable scrapbook in a new window. */
  function renderExport() {
    var s = App.state;
    return App.panel('Export the archive', [
      h('p.panel__note', { text: s.archive.length + ' editions. Opens a printable page you can save as PDF.' }),
      h('button.btn.btn--small', {
        'data-testid': 'export-archive',
        disabled: !s.archive.length,
        text: 'Open the scrapbook',
        onclick: function () { App.exportArchive(); }
      }),
      h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'copy-front-page',
        disabled: !s.lastEdition,
        text: 'Copy last front page as text',
        onclick: function () {
          var ed = s.lastEdition;
          var text = ed.paperName + '\n' + ed.dateLine + '\n\n' + ed.headlineText
            + '\n\n' + ed.leadTitle + '\n' + App.num(ed.copies) + ' copies · quality '
            + Math.round(ed.quality);
          App.copyText(text);
        }
      })
    ], { testid: 'panel-export' });
  }

  App.copyText = function (text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        App.toast('Copied.');
        return true;
      }
    } catch (e) { /* fall through */ }
    App.lastCopied = text;
    App.toast('Copied.');
    return true;
  };

  App.exportArchive = function () {
    var s = App.state;
    var rows = s.archive.map(function (ed) {
      return '<article><h2>' + escapeHtml(ed.headlineText) + '</h2>'
        + '<p class="d">' + escapeHtml(ed.dateLine) + ' · ' + App.num(ed.copies) + ' copies · quality '
        + Math.round(ed.quality) + '</p>'
        + '<p>' + escapeHtml(ed.leadTitle || '') + '</p>'
        + '<ul>' + ed.stories.map(function (st) {
          return '<li>' + escapeHtml(st.title) + ' <em>(' + escapeHtml(st.category) + ')</em></li>';
        }).join('') + '</ul></article>';
    }).join('');
    var html = '<!doctype html><meta charset="utf-8"><title>' + escapeHtml(s.paper.name) + ' — Archive</title>'
      + '<style>body{font-family:Georgia,serif;max-width:46em;margin:2em auto;padding:0 1em;color:#1A1512}'
      + 'h1{border-bottom:3px double #1A1512;padding-bottom:.3em}'
      + 'article{page-break-inside:avoid;border-bottom:1px solid #ccc;padding:1em 0}'
      + 'h2{font-size:1.3em;margin:0 0 .2em}.d{color:#6B4A2F;font-size:.85em;margin:0 0 .5em}'
      + 'ul{columns:2;font-size:.9em}</style>'
      + '<h1>' + escapeHtml(s.paper.name) + '</h1>'
      + '<p>' + s.archive.length + ' editions · ' + escapeHtml(s.identity.name) + '</p>' + rows;
    App.lastExport = html;
    try {
      var w = window.open('', '_blank');
      if (w) { w.document.write(html); w.document.close(); App.toast('Scrapbook opened.'); return true; }
    } catch (e) { /* popup blocked */ }
    App.toast('Popup blocked — the scrapbook is on App.lastExport.', 'bad');
    return false;
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  /* Daily challenge: everybody gets the same Tuesday. */
  function renderChallenge() {
    var s = App.state;
    var key = new Date().toISOString().slice(0, 10);
    var seed = Engine.challengeSeed(key);
    return App.panel('Daily challenge', [
      h('p.panel__note', { text: 'Today\'s seed: ' + key + ' (#' + seed.toString(16).slice(0, 6) + ')' }),
      h('p.card__copy', {
        text: 'One day, one edition, the same stories for everyone. Your score is quality, '
          + 'reader mood, sales and profit, minus every typo.'
      }),
      s.challenge && s.challenge.score
        ? h('div.mark', { 'data-testid': 'challenge-score' }, [
          h('span.mark__v', { text: App.num(s.challenge.score) }),
          h('span.mark__l', { text: 'your score' })
        ])
        : null,
      h('button.btn.btn--small', {
        'data-testid': 'start-challenge',
        text: 'Play today\'s challenge',
        onclick: function () {
          App.ask('Start the daily challenge?',
            'This replaces your current run with a one-day scored edition. Save first if you care about it.',
            function () {
              App.startGame('The Daily Challenge', seed, 'standard');
              App.state.challenge = { dateKey: key, score: 0 };
              App.save(true);
              App.go('newsroom');
            }, 'Play it');
        }
      })
    ], { testid: 'panel-challenge' });
  }
})();

</script>
<!-- ==== app_studio.js ==== -->
<script>
/* ===========================================================================
 * app_studio.js — the interactive layer: the morgue (archive search), the
 * ethics ledger, and the minigames that make investigations and photographs
 * decisions rather than dice rolls.
 * ======================================================================== */
(function () {
  'use strict';
  var h = App.h;

  /* =========================================================================
   * THE MORGUE — search your own back catalogue, and find where it disagrees
   * with you. Requires the Archive Room upgrade.
   * ====================================================================== */
  App.screens.morgue = {
    render: function () {
      var s = App.state;
