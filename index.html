            h('span.press__label', { text: 'Make it harder' }),
            h('div.chips', { 'data-testid': 'difficulty-chips' }, Data.DIFFICULTY_MODIFIERS.map(function (dm) {
              App.bootDifficulty = App.bootDifficulty || [];
              var on = App.bootDifficulty.indexOf(dm.id) >= 0;
              return h('button.chip' + (on ? '.chip--on' : ''), {
                'data-testid': 'difficulty-' + dm.id, text: dm.name, title: dm.blurb,
                onclick: function () {
                  App.bootDifficulty = on
                    ? App.bootDifficulty.filter(function (x) { return x !== dm.id; })
                    : App.bootDifficulty.concat([dm.id]);
                  App.go('boot');
                }
              });
            }))
          ]),
          h('div.boot__actions', {}, [
            h('button.btn.btn--go', {
              'data-testid': 'start-game',
              text: 'Start printing',
              onclick: function () {
                var name = (nameInput.value || '').trim();
                if (!name) {
                  name = App.roll(function (r) {
                    return r.pick(Data.PAPER_NAME_PARTS.first) + ' ' + r.pick(Data.PAPER_NAME_PARTS.second);
                  });
                }
                App.startGame(name, undefined, App.bootScenario || 'standard', {
                  region: App.bootRegion, historical: App.bootHistorical, difficulty: App.bootDifficulty
                });
                App.go('office', { intro: true });
              }
            }),
            App.hasSave() ? h('button.btn.btn--ghost', {
              'data-testid': 'continue-game',
              text: 'Continue',
              onclick: function () {
                if (App.load()) { if (!App.state.today) App.gen.day(); App.go('office'); }
                else App.toast('That save could not be read.', 'bad');
              }
            }) : null
          ]),
          !App.storage.available ? h('p.boot__warn', {
            text: 'Storage is blocked here, so this run will not survive a refresh. Everything else works.'
          }) : null
        ]),
        h('p.boot__foot', { text: 'Tip: nothing is hidden from you. Importance, interest and truth are printed on every story card. The hard part is that they disagree.' })
      ]);
      /* A fresh seed is needed even before a game exists, for the name roll. */
      if (!App.state) App.state = App.newState('', Date.now() >>> 0);
      return wrap;
    }
  };

  /* =========================================================================
   * SHARED CHROME — the top bar every in-game screen uses
   * ====================================================================== */
  App.topbar = function (active) {
    var s = App.state;
    var tabs = [
      { id: 'office', label: 'Office' },
      { id: 'newsroom', label: 'Newsroom' },
      { id: 'staff', label: 'Staff' },
      { id: 'archive', label: 'Archive' },
      { id: 'readers', label: 'Readers' },
      { id: 'trophies', label: 'Trophies' },
      { id: 'city', label: 'City' },
      { id: 'company', label: 'Company' },
      { id: 'workshop', label: 'Workshop' },
      { id: 'people', label: 'People' },
      { id: 'morgue', label: 'Morgue' }
    ];
    return h('header.topbar', {}, [
      h('div.topbar__brand', {}, [
        h('span.topbar__paper', { text: s.paper.name, 'data-testid': 'paper-title' }),
        h('span.topbar__date', { text: App.dateLine(), 'data-testid': 'date-line' })
      ]),
      h('nav.topbar__tabs', {}, tabs.map(function (t) {
        return h('button.tab' + (active === t.id ? '.tab--on' : ''), {
          'data-testid': 'tab-' + t.id, text: t.label,
          onclick: function () { App.go(t.id); }
        });
      })),
      h('div.topbar__stats', {}, [
        stat('Cash', App.money(s.money), 'stat-money'),
        stat('Copies', App.num(s.circulation), 'stat-circulation'),
        stat('Identity', s.identity.name, 'stat-identity')
      ])
    ]);
  };

  function stat(label, value, testid) {
    return h('div.stat', { 'data-testid': testid }, [
      h('span.stat__label', { text: label }),
      h('span.stat__value', { text: value })
    ]);
  }
  App.stat = stat;

  /* Small reusable card header used by several screens. */
  App.panel = function (title, children, opts) {
    opts = opts || {};
    return h('section.panel' + (opts.class ? '.' + opts.class : ''), { 'data-testid': opts.testid }, [
      h('div.panel__head', {}, [
        h('h2.panel__title', { text: title }),
        opts.aside ? h('span.panel__aside', { text: opts.aside }) : null
      ])
    ].concat(children || []));
  };

  /* =========================================================================
   * ENTRY
   * ====================================================================== */
  App.boot = function () {
    if (!document.getElementById('toasts')) {
      document.body.appendChild(h('div#toasts', { id: 'toasts' }));
    }
    App.go('boot');
  };

  /* Exposed so tests can jump straight into a deterministic mid-game state. */
  App.debugNewGame = function (seed, paperName) {
    App.startGame(paperName || 'Test Herald', seed === undefined ? 12345 : seed);
    App.go('office');
  };

  return App;
})();

</script>
<!-- ==== app_office.js ==== -->
<script>
/* ===========================================================================
 * app_office.js — the hub. The room you come back to every morning and
 * every night: yesterday's numbers, the press settings, open investigations,
 * reader letters, and the door to the newsroom.
 * ======================================================================== */
(function () {
  'use strict';
  var h = App.h;

  App.screens.office = {
    render: function (params) {
      var s = App.state;
      var wrap = h('div.screen.screen--office', {}, [
        App.topbar('office'),
        h('div.office', {}, [
          h('div.office__left', {}, [renderRoom(), renderPress()]),
          h('div.office__right', {}, [renderDayCard(), renderEditorial(), renderInvestigations(),
            renderDesk(), renderMoney(), renderSources(), renderLetters()])
        ])
      ]);
      if (params.intro && !s.seenIntro) {
        s.seenIntro = true;
        setTimeout(function () {
          App.ask('Day one',
            'You have a rented room, two staff and enough cash for a fortnight of bad decisions. The first edition prints tonight.',
            function () { App.go('newsroom'); }, 'Open the newsroom');
        }, 60);
      }
      return wrap;
    }
  };

  /* ---------- the room ----------
   * Furniture appears as the office tier climbs. This is the whole reward
   * loop for money that is not spent on staff. */
  function renderRoom() {
    var s = App.state;
    var tier = App.officeTier();
    var furniture = Data.OFFICE_FURNITURE.filter(function (f) { return f.tier <= s.officeTier; });
    Data.UPGRADES.forEach(function (u) {
      if (App.hasUpgrade(u.id) && u.sprite && !furniture.some(function (f) { return f.sprite === u.sprite; })) {
        furniture.push({ sprite: u.sprite, label: u.name, tier: 1 });
      }
    });

    var next = Data.OFFICE_TIERS.filter(function (t) { return t.id === s.officeTier + 1; })[0];

    return App.panel(tier.name, [
      h('div.room', { 'data-testid': 'room' }, furniture.map(function (f) {
        return h('div.room__item', { title: f.label }, [
          App.sprite(f.sprite, 56),
          h('span.room__label', { text: f.label })
        ]);
      })),
      h('p.room__note', {
        'data-testid': 'era-line',
        text: 'Era: ' + (Data.ERAS.filter(function (e) { return e.id === s.era; })[0] || Data.ERAS[1]).name
          + ' — ' + (Data.ERAS.filter(function (e) { return e.id === s.era; })[0] || Data.ERAS[1]).blurb
      }),
      h('p.room__note', {
        text: s.city.event
          ? 'Out the window: ' + s.city.event.name + '. ' + s.city.event.blurb
          : 'Out the window: an ordinary week in a city of ' + App.num(s.city.population) + '.'
      }),
      next ? h('div.room__upgrade', {}, [
        h('div.room__upgradeText', {}, [
          h('strong', { text: 'Move up to ' + next.name }),
          h('span', {
            text: App.money(next.cost) + ' · needs ' + App.num(next.needCirculation) + ' copies · '
              + next.desks + ' desks · ' + App.money(next.overhead) + '/day overhead'
          })
        ]),
        h('button.btn.btn--small', {
          'data-testid': 'move-office',
          disabled: !(s.money >= next.cost && s.circulation >= next.needCirculation),
          text: 'Move in',
          onclick: function () {
            s.money -= next.cost;
            s.officeTier = next.id;
            App.toast('You moved into ' + next.name + '.', 'good');
            App.save(true);
            App.go('office');
          }
        })
      ]) : h('p.room__note', { text: 'There is nowhere bigger to move. You own the skyline.' })
    ], { testid: 'panel-room' });
  }

  /* ---------- press settings ---------- */
  function renderPress() {
    var s = App.state;
    var pressTier = App.tierOf('press');
    var maxPages = pressTier >= 3 ? 24 : (pressTier >= 2 ? 16 : 8);
    var pageOptions = [4, 8, 16, 24].filter(function (p) { return p <= maxPages; });

    return App.panel('The press', [
      h('div.press', {}, [
        h('div.press__row', {}, [
          h('span.press__label', { text: 'Pages tonight' }),
          h('div.chips', { 'data-testid': 'page-chips' }, pageOptions.map(function (p) {
            return h('button.chip' + (s.pageCount === p ? '.chip--on' : ''), {
              'data-testid': 'pages-' + p, text: p + 'pp',
              onclick: function () {
                s.pageCount = p;
                if (s.today && !s.today.published) pruneAssignments();
                App.go('office');
              }
            });
          }))
        ]),
        h('div.press__row', {}, [
          h('span.press__label', { text: 'Paper stock' }),
          h('div.chips', {}, Data.PAPER_STOCKS.map(function (st) {
            return h('button.chip' + (s.paperStock === st.id ? '.chip--on' : ''), {
              'data-testid': 'stock-' + st.id, text: st.name, title: st.blurb,
              onclick: function () { s.paperStock = st.id; App.go('office'); }
            });
          }))
        ]),
        h('div.press__row', {}, [
          h('span.press__label', { text: 'Cover price' }),
          h('div.chips', {}, [0.45, 0.65, 0.9, 1.25].map(function (p) {
            return h('button.chip' + (Math.abs(s.coverPrice - p) < 0.001 ? '.chip--on' : ''), {
              'data-testid': 'price-' + String(p).replace('.', '-'), text: '$' + p.toFixed(2),
              onclick: function () { s.coverPrice = p; App.go('office'); }
            });
          }))
        ]),
        h('p.press__cost', {
          'data-testid': 'press-cost',
          text: 'Tonight\'s run costs about ' + App.money(estimatedCost()) + ' before wages.'
        }),
        h('button.btn.btn--ghost.btn--small', {
          'data-testid': 'open-shop', text: 'Equipment & upgrades',
          onclick: function () { App.go('shop'); }
        })
      ])
    ], { testid: 'panel-press' });
  }

  function estimatedCost() {
    var s = App.state;
    return Engine.dailyExpenses({
      staff: s.staff,
      pageCount: s.pageCount,
      paperCost: App.paperCost(),
      printRun: s.circulation,
      overhead: App.officeTier().overhead
    });
  }
  App.estimatedCost = estimatedCost;

  /* Page count can shrink mid-morning; drop assignments to slots that no
   * longer exist so state.today.assignments never points at a dead slot. */
  function pruneAssignments() {
    var live = {};
    App.slots().forEach(function (sl) { live[sl.id] = true; });
    var a = App.state.today.assignments;
    Object.keys(a).forEach(function (k) { if (!live[k]) delete a[k]; });
  }
  App.pruneAssignments = pruneAssignments;

  /* ---------- today / yesterday ---------- */
  function renderDayCard() {
    var s = App.state;
    var last = s.lastEdition;
    var body = [];

    if (last) {
      body.push(h('div.grid2', {}, [
        kv('Copies sold', App.num(last.copies)),
        kv('Quality', Math.round(last.quality) + '/100'),
        kv('Sales', App.money(last.revenue)),
        kv('Ads', App.money(last.adRevenue)),
        kv('Costs', App.money(-last.expenses)),
        kv('Net', App.money(last.profit), last.profit >= 0 ? 'good' : 'bad')
      ]));
      body.push(h('p.daycard__lead', {}, [
        h('span.daycard__label', { text: 'Yesterday\'s front page' }),
        h('em', { text: last.headlineText || '—' })
      ]));
    } else {
      body.push(h('p.daycard__empty', { text: 'Nothing has gone to press yet. The first edition is waiting in the newsroom.' }));
    }

    var published = s.today && s.today.published;
    body.push(h('div.daycard__actions', {}, [
      h('button.btn.btn--go', {
        'data-testid': 'go-newsroom',
        text: published ? 'Review tonight\'s edition' : 'Open the newsroom',
        onclick: function () { App.go('newsroom'); }
      }),
      h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'save-game', text: 'Save', onclick: function () { App.save(); }
      })
    ]));

    return App.panel(App.dateLine(), body, {
      testid: 'panel-day',
      aside: s.today ? (s.today.stories.length + ' stories on the spike') : ''
    });
  }

  function kv(label, value, tone) {
    return h('div.kv' + (tone ? '.kv--' + tone : ''), {}, [
      h('span.kv__k', { text: label }), h('span.kv__v', { text: value })
    ]);
  }

  /* ---------- investigations ----------
   * Open investigations tick forward when the day ends (see App.endDay).
   * Assigning a reporter here costs nothing up front; the cost is that the
   * reporter stops producing morning stories. */
  function renderInvestigations() {
    var s = App.state;
    var open = s.investigations.filter(function (i) { return i.status === 'open'; });
    var offer = s.today && s.today.rumour && s.today.rumour.status === 'offered' ? s.today.rumour : null;
    var body = [];

    if (offer) {
      body.push(h('div.rumour', { 'data-testid': 'rumour-offer' }, [
        h('div.rumour__title', { text: offer.title }),
        h('div.rumour__meta', { text: offer.category + ' · the desk says: ' + offer.shown + ' · pays about ' + App.money(offer.reward) }),
        h('div.rumour__actions', {}, [
          h('button.btn.btn--small', {
            'data-testid': 'take-rumour', text: 'Start digging',
            onclick: function () {
              offer.status = 'open';
              s.investigations.push(offer);
              s.today.rumour = null;
              App.toast('Investigation opened.');
              App.go('office');
            }
          }),
          h('button.btn.btn--ghost.btn--small', {
            'data-testid': 'drop-rumour', text: 'Let it go',
            onclick: function () { s.today.rumour = null; App.go('office'); }
          })
        ])
      ]));
    }

    if (!open.length && !offer) {
      body.push(h('p.daycard__empty', { text: 'No open investigations. Tips arrive when reporters have slack in the day.' }));
    }

    open.forEach(function (inv) {
      var assigned = s.staff.filter(function (st) { return inv.assigned.indexOf(st.id) >= 0; });
      body.push(h('div.inv', { 'data-testid': 'inv-' + inv.id }, [
        h('div.inv__title', { text: inv.title }),
        h('div.bar', {}, [h('div.bar__fill', { style: 'width:' + Math.round(inv.evidence) + '%' })]),
        h('div.inv__meta', {
          text: Math.round(inv.evidence) + '% evidence · day ' + inv.days
            + ' · ' + (assigned.length ? assigned.map(function (a) { return a.name; }).join(', ') : 'nobody assigned')
        }),
        h('div.inv__staff', {}, s.staff.filter(function (st) { return st.role === 'reporter'; }).map(function (st) {
          var on = inv.assigned.indexOf(st.id) >= 0;
          return h('button.chip' + (on ? '.chip--on' : ''), {
            'data-testid': 'assign-' + st.id, text: st.name,
            onclick: function () {
              if (on) inv.assigned = inv.assigned.filter(function (x) { return x !== st.id; });
              else inv.assigned.push(st.id);
              App.go('office');
            }
          });
        })),
        h('div.inv__actions', {}, [
          h('button.btn.btn--ghost.btn--small', {
            'data-testid': 'interview-' + inv.id, text: 'Interview',
            onclick: function () { App.startInterview(inv); }
          }),
          h('button.btn.btn--ghost.btn--small', {
            'data-testid': 'documents-' + inv.id, text: 'Documents',
            onclick: function () { App.startLedgerReview(inv); }
          }),
          h('button.btn.btn--small', {
            'data-testid': 'publish-inv-' + inv.id,
            text: 'Send to tonight\'s paper',
            disabled: !(App.state.today && !App.state.today.published),
            onclick: function () { promoteInvestigation(inv); }
          }),
          h('button.btn.btn--ghost.btn--small', {
            'data-testid': 'kill-inv-' + inv.id, text: 'Kill it',
            onclick: function () {
              App.ask('Kill the investigation?',
                'The evidence goes in a drawer. Reporters go back on the morning list.',
                function () {
                  inv.status = 'killed';
                  App.toast('Dropped.');
                  App.go('office');
                }, 'Kill it');
            }
          })
        ]),
        inv.evidence < 55 ? h('p.inv__warn', { text: 'Thin. Printing this now risks a libel suit.' }) : null,
        h('p.press__cost', {
          text: 'Sources: ' + (inv.sourceCount || 1) + ' · evidence cannot pass '
            + Engine.evidenceCeiling(inv.sourceCount || 1) + ' on this many.'
        })
      ]));
    });

    return App.panel('Investigations', body, { testid: 'panel-investigations' });
  }

  /* Turn an investigation into a story card on today's spike. It is a normal
   * story from then on — it must still be placed in a slot to count. */
  function promoteInvestigation(inv) {
    var s = App.state;
    if (!s.today || s.today.published) { App.toast('Tonight\'s paper has gone to press.', 'bad'); return; }
    if (s.today.stories.some(function (st) { return st.investigationId === inv.id; })) {
      App.toast('It is already on the spike.'); App.go('newsroom'); return;
    }
    App.roll(function (r) {
      var story = {
        id: 'invstory-' + inv.id,
        title: inv.title,
        category: inv.category,
        section: Data.SECTION_OF[inv.category] || 'News',
        local: true,
        importance: Engine.clamp(60 + inv.evidence * 0.35, 0, 100),
        interest: Engine.clamp(55 + inv.evidence * 0.25, 0, 100),
        truth: Engine.clamp(inv.credibility * 0.5 + inv.evidence * 0.5, 0, 100),
        length: 'long',
        urgency: 90,
        exclusive: true,
        investigationId: inv.id,
        evidence: inv.evidence,
        credibility: inv.credibility,
        reward: inv.reward,
        photo: App.gen.photo(r, App.tierOf('camera'), true),
        source: 'Our investigation'
      };
      s.today.stories.unshift(story);
    });
    App.toast('Filed. Now find it a slot.');
    App.go('newsroom');
  }
  App.promoteInvestigation = promoteInvestigation;

  /* ---------- editorial board ----------
   * One stance a morning. Individually trivial, cumulatively a politics. */
  function renderEditorial() {
    var s = App.state;
    var topic = s.today && s.today.editorial;
    if (!topic || s.today.editorialDone) {
      return App.panel('Editorial line', [
        h('p.daycard__empty', {
          text: topic ? 'Today\'s line is set. The leader column is written.'
            : 'No leader today.'
        }),
        stanceSummary()
      ], { testid: 'panel-editorial' });
    }
    return App.panel('Editorial line', [
      h('p.rumour__title', { text: topic.q }),
      h('div.rumour__actions', { 'data-testid': 'editorial-choices' }, [
        stanceButton(topic, 1, 'Support', topic.support),
        stanceButton(topic, 0, 'Stay neutral', 'No line either way.'),
        stanceButton(topic, -1, 'Oppose', topic.oppose)
      ]),
      stanceSummary()
    ], { testid: 'panel-editorial' });
  }

  function stanceButton(topic, value, label, blurb) {
    return h('button.btn.btn--small', {
      'data-testid': 'stance-' + (value > 0 ? 'support' : (value < 0 ? 'oppose' : 'neutral')),
      title: blurb, text: label,
      onclick: function () {
        var s = App.state;
        s.editorialStances[topic.axis] = (s.editorialStances[topic.axis] || 0) + value;
        s.today.editorialDone = true;
        /* A paper with opinions is trusted more by some and less by others. */
        if (value !== 0) {
          s.reputation.professionalism = Engine.clamp(s.reputation.professionalism + 0.4, 0, 100);
          s.readers.officials && (s.readers.officials.loyalty = Engine.clamp(
            s.readers.officials.loyalty + (value > 0 ? 0.8 : -0.8), 0, 100));
        }
        App.save(true);
        App.go('office');
      }
    });
  }

  function stanceSummary() {
    var st = App.state.editorialStances || {};
    var keys = Object.keys(st).filter(function (k) { return st[k] !== 0; });
    if (!keys.length) return h('p.press__cost', { text: 'The paper has taken no positions yet.' });
    return h('div.chips', { 'data-testid': 'stances' }, keys.map(function (k) {
      return h('span.tagcount', { text: k + ' ' + (st[k] > 0 ? '+' : '') + st[k] });
    }));
  }

  /* ---------- the desk: wire, stringers, inserts ---------- */
  function renderDesk() {
    var s = App.state;
    var body = [];

    body.push(h('div.press__row', {}, [
      h('span.press__label', { text: 'Wire service' }),
      h('button.chip' + (s.wireService ? '.chip--on' : ''), {
        'data-testid': 'toggle-wire',
        text: s.wireService ? 'Subscribed' : App.money(Data.WIRE_SERVICE.cost) + ' / month',
        onclick: function () {
          if (s.wireService) { s.wireService = false; App.toast('Wire cancelled.'); }
          else if (s.money < Data.WIRE_SERVICE.cost) { App.toast('Not enough cash.', 'bad'); return; }
          else { s.money -= Data.WIRE_SERVICE.cost; s.wireService = true; App.toast('Wire copy starts tomorrow.', 'good'); }
          App.save(true); App.go('office');
        }
      })
    ]));

    if (s.today && s.today.stringer) {
      var str = s.today.stringer;
      body.push(h('div.rumour', { 'data-testid': 'stringer-offer' }, [
        h('div.rumour__title', { text: str.title }),
        h('div.rumour__meta', { text: 'Freelance · ' + str.category + ' · asking ' + App.money(str.price) }),
        h('div.rumour__actions', {}, [
          h('button.btn.btn--small', {
            'data-testid': 'buy-stringer', disabled: s.money < str.price, text: 'Buy it',
            onclick: function () {
              s.money -= str.price;
              s.today.stories.unshift(str);
              s.today.stringer = null;
              App.toast('Bought. It is on the spike.', 'good');
              App.save(true); App.go('office');
            }
          }),
          h('button.btn.btn--ghost.btn--small', {
            'data-testid': 'pass-stringer', text: 'Pass',
            onclick: function () { s.today.stringer = null; App.go('office'); }
          })
        ])
      ]));
    }

    body.push(h('div.press__row', {}, [
      h('span.press__label', { text: 'Inserts' }),
      h('div.chips', { 'data-testid': 'insert-chips' }, Data.INSERTS.map(function (ins) {
        var on = (s.inserts || []).indexOf(ins.id) >= 0;
        return h('button.chip' + (on ? '.chip--on' : ''), {
          'data-testid': 'insert-' + ins.id, text: ins.name, title: ins.blurb + ' ' + App.money(ins.cost) + '/day',
          onclick: function () {
            s.inserts = s.inserts || [];
            if (on) s.inserts = s.inserts.filter(function (x) { return x !== ins.id; });
            else s.inserts.push(ins.id);
            App.go('office');
          }
        });
      }))
    ]));

    return App.panel('The desk', body, { testid: 'panel-desk' });
  }

  /* ---------- money: loans, shocks, retirement ---------- */
  function renderMoney() {
    var s = App.state;
    var body = [];
    var owed = Engine.sum(s.loans, function (l) { return l.balance; });

    if (s.paperShock) {
      body.push(h('p.inv__warn', {
        'data-testid': 'paper-shock',
        text: s.paperShock.name + '. ' + s.paperShock.blurb + ' Paper costs are ×'
          + s.paperShock.multiplier + ' until day ' + s.paperShock.untilDay + '.'
      }));
    }

    if (owed > 0) {
      body.push(h('div.grid2', {}, s.loans.filter(function (l) { return l.balance > 0; }).map(function (l) {
        return h('div.kv', {}, [
          h('span.kv__k', { text: l.name }),
          h('span.kv__v', { text: App.money(l.balance) + ' due day ' + l.dueDay })
        ]);
      })));
      body.push(h('button.btn.btn--small', {
        'data-testid': 'repay-loan',
        disabled: s.money <= 0,
        text: 'Pay what you can',
        onclick: function () {
          var loan = s.loans.filter(function (l) { return l.balance > 0; })[0];
          var pay = Math.min(loan.balance, Math.max(0, s.money));
          s.money = Engine.round(s.money - pay, 2);
          loan.balance = Engine.round(loan.balance - pay, 2);
          if (loan.balance <= 0.5) { loan.balance = 0; s.stats.loansCleared += 1; App.toast('Cleared.', 'good'); }
          App.save(true); App.go('office');
        }
      }));
    }

    Data.LOAN_OFFERS.forEach(function (offer) {
      if (s.loans.some(function (l) { return l.id === offer.id && l.balance > 0; })) return;
      body.push(h('div.press__row', {}, [
        h('span.press__label', { text: offer.name }),
        h('button.chip', {
          'data-testid': 'borrow-' + offer.id,
          text: 'Borrow ' + App.money(offer.principal) + ' @ ' + (offer.ratePerDay * 100).toFixed(1) + '%/day',
          onclick: function () {
            s.loans.push({
              id: offer.id, name: offer.name, principal: offer.principal,
              balance: offer.principal, ratePerDay: offer.ratePerDay, dueDay: s.day + offer.termDays
            });
            s.money = Engine.round(s.money + offer.principal, 2);
            App.toast('Borrowed ' + App.money(offer.principal) + '.', 'good');
            App.save(true); App.go('office');
          }
        })
      ]));
    });

    body.push(h('div.daycard__actions', {}, [
      h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'open-themes', text: 'Look & feel', onclick: function () { App.go('themes'); }
      }),
      h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'retire', text: 'Retire', onclick: function () { App.retire(); }
      })
    ]));

    return App.panel('Money', body, { testid: 'panel-money', aside: owed > 0 ? App.money(owed) + ' owed' : '' });
  }

  /* ---------- sources ---------- */
  function renderSources() {
    var s = App.state;
    return App.panel('Sources', Data.SOURCES.map(function (src) {
      var trust = Math.round(s.sources[src.id] || 0);
      return h('div.reprow', { 'data-testid': 'source-row' }, [
        h('span.reprow__k', { text: src.name }),
        h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + trust + '%' })]),
        h('span.reprow__v', { text: String(trust) })
      ]);
    }).concat([
      h('p.press__cost', { text: 'Sources above 55 hand you exclusives before the rivals hear about them.' })
    ]), { testid: 'panel-sources' });
  }

  /* ---------- letters ---------- */
  function renderLetters() {
    var s = App.state;
    var pending = s.letters.filter(function (l) { return !l.handled; }).slice(0, 4);
    if (!pending.length) {
      return App.panel('Letters', [h('p.daycard__empty', { text: 'The letterbox is empty. Print something people feel strongly about.' })], { testid: 'panel-letters' });
    }
    return App.panel('Letters', pending.map(function (l) {
      return h('div.letter.letter--' + l.kind, { 'data-testid': 'letter' }, [
        h('p.letter__body', { text: l.text }),
        h('div.letter__actions', {}, [
          h('button.chip' + (l.queued ? '.chip--on' : ''), {
            text: l.queued ? 'On the spike' : 'Print it', 'data-testid': 'letter-print',
            onclick: function () {
              /* Printing a letter now costs a SLOT: it goes on the spike and
               * has to earn its place like any other item. */
              l.queued = !l.queued;
              App.toast(l.queued ? 'Letter added to the spike.' : 'Letter pulled.');
              App.go('office');
            }
          }),
          h('button.chip', {
            text: 'Bin it', 'data-testid': 'letter-bin',
            onclick: function () { l.handled = true; App.go('office'); }
          })
        ])
      ]);
    }), { testid: 'panel-letters', aside: pending.length + ' waiting' });
  }
})();

</script>
<!-- ==== app_desk.js ==== -->
<script>
/* ===========================================================================
 * app_desk.js — the core loop screen. Pick stories off the spike, drop them
 * into the page, sell the space you have left, write the headline, print.
 * Then live with it.
 * ======================================================================== */
(function () {
  'use strict';
  var h = App.h;

  /* Transient UI state. NEVER saved — it is rebuilt on every render and
   * holds nothing the game needs after a refresh. */
  App.desk = { selected: null, filter: 'all' };

  /* =========================================================================
   * NEWSROOM
   * ====================================================================== */
  App.screens.newsroom = {
    render: function () {
      var s = App.state;
      if (!s.today) App.gen.day();
      if (s.today.published) return App.screens.results.render();

      return h('div.screen.screen--desk', {}, [
        App.topbar('newsroom'),
        h('div.desk', {}, [
          h('div.desk__spike', {}, [renderSpike(), renderAdBook()]),
          h('div.desk__paper', {}, [renderPaper(), renderHeadlineBox(), renderPressBar()])
        ])
      ]);
    }
  };

  /* ---------- the spike (incoming stories) ---------- */
  function renderSpike() {
    var s = App.state;
    var used = usedStoryIds();
    /* Corrections owed and letters chosen for print are synthesised onto the
     * spike so they compete for the same slots as everything else. */
    var extras = (s.today.corrections || []).map(App.correctionStory);
    s.letters.filter(function (l) { return l.queued && !l.handled; }).forEach(function (l) {
      extras.push(App.letterStory(l));
    });
    var stories = extras.concat(s.today.stories).filter(function (st) { return used.indexOf(st.id) < 0; });

    if (App.desk.filter !== 'all') {
      stories = stories.filter(function (st) { return st.section === App.desk.filter; });
    }

    var sections = ['all', 'News', 'Business', 'Life', 'Local', 'Sports'];

    return App.panel('The spike', [
      h('div.chips.chips--tight', {}, sections.map(function (sec) {
        return h('button.chip' + (App.desk.filter === sec ? '.chip--on' : ''), {
          'data-testid': 'filter-' + sec, text: sec === 'all' ? 'Everything' : sec,
          onclick: function () { App.desk.filter = sec; App.go('newsroom'); }
        });
      })),
      h('div.spike', { 'data-testid': 'spike' },
        stories.length ? stories.map(storyCard)
          : [h('p.daycard__empty', { text: 'Nothing left under that filter.' })])
    ], { testid: 'panel-spike', aside: stories.length + ' available' });
  }

  function storyCard(story) {
    var sel = App.desk.selected;
    var isSel = sel && sel.type === 'story' && sel.id === story.id;
    var card = h('article.card.card--story' + (isSel ? '.card--sel' : '') + (story.breaking ? '.card--breaking' : ''), {
      'data-testid': 'story-card',
      'data-story': story.id,
      draggable: 'true',
      tabindex: '0',
      onclick: function () { selectThing('story', story.id); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectThing('story', story.id); } },
      ondragstart: function (e) { e.dataTransfer.setData('text/plain', 'story:' + story.id); App.desk.selected = { type: 'story', id: story.id }; }
    }, [
      h('div.card__top', {}, [
        h('span.tag.tag--' + story.section.toLowerCase(), { text: story.category }),
        story.exclusive ? h('span.tag.tag--excl', { text: 'EXCLUSIVE' }) : null,
        story.breaking ? h('span.tag.tag--brk', { text: 'BREAKING' }) : null,
        story.investigationId ? h('span.tag.tag--inv', { text: 'INVESTIGATION' }) : null,
        story.threadId ? h('span.tag.tag--thread', { text: 'RUNNING STORY' }) : null,
        story.correction ? h('span.tag.tag--correction', { text: 'CORRECTION' }) : null,
        story.letter ? h('span.tag.tag--letters', { text: 'LETTER' }) : null,
        story.wire ? h('span.tag', { text: 'WIRE' }) : null,
        story.pressRelease ? h('span.tag', { text: 'PRESS RELEASE' }) : null,
        story.returned ? h('span.tag.tag--brk', { text: 'YOU PASSED ON THIS' }) : null,
        story.embargo ? h('span.tag.tag--risk', { text: 'EMBARGOED' }) : null,
        story.whistleblower ? h('span.tag.tag--excl', { text: 'CONFIDENTIAL SOURCE' }) : null
      ]),
      h('h3.card__title', { text: story.title }),
      h('div.card__stats', {}, [
        meter('Imp', story.importance),
        meter('Int', story.interest),
        meter('Truth', story.truth)
      ]),
      h('div.card__foot', {
        text: story.length + ' · ' + (story.photo ? story.photo.label : 'no photo') + ' · ' + story.source
      }),
      story.embargo ? h('p.card__copy', { text: story.embargo.line }) : null,
      story.whistleblower ? h('button.chip' + (story.whistleblower.protected ? '.chip--on' : ''), {
        'data-testid': 'protect-source',
        text: story.whistleblower.protected ? 'Source protected' : 'Source named',
        onclick: function (e) {
          e.stopPropagation();
          story.whistleblower.protected = !story.whistleblower.protected;
          if (!story.whistleblower.protected) story.importance = Engine.clamp(story.importance + 10, 0, 100);
          App.go('newsroom');
        }
      }) : null
    ]);
    return card;
  }

  function meter(label, value) {
    return h('div.meter', { title: label + ' ' + Math.round(value) }, [
      h('span.meter__label', { text: label }),
      h('span.meter__track', {}, [h('span.meter__fill', { style: 'width:' + Math.round(value) + '%' })]),
      h('span.meter__num', { text: Math.round(value) })
    ]);
  }

  /* ---------- ad book ---------- */
  function renderAdBook() {
    var s = App.state;
    var used = usedAdIds();
    var offers = s.today.ads.filter(function (a) { return used.indexOf(a.id) < 0; });
    return App.panel('Ad book', [
      h('div.spike.spike--ads', { 'data-testid': 'adbook' },
        offers.length ? offers.map(adCard) : [h('p.daycard__empty', { text: 'Every advertiser is placed.' })])
    ], { testid: 'panel-ads', aside: offers.length + ' offers' });
  }

  function adCard(ad) {
    var sel = App.desk.selected;
    var isSel = sel && sel.type === 'ad' && sel.id === ad.id;
    return h('article.card.card--ad' + (isSel ? '.card--sel' : ''), {
      'data-testid': 'ad-card', 'data-ad': ad.id, draggable: 'true', tabindex: '0',
      onclick: function () { selectThing('ad', ad.id); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectThing('ad', ad.id); } },
      ondragstart: function (e) { e.dataTransfer.setData('text/plain', 'ad:' + ad.id); App.desk.selected = { type: 'ad', id: ad.id }; }
    }, [
      h('div.card__top', {}, [
        h('span.tag.tag--money', { text: App.money(ad.rate) + ' base' }),
        ad.risky ? h('span.tag.tag--risk', { text: 'RISKY' }) : null
      ]),
      h('h3.card__title', { text: ad.name }),
      h('p.card__copy', { text: '"' + ad.copy + '"' }),
      h('div.card__foot', { text: ad.size + ' · suits a ' + ad.wants.toLowerCase() + ' paper' })
    ]);
  }

  function selectThing(type, id) {
    var sel = App.desk.selected;
    if (sel && sel.type === type && sel.id === id) App.desk.selected = null;
    else App.desk.selected = { type: type, id: id };
    App.go('newsroom');
  }

  /* ---------- the paper itself ----------
   * This is the signature of the whole game: a live broadsheet that fills
   * in as you place things, set in serif inside a pixel frame. */
  function renderPaper() {
    var s = App.state;
    var slots = App.slots();
    var pages = {};
    slots.forEach(function (sl) { (pages[sl.page] = pages[sl.page] || []).push(sl); });

    var pageEls = Object.keys(pages).sort().map(function (pageNo) {
      var pageSlots = pages[pageNo];
      return h('div.page' + (pageNo === '1' ? '.page--front' : ''), { 'data-testid': 'page-' + pageNo }, [
        pageNo === '1' ? renderMasthead() : h('div.page__folio', {
          text: 'Page ' + pageNo + ' — ' + pageSlots[0].pageName
        }),
        h('div.page__grid', {}, pageSlots.map(slotEl))
      ]);
    });

    return App.panel('Tonight\'s edition', [
      h('div.paperwrap', { 'data-testid': 'paper' }, pageEls)
    ], { testid: 'panel-paper', aside: filledCount() + '/' + editorialSlots().length + ' editorial slots filled' });
  }

  function renderMasthead() {
    var s = App.state;
    return h('div.masthead', {}, [
      h('div.masthead__rule'),
      h('h1.masthead__name', { text: s.paper.name, style: App.mastheadCss() }),
      h('div.masthead__line', {
        text: App.dateLine() + '  ·  ' + s.paper.motto + '  ·  $' + s.coverPrice.toFixed(2)
      }),
      h('div.masthead__rule'),
      renderTeasers()
    ]);
  }

  /* "See page 12" — front-page pointers that pull readers deeper into the
   * paper. Each teaser raises attention on every page after the first. */
  function renderTeasers() {
    var s = App.state;
    s.today.teasers = s.today.teasers || [];
    var a = s.today.assignments;
    var inside = App.slots().filter(function (sl) {
      return sl.page > 1 && sl.role !== 'ad' && sl.role !== 'fixed' && a[sl.id];
    });
    if (!inside.length) return h('div.teasers', { text: 'No inside stories to trail yet.' });
    return h('div.teasers', { 'data-testid': 'teasers' }, inside.slice(0, 5).map(function (sl) {
      var story = App.storyById(a[sl.id]);
      var on = s.today.teasers.indexOf(sl.id) >= 0;
      return h('button.teaser' + (on ? '.teaser--on' : ''), {
        'data-testid': 'teaser-' + sl.id,
        title: 'Trail this on the front page',
        onclick: function () {
          if (on) s.today.teasers = s.today.teasers.filter(function (x) { return x !== sl.id; });
          else if (s.today.teasers.length < 3) s.today.teasers.push(sl.id);
          else { App.toast('Three teasers is already a cluttered front page.', 'bad'); return; }
          App.go('newsroom');
        }
      }, [
        h('span.teaser__label', { text: on ? 'SEE PAGE ' + sl.page : 'trail?' }),
        h('span.teaser__title', { text: story ? story.title : sl.label })
      ]);
    }));
  }

  function slotEl(slot) {
    var s = App.state;
    var assignedId = s.today.assignments[slot.id];

    var inner;
    if (slot.role === 'fixed') {
      inner = fixedSlotContent(slot);
    } else if (assignedId) {
      inner = slot.role === 'ad' ? placedAd(slot, App.adById(assignedId)) : placedStory(slot, App.storyById(assignedId));
    } else {
      inner = h('div.slot__empty', {}, [
        h('span.slot__label', { text: slot.label }),
        h('span.slot__hint', { text: slot.role === 'ad' ? 'drop an advertiser' : 'drop a story' })
      ]);
    }

    return h('div.slot.slot--' + slot.role + '.slot--span' + slot.span
      + (assignedId ? '.slot--full' : '.slot--open'), {
      'data-testid': 'slot-' + slot.id,
      'data-slot': slot.id,
      tabindex: slot.role === 'fixed' ? null : '0',
      onclick: function () { onSlotClick(slot); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSlotClick(slot); } },
      ondragover: function (e) { e.preventDefault(); e.currentTarget.classList.add('slot--over'); },
      ondragleave: function (e) { e.currentTarget.classList.remove('slot--over'); },
      ondrop: function (e) {
        e.preventDefault();
        e.currentTarget.classList.remove('slot--over');
        var raw = e.dataTransfer.getData('text/plain') || '';
        var bits = raw.split(':');
        if (bits.length === 2) { App.desk.selected = { type: bits[0], id: bits[1] }; onSlotClick(slot); }
      }
    }, [inner]);
  }

  function fixedSlotContent(slot) {
    var s = App.state;
    if (slot.id === 'fp-weather') {
      return h('div.fixed', {}, [
        h('span.fixed__label', { text: 'WEATHER' }),
        h('p.fixed__text', { text: s.today.weather })
      ]);
    }
    if (slot.id === 'sun-puzzle') {
      return h('div.fixed', {}, [
        h('span.fixed__label', { text: 'CROSSWORD' }),
        h('p.fixed__text', { text: 'Seven across: a paper that tells the truth (8).' })
      ]);
    }
    /* The strip runs across days and remembers where it got to. */
    var strip = Data.COMIC_STRIPS.filter(function (c) { return c.id === s.comic.stripId; })[0] || Data.COMIC_STRIPS[0];
    var panel = strip.panels[Engine.clamp(s.comic.panel, 0, strip.panels.length - 1)];
    return h('div.fixed', {}, [
      h('span.fixed__label', { text: 'COMIC — ' + strip.name }),
      h('div.fixed__strip', {}, [App.sprite('reporter', 26), App.sprite('coffee', 26), App.sprite('plant', 26)]),
      h('p.fixed__text', { text: panel }),
      h('span.card__foot', { text: 'panel ' + (s.comic.panel + 1) + ' of ' + strip.panels.length })
    ]);
  }

  function placedStory(slot, story) {
    if (!story) return h('div.slot__empty', {}, [h('span.slot__label', { text: slot.label })]);
    var isLead = slot.role === 'lead';
    var text = isLead && App.state.today.headline ? App.state.today.headline : story.title;
    var fit = Engine.slotFit(story, slot);
    return h('div.placed', {}, [
      h('div.placed__meta', {}, [
        h('span.placed__slot', { text: slot.label }),
        h('span.placed__fit' + (fit >= 65 ? '.is-good' : (fit >= 40 ? '.is-ok' : '.is-bad')), { text: 'fit ' + Math.round(fit) })
      ]),
      isLead ? h('h2.headline.headline--lead', { text: text, 'data-testid': 'lead-headline' })
        : h('h3.headline', { text: text }),
      story.photo ? h('div.photo', { title: story.photo.label }, [
        App.sprite(photoSprite(story), 40),
        h('span.photo__cap', { text: story.photo.label + ' · ' + story.category.toLowerCase() })
      ]) : null,
      h('p.body', { text: bodyText(story, slot) }),
      h('div.placed__byline', { text: story.byline ? 'By ' + story.byline : story.source })
    ]);
  }

  function photoSprite(story) {
    var map = {
      Politics: 'shelf', Business: 'desk', Crime: 'camera', Sports: 'reporter',
      Entertainment: 'sofa', Celebrity: 'camera', Community: 'coffee', Health: 'plant',
      Science: 'printer', Technology: 'printer', Education: 'shelf', Environment: 'plant',
      Food: 'coffee', Travel: 'newspapers', Animals: 'plant', Weather: 'plant',
      Culture: 'sofa', International: 'newspapers'
    };
    return map[story.category] || 'newspapers';
  }

  /* Filler prose. Length follows the slot so the page looks typeset, and the
   * wording is chosen by hashing the story id — stable across re-renders and
   * across a save/reload, and it never touches the rng cursor. */
  function bodyText(story, slot) {
    var openers = Data.BODY_OPENERS[story.section] || Data.BODY_OPENERS.News;
    var lead = Data.pickStable(openers, story.id, 'open');
    if (slot.size === 'short') return lead;
    var mid = Data.pickStable(Data.BODY_MIDDLES, story.id, 'mid');
    if (slot.size === 'medium') return lead + mid;
    return lead + mid + Data.pickStable(Data.BODY_TAILS, story.id, 'tail');
  }

  function placedAd(slot, ad) {
    if (!ad) return h('div.slot__empty', {}, [h('span.slot__label', { text: slot.label })]);
    return h('div.advert', {}, [
      h('span.advert__frame', { text: ad.name }),
      h('p.advert__copy', { text: ad.copy }),
      h('span.advert__rate', { text: App.money(ad.rate) + ' base rate' })
    ]);
  }

  /* ---------- placement rules ----------
   * INVARIANT: assignments maps slotId -> story.id OR ad.id, and any one id
   * appears at most once. Ads only go in ad slots; stories never do. */
  function onSlotClick(slot) {
    var s = App.state;
    if (slot.role === 'fixed') return;
    var sel = App.desk.selected;

    if (!sel) {
      if (s.today.assignments[slot.id]) {
        if (slot.role === 'lead') {
          s.today.headline = null; s.today.headlineStyle = null;
          s.today.headlineParts = null; s.today.headlineBuilt = null;
        }
        delete s.today.assignments[slot.id];
        App.go('newsroom');
      }
      return;
    }

    if (sel.type === 'ad' && slot.role !== 'ad') { App.toast('Advertisers only go in ad space.', 'bad'); return; }
    if (sel.type === 'story' && slot.role === 'ad') { App.toast('That space is sold to advertisers.', 'bad'); return; }

    /* Remove the thing from wherever else it sits — nothing prints twice. */
    Object.keys(s.today.assignments).forEach(function (k) {
      if (s.today.assignments[k] === sel.id) delete s.today.assignments[k];
    });
    if (slot.role === 'lead') { s.today.headline = null; s.today.headlineStyle = null; }
    s.today.assignments[slot.id] = sel.id;
    App.desk.selected = null;
    App.go('newsroom');
  }

  /* Corrections and printed letters are real page furniture: they occupy a
   * slot like any story. They are synthesised as pseudo-stories so the whole
   * placement, scoring and archive pipeline handles them without a special
   * case anywhere downstream. */
  App.correctionStory = function (corr, i) {
    var copy = Data.CORRECTION_COPY[corr.size] || Data.CORRECTION_COPY.short;
    return {
      id: 'corr-' + i,
      title: (corr.severity === 'full retraction' ? 'Correction: ' : 'Clarification: ') + corr.title,
      body: copy.replace('{title}', corr.title),
      category: 'Correction', section: 'News', local: true,
      importance: 30, interest: 20, truth: 100,
      length: corr.size, urgency: 100, exclusive: false,
      correction: corr, photo: null, source: 'This paper'
    };
  };

  App.letterStory = function (letter) {
    return {
      id: 'letter-' + letter.id,
      title: 'From our readers',
      body: letter.text,
      category: 'Letters', section: 'Local', local: true,
      importance: 22, interest: 44, truth: 90,
      length: 'short', urgency: 20, exclusive: false,
      letter: letter, photo: null, source: 'Letters page'
    };
  };

  function usedStoryIds() {
    var a = App.state.today.assignments;
    return Object.keys(a).map(function (k) { return a[k]; });
  }
  function usedAdIds() { return usedStoryIds(); }

  function editorialSlots() {
    return App.slots().filter(function (sl) { return sl.role !== 'ad' && sl.role !== 'fixed'; });
  }
  function filledCount() {
    var a = App.state.today.assignments;
    return editorialSlots().filter(function (sl) { return !!a[sl.id]; }).length;
  }

  /* Corrections and letters are not in today.stories, so the generic lookup
   * has to know about them or placing one would resolve to null at press. */
  App.registerSyntheticLookup = function () {
    var base = App.storyById;
    App.storyById = function (id) {
      var found = base(id);
      if (found) return found;
      var s = App.state;
      if (!s.today) return null;
      if (id && id.indexOf('corr-') === 0) {
        var i = parseInt(id.slice(5), 10);
        var c = (s.today.corrections || [])[i];
        return c ? App.correctionStory(c, i) : null;
      }
      if (id && id.indexOf('letter-') === 0) {
        var l = s.letters.filter(function (x) { return 'letter-' + x.id === id; })[0];
        return l ? App.letterStory(l) : null;
      }
      return null;
    };
  };
  App.registerSyntheticLookup();

  function leadStory() {
    var id = App.state.today.assignments['fp-lead'];
    return id ? App.storyById(id) : null;
  }

  /* ---------- headline box ---------- */
  function renderHeadlineBox() {
    var s = App.state;
    var lead = leadStory();
    if (!lead) {
      return App.panel('The headline', [
        h('p.daycard__empty', { text: 'Put a story in the main front-page slot and the headline desk wakes up.' })
      ], { testid: 'panel-headline' });
    }

    var creativity = Math.max(App.roleStat('editor', 'creativity'), 38);
    return App.panel('The headline', [
      h('p.headlinebox__lead', { text: 'Front page: ' + lead.title }),
      h('div.styles', { 'data-testid': 'headline-styles' }, Data.HEADLINE_STYLES.map(function (style) {
        var score = Engine.headlineScore(lead, style, creativity);
        var on = s.today.headlineStyle === style.id;
        return h('button.style' + (on ? '.style--on' : ''), {
          'data-testid': 'style-' + style.id,
          onclick: function () { chooseStyle(lead, style); }
        }, [
          h('span.style__name', { text: style.label }),
          h('span.style__punch', { text: 'punch ' + Math.round(score) }),
          h('span.style__truth', { text: (style.truthShift >= 0 ? '+' : '') + style.truthShift + ' truth' })
        ]);
      })),
      s.today.headline ? h('blockquote.headlinebox__set', { 'data-testid': 'headline-preview', text: s.today.headline }) : null,
      renderHeadlineBuilder(lead, creativity),
      s.today.headline ? h('button.btn.btn--ghost.btn--small', {
        'data-testid': 'reword', text: 'Reword it',
        onclick: function () {
          var style = Data.HEADLINE_STYLES.filter(function (x) { return x.id === s.today.headlineStyle; })[0];
          chooseStyle(lead, style);
        }
      }) : null
    ], { testid: 'panel-headline' });
  }

  /* ---------- the headline builder ----------
   * Assemble the headline from parts. Punch comes from the verb; accuracy
   * from whether the words claim more than the story can support. */
  function renderHeadlineBuilder(lead, creativity) {
    var s = App.state;
    s.today.headlineParts = s.today.headlineParts || { framing: null, verb: null, qualifier: null };
    var parts = s.today.headlineParts;
    var scored = parts.verb ? Engine.builtHeadlineScore(parts, lead, creativity) : null;

    function bank(label, list, key, testPrefix) {
      return h('div.press__row', {}, [
        h('span.press__label', { text: label }),
        h('div.chips', {}, list.map(function (w) {
          var on = parts[key] && parts[key].id === w.id;
          return h('button.chip' + (on ? '.chip--on' : ''), {
            'data-testid': testPrefix + w.id,
            text: w.word || w.id,
            onclick: function () {
              parts[key] = on ? null : w;
              if (parts.verb) applyBuiltHeadline(lead, creativity);
              App.go('newsroom');
            }
          });
        }))
      ]);
    }

    return h('div.builder', { 'data-testid': 'headline-builder' }, [
      h('p.panel__note', { text: 'Or write it yourself:' }),
      bank('Framing', Data.HEADLINE_FRAMINGS, 'framing', 'frame-'),
      bank('Verb', Data.HEADLINE_VERBS, 'verb', 'verb-'),
      bank('Qualifier', Data.HEADLINE_QUALIFIERS, 'qualifier', 'qual-'),
      scored ? h('div.printed__marks', {}, [
        h('div.mark', { 'data-testid': 'builder-punch' }, [
          h('span.mark__v', { text: String(Math.round(scored.punch)) }), h('span.mark__l', { text: 'punch' })
        ]),
        h('div.mark' + (scored.accuracy < 60 ? '.mark--bad' : ''), { 'data-testid': 'builder-accuracy' }, [
          h('span.mark__v', { text: String(Math.round(scored.accuracy)) }), h('span.mark__l', { text: 'accuracy' })
        ])
      ]) : null,
      scored && scored.accuracy < 60
        ? h('p.pressbar__warn', { text: 'That headline claims more than the story can carry.' })
        : null
    ]);
  }

  function applyBuiltHeadline(lead, creativity) {
    var s = App.state;
    var parts = s.today.headlineParts;
    var subject = lead.subject ? lead.subject.name : lead.title.split(' ').slice(0, 3).join(' ');
    var text = (parts.framing ? parts.framing.word : '') + subject + ' '
      + parts.verb.word + (parts.qualifier ? parts.qualifier.word : '');
    s.today.headline = text.toUpperCase();
    s.today.headlineStyle = 'built';
    s.today.headlineBuilt = Engine.builtHeadlineScore(parts, lead, creativity);
  }

  function chooseStyle(lead, style) {
    var s = App.state;
    s.today.headlineStyle = style.id;
    s.today.headline = App.roll(function (r) {
      var dress = r.pick(Data.HEADLINE_DRESS[style.mood]);
      return (style.prefix + dress.replace('{h}', lead.title)).toUpperCase();
    });
    App.go('newsroom');
  }

  /* ---------- press bar ---------- */
  function renderPressBar() {
    var s = App.state;
    var lead = leadStory();
    var missing = editorialSlots().length - filledCount();
    return h('div.pressbar', {}, [
      h('div.pressbar__info', {}, [
        h('span', { text: missing > 0 ? missing + ' slot' + (missing === 1 ? '' : 's') + ' still white' : 'Every slot is filled' }),
        h('span', { text: 'Ads placed: ' + placedAds().length }),
        h('span', { text: 'Est. costs ' + App.money(App.estimatedCost()) })
      ]),
      h('div.runbox', {}, [
        h('span.press__label', { text: 'Print run' }),
        h('div.chips', { 'data-testid': 'run-chips' }, runOptions().map(function (opt) {
          return h('button.chip' + (s.today.printRun === opt.copies ? '.chip--on' : ''), {
            'data-testid': 'run-' + opt.id, text: opt.label, title: opt.blurb,
            onclick: function () { s.today.printRun = opt.copies; App.go('newsroom'); }
          });
        })),
        h('p.runbox__note', {
          text: s.today.printRun
            ? 'You are committing to ' + App.num(s.today.printRun) + ' copies before you know demand.'
            : 'Print to demand (safe, and you never sell out).'
        })
      ]),
      h('button.btn.btn--print', {
        'data-testid': 'send-to-press',
        text: 'Send to press',
        disabled: !lead || !s.today.headline,
        onclick: function () { attemptPress(); }
      }),
      !lead ? h('p.pressbar__warn', { text: 'A paper needs a front page. Fill the main slot.' })
        : (!s.today.headline ? h('p.pressbar__warn', { text: 'Pick a headline tone before printing.' }) : null)
    ]);
  }

  /* Print-run options are framed against yesterday's circulation, which is the
   * only information the editor actually has at this hour. */
  function runOptions() {
    var base = App.state.circulation || 1400;
    return [
      { id: 'demand', copies: null, label: 'To demand', blurb: 'No gamble, no upside.' },
      { id: 'short', copies: Math.round(base * 0.8), label: '-20%', blurb: 'Cheap. You may sell out.' },
      { id: 'match', copies: Math.round(base), label: 'Match', blurb: 'Same as yesterday.' },
      { id: 'over', copies: Math.round(base * 1.25), label: '+25%', blurb: 'Betting on a big day.' },
      { id: 'big', copies: Math.round(base * 1.6), label: '+60%', blurb: 'Betting the newsroom.' }
    ];
  }

  function placedAds() {
    var a = App.state.today.assignments;
    return App.slots().filter(function (sl) { return sl.role === 'ad' && a[sl.id]; })
      .map(function (sl) { return App.adById(a[sl.id]); })
      .filter(Boolean);
  }

  /* ---------- breaking news at four o'clock ----------
   * Fired once, at the moment the player commits. This is the only place in
   * the game where a decision is made under time pressure. */
  function attemptPress() {
    var s = App.state;
    if (offerSpike()) return;
    if (s.today.breaking && !s.today.breakingOffered) {
      s.today.breakingOffered = true;
      var brk = s.today.breaking;
      var overlay = h('div.overlay', { 'data-testid': 'breaking-dialog' }, [
        h('div.dialog.dialog--breaking', {}, [
          h('span.dialog__kicker', { text: '4:00 PM — the newsdesk phone rings' }),
          h('h3.dialog__title', { text: brk.title }),
          h('p.dialog__body', { text: 'It is real and it is big. Remaking the front page costs ' + App.money(220) + ' in lost press time. Printing as planned means every rival has it and you do not.' }),
          h('div.dialog__actions', {}, [
            h('button.btn.btn--ghost', {
              'data-testid': 'ignore-breaking', text: 'Print as planned',
              onclick: function () {
                overlay.remove();
                s.today.missedBreaking = true;
                doPress();
              }
            }),
            h('button.btn.btn--go', {
              'data-testid': 'hold-press', text: 'Hold the press',
              onclick: function () {
                overlay.remove();
                s.money -= 220;
                s.today.stories.unshift(brk);
                delete s.today.assignments['fp-lead'];
                s.today.headline = null;
                s.today.headlineStyle = null;
                s.today.breaking = null;
                App.desk.selected = { type: 'story', id: brk.id };
                App.toast('Front page cleared. Place it and rewrite the headline.', 'good');
                App.go('newsroom');
              }
            })
          ])
        ])
      ]);
      document.body.appendChild(overlay);
      return;
    }
    doPress();
  }

  /* ---------- the advertiser's offer ----------
   * If a story on tonight's page damages an advertiser who is ALSO in tonight's
   * ad book, they will pay to make it go away. This is the game's moral centre:
   * the bribe is paid in the only currency that matters here — column inches. */
  function offerSpike() {
    var s = App.state;
    if (s.today.spikeOffered) return false;
    var a = s.today.assignments;
    var placedStories = App.slots()
      .filter(function (sl) { return sl.role !== 'ad' && sl.role !== 'fixed' && a[sl.id]; })
      .map(function (sl) { return { slot: sl, story: App.storyById(a[sl.id]) }; })
      .filter(function (p) { return p.story; });

    var best = null;
    s.today.ads.forEach(function (ad) {
      var client = Data.AD_CLIENTS.filter(function (c) { return c.id === ad.clientId; })[0];
      if (!client) return;
      placedStories.forEach(function (p) {
        var dmg = Engine.adDamage(client, p.story);
        if (dmg >= Data.AD_RELATION.PULL_THRESHOLD && (!best || dmg > best.damage)) {
          best = { ad: ad, client: client, story: p.story, slot: p.slot, damage: dmg };
        }
      });
    });
    if (!best) return false;

    s.today.spikeOffered = true;
    var bribe = Math.round(best.ad.rate * Data.AD_RELATION.SPIKE_MULTIPLIER * (1 + best.damage));
    var line = App.roll(function (r) { return r.pick(Data.AD_SPIKE_LINES); });

    var overlay = h('div.overlay', { 'data-testid': 'spike-dialog' }, [
      h('div.dialog.dialog--spike', {}, [
        h('span.dialog__kicker', { text: best.ad.name + ' is on the telephone' }),
        h('h3.dialog__title', { text: best.story.title }),
        h('p.dialog__body', { text: '"' + line + '"' }),
        h('p.dialog__body', {
          text: 'They will pay ' + App.money(bribe) + ' to keep it out of tonight\'s paper. '
            + 'Pull it and the ' + best.slot.label.toLowerCase() + ' goes white unless you fill it.'
        }),
        h('div.dialog__actions', {}, [
          h('button.btn.btn--ghost', {
            'data-testid': 'refuse-spike', text: 'Print it anyway',
            onclick: function () {
              overlay.remove();
              s.stats.spikesRefused += 1;
              s.reputation.truth = Engine.clamp(s.reputation.truth + 1.5, 0, 100);
              App.checkAchievements();
              attemptPress();
            }
          }),
          h('button.btn.btn--go', {
            'data-testid': 'take-spike', text: 'Take the money',
            onclick: function () {
              overlay.remove();
              delete s.today.assignments[best.slot.id];
              if (best.slot.role === 'lead') { s.today.headline = null; s.today.headlineStyle = null; }
              s.money = Engine.round(s.money + bribe, 2);
              s.stats.spikesTaken += 1;
              s.reputation.truth = Engine.clamp(s.reputation.truth - Data.AD_RELATION.SPIKE_TRUST_COST, 0, 100);
              s.spikedStories = (s.spikedStories || []).concat([{ day: s.day, title: best.story.title, client: best.ad.name, paid: bribe }]);
              App.checkAchievements();
              App.toast('Spiked. ' + App.money(bribe) + ' from ' + best.ad.name + '.', 'good');
              App.go('newsroom');
            }
          })
        ])
      ])
    ]);
    document.body.appendChild(overlay);
    return true;
  }

  /* =========================================================================
   * PRINT — the one place an edition is scored. Everything above is setup.
   * ====================================================================== */
  function doPress() {
    var s = App.state;
    var slots = App.slots();
    var a = s.today.assignments;

    var placements = slots.filter(function (sl) { return sl.role !== 'ad' && sl.role !== 'fixed'; })
      .map(function (sl) { return { slot: sl, story: a[sl.id] ? App.storyById(a[sl.id]) : null }; });
    var placed = placements.filter(function (p) { return p.story; });
    var stories = placed.map(function (p) { return p.story; });
    var lead = leadStory();
    var ads = placedAds();

    /* --- component scores --- */
    var editorBoost = App.roleStat('editor', 'accuracy') * 0.12;
    var designBoost = App.roleStat('designer', 'creativity') * 0.14;
    var articleQuality = Engine.clamp(Engine.avg(stories, Engine.storyScore) + editorBoost, 0, 100);
    var layout = Engine.clamp(Engine.layoutScore(placements, placements.map(function (p) { return p.slot; })) + designBoost, 0, 100);
    var style = Data.HEADLINE_STYLES.filter(function (x) { return x.id === s.today.headlineStyle; })[0];
    var headline = s.today.headlineBuilt
      ? (s.today.headlineBuilt.punch * 0.6 + s.today.headlineBuilt.accuracy * 0.4)
      : Engine.headlineScore(lead, style, Math.max(App.roleStat('editor', 'creativity'), 38));
    var variety = Engine.varietyScore(stories);
    var photoScore = Engine.avg(stories, function (st) { return st.photo ? st.photo.quality : 0; });
    var proofAcc = App.roleStat('proofreader', 'accuracy');
    var typos = App.roll(function (r) { return Engine.expectedTypos(stories.length, Math.max(proofAcc, 30), r); });
    var emptySlots = placements.length - placed.length;

    var quality = Engine.editionQuality({
      articleQuality: articleQuality, layout: layout, headline: headline,
      variety: variety, photo: photoScore, typos: typos,
      lateArticles: 0, emptySlots: emptySlots, paperBonus: App.stock().bonus
    });
    if (s.today.missedBreaking) quality = Engine.clamp(quality - 7, 0, 100);

    /* --- readers --- */
    var adLoad = ads.length / Math.max(1, slots.filter(function (sl) { return sl.role === 'ad'; }).length);
    var placedForReaders = placed.map(function (p) { return { story: p.story, slotWeight: p.slot.weight }; });
    var groupResults = Data.READER_GROUPS.map(function (g) {
      var insertBoost = (s.inserts || []).some(function (id) {
        var ins = Data.INSERTS.filter(function (x) { return x.id === id; })[0];
        return ins && ins.courts === g.id;
      }) ? 9 : 0;
      var sat = insertBoost + Engine.groupSatisfaction(placedForReaders, g, {
        adLoad: adLoad,
        emptyRatio: placements.length ? emptySlots / placements.length : 0,
        varietyBonus: variety
      });
      var rec = s.readers[g.id] || { loyalty: 40, readers: 100 };
      sat = Engine.clamp(sat, 0, 100);
      var newLoyalty = Engine.clamp(rec.loyalty + (sat - 52) * 0.14, 0, 100);
      /* Each group is capped at its share of the city ceiling, or reader
       * growth compounds without bound (see Engine.circulationCeiling). */
      var groupCap = Math.round(Engine.circulationCeiling(s.city.population,
        Engine.reputationAverage(s.reputation)) * (g.base / 6250));
      var newReaders = Engine.clamp(Math.round(rec.readers * Engine.clamp(1 + (sat - 50) * 0.006, 0.86, 1.16)
        + (sat > 70 ? g.base * 0.012 : 0)), 20, Math.max(40, groupCap));
      s.readers[g.id] = { loyalty: Engine.round(newLoyalty, 1), readers: newReaders };
      return { group: g, satisfaction: sat, readers: newReaders, delta: newReaders - rec.readers };
    });
    var satisfaction = Engine.avg(groupResults, function (g) { return g.satisfaction; });

    /* --- circulation & money --- */
    /* Price sensitivity is a reader-weighted blend, applied once as a level
     * shift in copiesSold. Applying it per group per day would compound and
     * drive a pricey paper to zero readers over a week, which is wrong: a dear
     * paper has a smaller audience, it does not have a shrinking one. */
    var totalReaders = Engine.sum(groupResults, function (g) { return g.readers; }) || 1;
    var priceSensitivity = Engine.sum(groupResults, function (g) {
      return g.readers * (g.group.priceSensitivity === undefined ? 1 : g.group.priceSensitivity);
    }) / totalReaders;

    var repAvg = Engine.reputationAverage(s.reputation);
    var pressure = Engine.rivalPressure(s.today.rivals, lead);
    var copies = Engine.copiesSold({
      circulation: Engine.sum(groupResults, function (g) { return g.readers; }),
      quality: quality, satisfaction: satisfaction,
      reputationAvg: repAvg, cityPopulation: s.city.population,
      frontPageExclusive: !!(lead && lead.exclusive),
      breakingCovered: !s.today.missedBreaking && !!(lead && lead.breaking),
      rivalPressure: pressure, subscribers: s.subscribers,
      coverPrice: s.coverPrice, priceSensitivity: priceSensitivity
    });
    var deal = Data.DISTRIBUTION_DEALS.filter(function (x) { return x.id === s.distribution; })[0] || Data.DISTRIBUTION_DEALS[0];
    var cut = Engine.distributionCut(deal);
    var revenue = Engine.round(copies * s.coverPrice * (1 - cut), 2);
    var adMoney = Engine.adRevenue(ads, copies, s.tagCounts);
    var insertCost = Engine.sum(s.inserts || [], function (id) {
      var ins = Data.INSERTS.filter(function (x) { return x.id === id; })[0];
      return ins ? ins.cost : 0;
    });
    /* Inserts are physical pages: they consume paper as well as cash. */
    var insertPages = Engine.sum(s.inserts || [], function (id) {
      var ins = Data.INSERTS.filter(function (x) { return x.id === id; })[0];
      return ins ? ins.pages : 0;
    });
    var billedPages = s.pageCount + insertPages;
    var expenses = Engine.round(Engine.dailyExpenses({
      staff: s.staff, pageCount: billedPages, paperCost: App.paperCost(),
      printRun: copies, overhead: App.officeTier().overhead
    }) + insertCost + Engine.distributionOverhead(deal, copies)
      + Engine.sum(s.channels, function (id) {
        var ch = Data.CHANNELS.filter(function (c) { return c.id === id; })[0];
        return ch ? ch.upkeep : 0;
      }), 2);
    /* Property rents and other media channels pay in every day. */
    var sideIncome = Engine.propertyIncome(s.properties.map(function (id) {
      return Data.PROPERTIES.filter(function (p) { return p.id === id; })[0] || { income: 0 };
    }), s.day);
    var channelMoney = Engine.sum(s.channels, function (id) {
      var ch = Data.CHANNELS.filter(function (c) { return c.id === id; })[0];
      if (!ch) return 0;
      return Engine.channelRevenue(ch, Engine.channelReach(ch, copies));
    });
    var profit = Engine.round(revenue + adMoney + sideIncome + channelMoney - expenses, 2);

    /* --- investigation payoff --- */
    /* --- corrections owed vs corrections printed --- */
    var printedCorrections = stories.filter(function (st) { return st.correction; }).length;
    var owed = s.today.corrections || [];
    var corrPenalty = Engine.correctionPenalty(owed, printedCorrections);
    quality = Engine.clamp(quality + corrPenalty.quality, 0, 100);
    s.stats.correctionsPrinted += printedCorrections;
    s.stats.correctionsSkipped += Math.max(0, owed.length - printedCorrections);
    if (printedCorrections) s.tagCounts.Corrections = (s.tagCounts.Corrections || 0) + printedCorrections;

    /* Tomorrow inherits whatever this edition got wrong. */
    s.corrections = Engine.correctionsOwed(stories.filter(function (st) { return !st.correction; }));

    /* --- press failure --- */
    if (s.today.pressFailure) {
      quality = Engine.clamp(quality + s.today.pressFailure.quality, 0, 100);
    }

    var invStory = stories.filter(function (st) { return st.investigationId; })[0];
    var invResult = null;
    if (invStory) {
      var inv = s.investigations.filter(function (i) { return i.id === invStory.investigationId; })[0];
      if (inv) {
        var outcome = App.roll(function (r) { return Engine.investigationOutcome(inv, r); });
        inv.status = 'closed';
        inv.outcome = outcome;
        invResult = { outcome: outcome, title: inv.title, amount: 0 };
        if (outcome === 'vindicated') { invResult.amount = inv.reward; s.reputation.investigation = Engine.clamp(s.reputation.investigation + 7, 0, 100); }
        else if (outcome === 'published') { invResult.amount = Math.round(inv.reward * 0.5); }
        else if (outcome === 'disputed') { invResult.amount = 0; s.reputation.truth = Engine.clamp(s.reputation.truth - 4, 0, 100); }
        else if (outcome === 'thin') { invResult.amount = -200; }
        else if (outcome === 'debunked') { invResult.amount = -Math.round(inv.reward * 0.4); s.reputation.truth = Engine.clamp(s.reputation.truth - 9, 0, 100); }
        else if (outcome === 'lawsuit') {
          /* A lawsuit is now a claim you can fight or settle, not a flat fine. */
          invResult.amount = -200;
          s.lawsuits.push({
            id: 'law-' + s.day, title: inv.title, claim: 1800 + Math.round(inv.reward * 0.6),
            evidence: inv.evidence, day: s.day, status: 'open'
          });
          s.reputation.professionalism = Engine.clamp(s.reputation.professionalism - 6, 0, 100);
          App.toast('Their lawyers wrote before lunch. See the Company tab.', 'bad');
        }
        profit = Engine.round(profit + invResult.amount, 2);
      }
    }

    /* --- print run gamble ---
     * `copies` above is DEMAND. If the player committed to a run, that run is
     * what actually got printed, and the gap costs money in both directions. */
    var demand = copies;
    var run = s.today.printRun ? Engine.printRunResult(s.today.printRun, demand, s.coverPrice) : null;
    if (run) {
      copies = run.sold;
      revenue = Engine.round(run.sold * s.coverPrice * (1 - cut), 2);
      /* Paper is paid on what was PRINTED, not what sold. */
      expenses = Engine.round(Engine.dailyExpenses({
        staff: s.staff, pageCount: billedPages, paperCost: App.paperCost(),
        printRun: run.printed, overhead: App.officeTier().overhead
      }) + insertCost, 2);
      profit = Engine.round(revenue + adMoney - expenses, 2);
      if (run.soldOut) s.stats.selloutDays += 1;
    }

    /* --- advertiser fallout --- */
    var pulled = [];
    ads.forEach(function (ad) {
      var rel = s.adRelations[ad.clientId] || (s.adRelations[ad.clientId] = { loyalty: 50, cooldownUntil: 0 });
      var client = Data.AD_CLIENTS.filter(function (c) { return c.id === ad.clientId; })[0];
      var fallout = client ? Engine.adFallout(client, stories) : 0;
      if (fallout >= Data.AD_RELATION.PULL_THRESHOLD) {
        rel.loyalty = Engine.clamp(rel.loyalty - fallout * 30, 0, 100);
        rel.cooldownUntil = s.day + Data.AD_RELATION.COOLDOWN_DAYS;
        pulled.push(ad.name);
      } else {
        rel.loyalty = Engine.clamp(rel.loyalty + Data.AD_RELATION.LOYALTY_GAIN, 0, 100);
      }
    });

    /* --- threads: covering one keeps it alive, ignoring it annoys followers --- */
    stories.forEach(function (st) {
      if (!st.threadId) return;
      var t = s.threads.filter(function (x) { return x.id === st.threadId; })[0];
      if (!t) return;
      t.step += 1;
      t.lastCoveredDay = s.day;
      if (s.coveredThreads.indexOf(t.id) < 0) { s.coveredThreads.push(t.id); s.stats.threadsFollowed += 1; }
      if (t.step >= (t.stepTitles || []).length) t.status = 'closed';
    });
    var openFollowed = s.threads.filter(function (t) {
      return t.status === 'open' && s.coveredThreads.indexOf(t.id) >= 0;
    });
    var dropPenalty = Engine.droppedThreadPenalty(openFollowed, s.day);

    /* --- sources: printing against a source costs trust --- */
    stories.forEach(function (st) {
      Data.SOURCES.forEach(function (src) {
        if (src.angeredBy.indexOf(st.category) >= 0 && st.importance > 70) {
          s.sources[src.id] = Engine.clamp((s.sources[src.id] || 35) - 4, 0, 100);
        } else if (src.feeds.indexOf(st.category) >= 0) {
          s.sources[src.id] = Engine.clamp((s.sources[src.id] || 35) + 1.2, 0, 100);
        }
      });
    });

    /* --- censorship: the ministry reads the proofs --- */
    if (Data.REGIME.active || s.scenarioRegime) {
      var redacted = Engine.censorshipRedactions(stories, Data.REGIME);
      if (redacted.length) {
        quality = Engine.clamp(quality - redacted.length * 6, 0, 100);
        s.reputation.truth = Engine.clamp(s.reputation.truth - redacted.length * 2, 0, 100);
      }
    }

    /* --- embargoes broken --- */
    stories.forEach(function (st) {
      if (!st.embargo || s.day >= st.embargo.untilDay) return;
      s.reputation.professionalism = Engine.clamp(s.reputation.professionalism - 6, 0, 100);
      Object.keys(s.sources).forEach(function (k) {
        s.sources[k] = Engine.clamp(s.sources[k] - 6, 0, 100);
      });
      App.toast('You broke an embargo. Every source heard about it.', 'bad');
    });

    /* --- whistleblowers named --- */
    stories.forEach(function (st) {
      if (!st.whistleblower) return;
      if (st.whistleblower.protected === false) {
        Object.keys(s.sources).forEach(function (k) { s.sources[k] = Engine.clamp(s.sources[k] - 14, 0, 100); });
        s.reputation.truth = Engine.clamp(s.reputation.truth - 6, 0, 100);
        App.toast('You named your source. Nobody will call again.', 'bad');
      } else {
        s.reputation.investigation = Engine.clamp(s.reputation.investigation + 2, 0, 100);
      }
    });

    /* --- districts: coverage wins the street --- */
    var byDistrict = {};
    stories.forEach(function (st) {
      var dd = Data.districtOf(st.title);
      if (dd) byDistrict[dd] = (byDistrict[dd] || 0) + 1;
    });
    Data.DISTRICTS.forEach(function (dd) {
      var rec = s.districts[dd.id] || (s.districts[dd.id] = { loyalty: 42, readers: 0 });
      rec.loyalty = Engine.clamp(rec.loyalty + Engine.districtDelta(dd, byDistrict[dd.id] || 0, stories.length), 0, 100);
      rec.readers = Engine.districtReaders(dd, rec.loyalty);
    });

    /* --- reading heat map --- */
    var teaserCount = (s.today.teasers || []).length;
    var pageNos = [];
    placed.forEach(function (p) { if (pageNos.indexOf(p.slot.page) < 0) pageNos.push(p.slot.page); });
    pageNos.sort(function (x, y) { return x - y; }).forEach(function (pg, i) {
      var att = Engine.pageAttention(i, teaserCount, quality);
      s.heatMap[pg] = Engine.round(((s.heatMap[pg] || att) * 0.7) + att * 0.3, 3);
    });

    /* --- subscriptions --- */
    var churn = Engine.subscriberChurn(s.subscribers, satisfaction);
    var gained = s.subscriptionSpend
      ? Engine.subscriptionDrive(s.subscriptionSpend, satisfaction, s.city.population) : 0;
    if (s.subscriptionSpend) {
      expenses = Engine.round(expenses + s.subscriptionSpend, 2);
      profit = Engine.round(profit - s.subscriptionSpend, 2);
    }

    /* --- the comic runs on --- */
    var strip = Data.COMIC_STRIPS.filter(function (c) { return c.id === s.comic.stripId; })[0] || Data.COMIC_STRIPS[0];
    s.comic.panel += 1;
    if (s.comic.panel >= strip.panels.length) {
      s.comic.panel = 0;
      s.comic.stripId = App.roll(function (r) { return r.pick(Data.COMIC_STRIPS).id; });
    }

    /* --- consequence people: everyone you named is remembered --- */
    stories.forEach(function (st) {
      if (!st.subject) return;
      s.subjects.push({
        name: st.subject.name, role: st.subject.role, day: s.day,
        storyTitle: st.title, harm: Engine.subjectImpact(st), truth: st.truth, resolved: null
      });
    });
    if (s.subjects.length > 120) s.subjects = s.subjects.slice(-120);

    stories.forEach(function (st) { if (st.obituary) st.obituary.printed = true; });

    /* --- classifieds: small, steady, first thing the web takes --- */
    var classifiedMoney = (s.today.classifieds && s.today.classifieds.revenue) || 0;
    profit = Engine.round(profit + classifiedMoney, 2);

    /* --- correction spiral: a correction can itself be wrong --- */
    stories.forEach(function (st) {
      if (!st.correction) return;
      var acc = Math.max(App.roleStat('proofreader', 'accuracy'), 40);
      if (Engine.correctionOfCorrection(st.correction, acc)) {
        s.corrections.push({
          title: 'our correction regarding ' + st.correction.title,
          category: 'Correction', wrongness: 0.35, size: 'short', severity: 'clarification'
        });
      }
    });

    /* --- rolling histories --- */
    s.satisfactionHistory.push(Engine.round(satisfaction, 1));
    if (s.satisfactionHistory.length > 60) s.satisfactionHistory = s.satisfactionHistory.slice(-60);
    s.profitHistory.push(profit);
    if (s.profitHistory.length > 60) s.profitHistory = s.profitHistory.slice(-60);

    /* --- election coverage --- */
    if (s.election && !s.election.result) {
      stories.forEach(function (st) {
        Data.CANDIDATES.forEach(function (cand) {
          if (st.title.indexOf(cand.name) >= 0) {
            s.election.coverage[cand.id] = (s.election.coverage[cand.id] || 0) + 1;
          }
        });
      });
    }

    /* --- advertiser blocs: anger one bank and the others get nervous --- */
    pulled.forEach(function (name) {
      Object.keys(Data.AD_BLOCS).forEach(function (bloc) {
        var members = Data.AD_BLOCS[bloc].map(function (id) {
          var c = Data.AD_CLIENTS.filter(function (x) { return x.id === id; })[0];
          return c ? c.name : '';
        });
        if (members.indexOf(name) >= 0) {
          s.blocMood[bloc] = Engine.clamp((s.blocMood[bloc] || 50) - 12, 0, 100);
        }
      });
    });

    /* --- apply --- */
    /* Word of mouth: a good paper gains subscribers without a drive. */
    var organic = satisfaction > 56 ? Math.round(copies * 0.004 * ((satisfaction - 56) / 40)) : 0;
    s.subscribers = Engine.clamp(s.subscribers - churn + gained + organic, 0, Math.round(copies * 0.55));
    s.money = Engine.round(s.money + profit, 2);
    s.circulation = copies;
    s.subscribers = Math.max(0, Math.round(s.subscribers * (satisfaction > 58 ? 1.02 : 0.99)));

    var delta = Engine.reputationDelta({
      stories: stories, quality: quality, typos: typos,
      investigationPublished: !!invStory
    });
    if (style) delta.truth = Engine.round(delta.truth + style.truthShift * 0.12, 2);
    if (s.today.headlineBuilt) delta.truth = Engine.round(delta.truth + s.today.headlineBuilt.truthShift * 0.35, 2);
    delta.truth = Engine.round(delta.truth + corrPenalty.truth, 2);
    delta.professionalism = Engine.round(delta.professionalism + corrPenalty.professionalism + dropPenalty, 2);
