<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Front Page — pixel newsroom chrome wrapped around a real serif broadsheet.
   Palette is fixed by the brief: cream, brown, black, white, warm grey,
   with dark green / dark red / navy used sparingly as signal colours only.
   ========================================================================== */
:root{
  --paper:#F2E8D5;      /* newsprint */
  --paper-2:#E7D9BF;    /* shaded newsprint */
  --paper-3:#DCCBAC;
  --white:#FBF7EE;
  --ink:#1A1512;        /* near-black brown */
  --brown:#6B4A2F;
  --brown-dark:#3E2A1B;
  --grey:#9A8B79;
  --green:#24503B;
  --red:#8C2B22;
  --navy:#24364F;
  --gold:#C9A227;

  --pixel:'Silkscreen','Courier New',ui-monospace,monospace;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;

  --edge:3px;
  --shadow:4px 4px 0 var(--brown-dark);
  --shadow-sm:3px 3px 0 var(--brown-dark);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper-3);
  background-image:
    linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:8px 8px;
  color:var(--ink);
  font-family:var(--pixel);
  font-size:13px;
  line-height:1.55;
  -webkit-font-smoothing:none;
  image-rendering:pixelated;
}
.sprite{image-rendering:pixelated;shape-rendering:crispEdges;display:block}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* ---------- buttons ---------- */
.btn{
  display:inline-block;border:var(--edge) solid var(--ink);
  background:var(--white);color:var(--ink);
  padding:9px 14px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.06em;
  box-shadow:var(--shadow-sm);
  transition:transform .06s steps(2),box-shadow .06s steps(2);
}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--brown-dark)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--brown-dark)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn--go{background:var(--green);color:var(--white);border-color:var(--ink)}
.btn--print{background:var(--red);color:var(--white);width:100%;padding:14px;font-size:15px}
.btn--ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn--small{padding:6px 10px;font-size:11px}

.chip{
  border:2px solid var(--brown);background:var(--white);
  padding:4px 8px;cursor:pointer;font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;
}
.chip:hover{background:var(--paper-2)}
.chip--on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips--tight{margin-bottom:10px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  background:var(--ink);color:var(--paper);
  padding:10px 16px;border-bottom:var(--edge) solid var(--brown-dark);
}
.topbar__brand{display:flex;flex-direction:column}
.topbar__paper{font-size:16px;letter-spacing:.04em;color:var(--white)}
.topbar__date{font-size:10px;color:var(--grey)}
.topbar__tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  background:transparent;border:2px solid transparent;color:var(--paper-2);
  padding:5px 10px;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
}
.tab:hover{border-color:var(--grey)}
.tab--on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.topbar__stats{display:flex;gap:14px}
.stat{display:flex;flex-direction:column;line-height:1.25}
.stat__label{font-size:9px;color:var(--grey);text-transform:uppercase;letter-spacing:.1em}
.stat__value{font-size:13px;color:var(--white)}

/* ---------- layout ---------- */
.screen{max-width:1440px;margin:0 auto;padding-bottom:60px}
.office,.desk,.results,.two{display:grid;gap:18px;padding:18px}
.office{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.desk{grid-template-columns:minmax(320px,1fr) minmax(0,1.65fr)}
.results{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.one{padding:18px}
.office__left,.office__right,.desk__spike,.desk__paper,.results__left,.results__right{
  display:flex;flex-direction:column;gap:18px;min-width:0
}
@media(max-width:1080px){
  .office,.desk,.results,.two,.two--archive{grid-template-columns:1fr}
}
}

/* ---------- panels ---------- */
.panel{
  background:var(--paper);
  border:var(--edge) solid var(--ink);
  box-shadow:var(--shadow);
  padding:14px;
}
.panel__head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-bottom:2px dashed var(--brown);padding-bottom:8px;margin-bottom:12px;
}
.panel__title{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.panel__aside{font-size:10px;color:var(--brown)}
.panel__note{margin:0 0 10px;font-size:11px;color:var(--brown)}

/* ---------- boot ---------- */
.boot{max-width:760px;margin:0 auto;padding:52px 20px 80px;text-align:center}
.boot__kicker{font-size:10px;letter-spacing:.22em;color:var(--brown);text-transform:uppercase}
.boot__title{
  font-family:var(--pixel);font-size:clamp(38px,9vw,84px);
  margin:12px 0 6px;letter-spacing:.06em;color:var(--ink);
  text-shadow:5px 5px 0 var(--brown);
}
.boot__rule{height:0;border-top:var(--edge) solid var(--ink);border-bottom:2px solid var(--ink);margin:14px 0}
.boot__sub{font-family:var(--serif);font-size:17px;line-height:1.6;max-width:56ch;margin:0 auto}
.boot__shelf{display:flex;justify-content:center;gap:26px;margin:34px 0 30px}
.boot__prop{padding:8px;background:var(--paper);border:2px solid var(--brown);box-shadow:var(--shadow-sm)}
.boot__panel{
  background:var(--paper);border:var(--edge) solid var(--ink);box-shadow:var(--shadow);
  padding:20px;text-align:left;max-width:520px;margin:0 auto;
}
.field{display:block;margin-bottom:16px}
.field__label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--brown);margin-bottom:6px}
.field__input{
  width:100%;padding:10px;border:var(--edge) solid var(--ink);background:var(--white);
  font-family:var(--serif);font-size:19px;color:var(--ink);
}
.boot__actions{display:flex;gap:10px;flex-wrap:wrap}
.boot__warn{margin:14px 0 0;font-size:10px;color:var(--red)}
.boot__foot{font-family:var(--serif);font-size:13px;color:var(--brown);margin-top:28px;max-width:52ch;margin-inline:auto}

/* ---------- office room ---------- */
.room{
  display:flex;flex-wrap:wrap;gap:16px;padding:16px;
  background:var(--paper-2);border:2px solid var(--brown);
  background-image:repeating-linear-gradient(90deg,rgba(107,74,47,.08) 0 2px,transparent 2px 16px);
}
.room__item{display:flex;flex-direction:column;align-items:center;gap:5px;width:72px}
.room__label{font-size:9px;color:var(--brown);text-align:center;line-height:1.25}
.room__note{font-family:var(--serif);font-size:14px;color:var(--brown-dark);margin:12px 0 0}
.room__upgrade{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--brown);flex-wrap:wrap}
.room__upgradeText{display:flex;flex-direction:column;font-size:10px;color:var(--brown)}
.room__upgradeText strong{font-size:12px;color:var(--ink)}

/* ---------- press settings ---------- */
.press__row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.press__label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brown);width:100px}
.press__cost{font-family:var(--serif);font-size:14px;margin:6px 0 12px}

/* ---------- day card ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dotted var(--grey);padding:3px 0}
.kv__k{font-size:10px;color:var(--brown);text-transform:uppercase;letter-spacing:.06em}
.kv--good .kv__v{color:var(--green)}
.kv--bad .kv__v{color:var(--red)}
.daycard__lead{font-family:var(--serif);font-size:15px;margin:12px 0;display:flex;flex-direction:column;gap:3px}
.daycard__label{font-family:var(--pixel);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--brown)}
.daycard__empty{font-family:var(--serif);font-style:italic;color:var(--brown);margin:6px 0}
.daycard__actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- investigations / letters ---------- */
.rumour,.inv{border:2px solid var(--brown);background:var(--white);padding:10px;margin-bottom:10px}
.rumour__title,.inv__title{font-family:var(--serif);font-size:16px;font-weight:700}
.rumour__meta,.inv__meta{font-size:10px;color:var(--brown);margin:4px 0 8px}
.rumour__actions,.inv__actions,.inv__staff{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.inv__warn{color:var(--red);font-size:10px;margin:8px 0 0}
.bar{height:12px;border:2px solid var(--ink);background:var(--paper-2)}
.bar__fill{display:block;height:100%;background:var(--green)}
.letter{border-left:5px solid var(--brown);background:var(--white);padding:8px 10px;margin-bottom:8px}
.letter--praise{border-left-color:var(--green)}
.letter--complaint{border-left-color:var(--red)}
.letter--idea{border-left-color:var(--navy)}
.letter__body{font-family:var(--serif);font-size:14px;margin:0 0 6px}
.letter__actions{display:flex;gap:6px}

/* ---------- cards ---------- */
.spike{display:flex;flex-direction:column;gap:9px;max-height:560px;overflow-y:auto;padding-right:4px}
.spike--ads{max-height:280px}
.card{
  background:var(--white);border:2px solid var(--ink);padding:9px;cursor:pointer;
  box-shadow:2px 2px 0 var(--brown);
}
.card:hover{background:var(--paper)}
.card--sel{box-shadow:0 0 0 3px var(--green),3px 3px 0 var(--brown);background:var(--paper)}
.card--breaking{border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.card--story{border-left-width:5px}
.card__top{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.card__title{font-family:var(--serif);font-size:15px;font-weight:700;margin:0 0 6px;line-height:1.3}
.card__stats{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.card__foot{font-size:9px;color:var(--brown);text-transform:uppercase;letter-spacing:.05em}
.card__copy{font-family:var(--serif);font-style:italic;font-size:13px;margin:0 0 6px;color:var(--brown-dark)}
.card--ad{border-style:dashed;background:var(--paper)}
.card--owned{opacity:.72}

.tag{font-size:8px;padding:2px 5px;border:1px solid var(--brown);text-transform:uppercase;letter-spacing:.08em;background:var(--paper-2)}
.tag--news{background:var(--navy);color:var(--white);border-color:var(--navy)}
.tag--business{background:var(--brown-dark);color:var(--white);border-color:var(--brown-dark)}
.tag--life{background:var(--paper-3)}
.tag--local{background:var(--green);color:var(--white);border-color:var(--green)}
.tag--sports{background:var(--brown);color:var(--white)}
.tag--excl,.tag--inv{background:var(--gold);border-color:var(--brown-dark)}
.tag--brk,.tag--risk{background:var(--red);color:var(--white);border-color:var(--red)}
.tag--money{background:var(--green);color:var(--white);border-color:var(--green)}
.tag--role{background:var(--ink);color:var(--white);border-color:var(--ink)}

.meter{display:flex;align-items:center;gap:6px}
.meter__label{font-size:9px;width:38px;color:var(--brown);text-transform:uppercase}
.meter__track{flex:1;height:8px;background:var(--paper-2);border:1px solid var(--brown);display:block;min-width:40px}
.meter__fill{display:block;height:100%;background:var(--brown-dark)}
.meter__num{font-size:9px;width:22px;text-align:right;color:var(--brown)}

/* ---------- the newspaper ---------- */
.paperwrap{display:flex;flex-direction:column;gap:16px;max-height:none}
.page{
  background:var(--white);border:2px solid var(--ink);padding:14px;
  box-shadow:inset 0 0 0 1px var(--paper-2);
}
.page--front{border-width:var(--edge)}
.page__folio{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--brown);border-bottom:1px solid var(--brown);padding-bottom:5px;margin-bottom:10px}
.page__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.masthead{text-align:center;margin-bottom:12px}
.masthead__name{
  font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.6vw,40px);
  letter-spacing:.02em;margin:6px 0 4px;line-height:1;
}
.masthead__line{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown);margin-bottom:6px}
.masthead__rule{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:2px}

.slot{
  border:2px dashed var(--grey);min-height:96px;padding:8px;cursor:pointer;
  background:var(--paper);display:flex;
}
.slot--span1{grid-column:span 1}
.slot--span2{grid-column:span 2}
.slot--span3{grid-column:span 3}
.slot--lead{min-height:170px}
.slot--fixed{background:var(--paper-2);border-style:solid;border-color:var(--brown);cursor:default;min-height:70px}
.slot--full{border-style:solid;border-color:var(--ink);background:var(--white)}
.slot--open:hover,.slot--over{background:var(--paper-2);border-color:var(--green)}
.slot__empty{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;gap:4px;text-align:center}
.slot__label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--brown)}
.slot__hint{font-size:9px;color:var(--grey)}

.placed{width:100%;display:flex;flex-direction:column}
.placed__meta{display:flex;justify-content:space-between;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--brown);margin-bottom:4px}
.placed__fit.is-good{color:var(--green)}
.placed__fit.is-ok{color:var(--brown)}
.placed__fit.is-bad{color:var(--red)}
.headline{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.22;margin:0 0 6px}
.headline--lead{font-size:clamp(20px,2.4vw,30px);line-height:1.1;letter-spacing:-.01em}
.headline--printed{font-size:clamp(22px,3vw,34px);text-align:center;line-height:1.15;margin:14px 0 8px}
.body{font-family:var(--serif);font-size:12.5px;line-height:1.5;margin:0 0 6px;color:var(--brown-dark);
  text-align:justify;hyphens:auto}
.placed__byline{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--brown);margin-top:auto}
.photo{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--brown);padding:6px;margin-bottom:6px}
.photo__cap{font-size:8px;color:var(--brown);text-transform:uppercase;letter-spacing:.06em}
.fixed{width:100%;text-align:center}
.fixed__label{font-size:9px;letter-spacing:.16em;color:var(--brown)}
.fixed__text{font-family:var(--serif);font-size:13px;margin:4px 0 0}
.fixed__strip{display:flex;justify-content:center;gap:10px;margin-top:6px}
.advert{width:100%;border:3px double var(--ink);padding:8px;text-align:center;background:var(--paper-2)}
.advert__frame{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.advert__copy{font-family:var(--serif);font-style:italic;font-size:13px;margin:5px 0}
.advert__rate{font-size:8px;color:var(--brown)}

/* ---------- headline picker ---------- */
.headlinebox__lead{font-family:var(--serif);font-size:14px;margin:0 0 10px}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.style{
  border:2px solid var(--brown);background:var(--white);padding:8px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:2px;
}
.style:hover{background:var(--paper-2)}
.style--on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.style__name{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.style__punch{font-size:9px;opacity:.85}
.style__truth{font-size:9px;opacity:.7}
.headlinebox__set{
  font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.2;
  margin:12px 0;padding:10px;border-left:5px solid var(--red);background:var(--paper-2);
}

/* ---------- press bar ---------- */
.pressbar{background:var(--ink);border:var(--edge) solid var(--brown-dark);box-shadow:var(--shadow);padding:14px}
.pressbar__info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--paper-2);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pressbar__warn{color:var(--gold);font-size:10px;margin:8px 0 0;text-align:center}

/* ---------- results ---------- */
.printed{background:var(--white);border:var(--edge) solid var(--ink);padding:16px}
.printed__sub{font-family:var(--serif);font-style:italic;text-align:center;color:var(--brown-dark);margin:0 0 12px}
.printed__weather{font-family:var(--serif);font-size:13px;text-align:center;color:var(--brown);margin:0 0 12px}
.printed__marks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;border-top:2px dashed var(--brown);padding-top:12px}
.mark{border:2px solid var(--ink);background:var(--paper);padding:6px 12px;text-align:center;min-width:82px}
.mark--bad{border-color:var(--red);color:var(--red)}
.mark__v{display:block;font-size:19px}
.mark__l{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--brown)}
.printed__miss{color:var(--red);font-size:11px;text-align:center;margin:10px 0 0}
.printed__inv{font-family:var(--serif);font-size:14px;margin:10px 0 0;padding:8px;border:2px solid var(--brown)}
.printed__inv.is-good{border-color:var(--green);background:rgba(36,80,59,.08)}
.printed__inv.is-bad{border-color:var(--red);background:rgba(140,43,34,.08)}
.ledger__line{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--grey);font-size:12px}
.ledger__line--good{color:var(--green);font-size:15px}
.ledger__line--bad{color:var(--red);font-size:15px}
.ledger__rule{border-top:2px solid var(--ink);margin:6px 0}
.reaction{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.reaction__name{font-size:10px;width:100px;color:var(--brown-dark)}
.reaction__delta{font-size:10px;width:44px;text-align:right}
.is-good{color:var(--green)}
.is-bad{color:var(--red)}
.rival{display:flex;flex-direction:column;border-bottom:1px dotted var(--grey);padding:6px 0}
.rival__name{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--brown)}
.rival__head{font-family:var(--serif);font-size:14px}
.sleepbar{background:var(--brown-dark);border:var(--edge) solid var(--ink);box-shadow:var(--shadow);padding:14px}
.sleepbar__note{color:var(--paper-2);font-size:10px;margin:0 0 10px;text-align:center}

/* ---------- staff / shop ---------- */
.staffgrid,.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card--staff,.card--shop{cursor:default}
.staffcard__head,.shopcard__head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.staffcard__mood{font-size:9px;color:var(--brown);text-transform:uppercase;letter-spacing:.06em}
.staffcard__effect{font-family:var(--serif);font-size:12px;color:var(--brown-dark);margin:0 0 8px}

/* ---------- archive ---------- */
.two--archive{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.volumes{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto}
.volume{
  text-align:left;background:var(--white);border:2px solid var(--brown);padding:7px;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
}
.volume:hover{background:var(--paper-2)}
.volume--on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.volume__date{font-size:9px;letter-spacing:.08em;opacity:.8}
.volume__head{font-family:var(--serif);font-size:13px;line-height:1.25}
.volume__meta{font-size:9px;opacity:.7}
.archive__inside{border-top:2px dashed var(--brown);margin-top:12px;padding-top:10px}
.archive__inside h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--brown)}
.archive__list{font-family:var(--serif);font-size:13px;margin:0;padding-left:18px;columns:2;column-gap:20px}
.archive__ads{font-size:10px;color:var(--brown);margin:10px 0}
.archive__nav{display:flex;justify-content:space-between;margin-top:14px}

/* ---------- readers ---------- */
.readerrow{border-bottom:1px dotted var(--grey);padding:8px 0}
.readerrow__head{display:flex;justify-content:space-between;margin-bottom:4px}
.readerrow__name{font-size:12px}
.readerrow__num{font-size:10px;color:var(--brown)}
.readerrow__likes{font-size:9px;color:var(--grey);display:block;margin-top:4px}
.reprow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.reprow__k{font-size:10px;width:112px;color:var(--brown-dark)}
.reprow__v{font-size:10px;width:26px;text-align:right;color:var(--brown)}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tagcount{font-size:10px;border:2px solid var(--brown);padding:3px 7px;background:var(--white)}
.identity{display:flex;flex-direction:column;gap:2px;border-top:2px dashed var(--brown);padding-top:10px;margin:0}
.identity__label{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--brown)}
.identity__name{font-family:var(--serif);font-size:22px}

/* ---------- overlay / dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(26,21,18,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.dialog{background:var(--paper);border:var(--edge) solid var(--ink);box-shadow:8px 8px 0 var(--brown-dark);padding:20px;max-width:460px}
.dialog--breaking{border-color:var(--red);box-shadow:8px 8px 0 var(--red)}
.dialog__kicker{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.dialog__title{font-family:var(--serif);font-size:23px;margin:6px 0 8px;line-height:1.2}
.dialog__body{font-family:var(--serif);font-size:14px;margin:0 0 16px}
.dialog__actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--ink);color:var(--paper);border:2px solid var(--brown-dark);box-shadow:var(--shadow-sm);padding:8px 14px;font-size:11px}
.toast--good{background:var(--green)}
.toast--bad{background:var(--red)}
.toast.is-out{opacity:0;transition:opacity .5s}


/* ---------- v6 components ---------- */
.runbox{border:2px dashed var(--brown);padding:8px;margin-bottom:10px;background:var(--paper)}
.runbox__note{font-family:var(--serif);font-size:12px;margin:6px 0 0;color:var(--brown-dark)}
.dialog--spike{border-color:var(--gold);box-shadow:8px 8px 0 var(--brown-dark)}
.dialog--spike .dialog__kicker{color:var(--brown-dark)}
.awards{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.award{border:2px solid var(--brown);background:var(--white);padding:10px;position:relative}
.award--won{border-color:var(--green);background:rgba(36,80,59,.07)}
.award__head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.award__name{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.award__winner{font-family:var(--serif);font-size:15px;font-weight:700}
.award__blurb{font-family:var(--serif);font-style:italic;font-size:13px;margin:4px 0 0;color:var(--brown)}
.award__ribbon{position:absolute;top:-9px;right:10px;background:var(--green);color:var(--white);font-size:9px;padding:2px 7px;border:2px solid var(--ink)}
.ceremony__verdict{font-family:var(--serif);font-size:16px;margin:14px 0;padding:10px;border-left:5px solid var(--gold);background:var(--paper-2)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.wall__frame{border:4px double var(--brown-dark);background:var(--white);padding:10px;text-align:center}
.wall__date{font-size:8px;letter-spacing:.1em;color:var(--brown);text-transform:uppercase}
.wall__head{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.2;margin:6px 0}
.wall__meta{font-size:9px;color:var(--brown)}
.achlist{display:flex;flex-direction:column;gap:6px}
.ach{display:flex;gap:8px;align-items:flex-start;padding:6px;border-bottom:1px dotted var(--grey);opacity:.5}
.ach--on{opacity:1}
.ach__mark{color:var(--gold);font-size:15px;width:16px}
.ach__name{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ach__blurb{display:block;font-family:var(--serif);font-size:12px;color:var(--brown)}
.tag--correction{background:var(--red);color:var(--white);border-color:var(--red)}
.tag--letters{background:var(--navy);color:var(--white);border-color:var(--navy)}
.tag--thread{background:var(--gold);border-color:var(--brown-dark)}

/* ---------- themes (cosmetic only) ---------- */
body[data-theme="letterpress"]{--paper:#EDE3CE;--paper-2:#DFD2B6;--ink:#120F0C;--brown:#5A3C24}
body[data-theme="mono"]{--paper:#FFFFFF;--paper-2:#F0F0F0;--paper-3:#E4E4E4;--ink:#000000;--brown:#444444;--brown-dark:#222222;--grey:#999999;--green:#333333;--red:#000000;--navy:#333333;--gold:#666666}
body[data-theme="tabloid"]{--paper:#FFF8E1;--paper-2:#FFE9B0;--red:#B3140F;--ink:#141210}
body[data-theme="cafe"]{--paper:#F0E4D2;--paper-2:#E2D0B6;--brown:#7A5236;--green:#3A5A40}


/* ---------- v7 components ---------- */
.teasers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.teaser{border:1px dashed var(--brown);background:transparent;padding:3px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;max-width:170px;text-align:left}
.teaser--on{border-style:solid;background:var(--paper-2)}
.teaser__label{font-size:8px;letter-spacing:.1em;color:var(--brown)}
.teaser__title{font-family:var(--serif);font-size:11px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.districts{display:flex;flex-direction:column;gap:8px}
.district{border-bottom:1px dotted var(--grey);padding-bottom:6px}
.district__head{display:flex;justify-content:space-between}
.district__name{font-size:12px}
.district__num{font-size:10px;color:var(--brown)}
.heat__row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.heat__page{font-size:10px;width:60px;color:var(--brown-dark)}
.heat__v{font-size:10px;width:36px;text-align:right;color:var(--brown)}
.floor{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--paper-2);
  border:2px solid var(--brown);padding:5px;margin:10px 0}
.floor__cell{aspect-ratio:1;border:1px dashed var(--grey);display:flex;align-items:center;
  justify-content:center;cursor:pointer;background:var(--paper)}
.floor__cell:hover{border-color:var(--green);background:var(--white)}
.floor__cell--full{border-style:solid;border-color:var(--brown)}
@media(max-width:700px){.floor{grid-template-columns:repeat(6,1fr)}.teaser{max-width:100%}}


/* ---------- v8 components ---------- */
.builder{border:2px dashed var(--brown);padding:10px;margin:10px 0;background:var(--paper-2)}
.crop{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:12px 0;
  border:2px solid var(--ink);background:var(--paper-2);padding:4px}
.crop__cell{aspect-ratio:1;border:1px dashed var(--grey);cursor:pointer;display:flex;
  align-items:center;justify-content:center;background:var(--paper)}
.crop__cell--in{background:var(--white);border-style:solid;border-color:var(--brown)}
.crop__cell--subject{box-shadow:inset 0 0 0 2px var(--green)}

/* ---------- phones ----------
   The newspaper grid must collapse or the 3-column page overflows and a
   single-column brief ends up 130px wide holding justified serif text. */
@media(max-width:700px){
  body{font-size:12px}
  .office,.desk,.results,.two,.one{padding:10px;gap:12px}
  .page__grid{grid-template-columns:1fr}
  .slot--span1,.slot--span2,.slot--span3{grid-column:1/-1}
  .slot,.slot--lead{min-height:0}
  .body{text-align:left;hyphens:none}
  .topbar{padding:8px 10px;gap:8px}
  .topbar__stats{gap:10px;width:100%;justify-content:space-between}
  .topbar__tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap}
  .spike{max-height:none}
  .archive__list{columns:1}
  .styles{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .press__label{width:100%}
  .staffgrid,.shopgrid{grid-template-columns:1fr}
  .masthead__name{font-size:clamp(20px,7vw,30px)}
  .headline--lead{font-size:clamp(18px,5.5vw,24px)}
  .boot{padding:28px 14px 60px}
  .boot__shelf{gap:12px;flex-wrap:wrap}
  .dialog{padding:14px}


@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

<!-- ==== engine.js ==== -->
<script>
/* ===========================================================================
 * engine.js — pure game logic. NO DOM. NO rendering. NO App references.
 * Everything here is a deterministic function of its arguments.
 * Tests call these directly via window.Engine.
 * ======================================================================== */
var Engine = (function () {
  'use strict';

  /* ---------- numbers ---------- */
  function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }
  function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
  function round(n, dp) { var m = Math.pow(10, dp || 0); return Math.round(n * m) / m; }
  function sum(arr, fn) {
    var t = 0;
    for (var i = 0; i < arr.length; i++) t += fn ? fn(arr[i], i) : arr[i];
    return t;
  }
  function avg(arr, fn) { return arr.length ? sum(arr, fn) / arr.length : 0; }

  /* ---------- deterministic RNG (mulberry32) ----------
   * The whole game is seeded so a smoke test can replay an identical run.
   * An Rng carries its own cursor; state.rngCursor is snapshotted on save
   * so reloading a save resumes the same stream. */
  function rng(seed) {
    var s = (seed >>> 0) || 1;
    var api = {
      get cursor() { return s; },
      next: function () {
        s |= 0; s = (s + 0x6D2B79F5) | 0;
        var t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      int: function (lo, hi) { return lo + Math.floor(api.next() * (hi - lo + 1)); },
      chance: function (p) { return api.next() < p; },
      pick: function (arr) { return arr[Math.floor(api.next() * arr.length)]; },
      shuffle: function (arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(api.next() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      },
      weighted: function (items, weightFn) {
        var total = sum(items, weightFn);
        if (total <= 0) return items[0];
        var roll = api.next() * total;
        for (var i = 0; i < items.length; i++) {
          roll -= weightFn(items[i], i);
          if (roll <= 0) return items[i];
        }
        return items[items.length - 1];
      }
    };
    return api;
  }

  /* ---------- calendar ----------
   * The game uses a tidy 28-day / 12-month year so archive math never
   * needs a real calendar. day 1 == Year 1, Month 1, Day 1. */
  var DAYS_PER_MONTH = 28, MONTHS_PER_YEAR = 12;
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  var WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function dateFromDay(day, startYear) {
    var d = Math.max(1, day) - 1;
    var yearsIn = Math.floor(d / (DAYS_PER_MONTH * MONTHS_PER_YEAR));
    var rem = d % (DAYS_PER_MONTH * MONTHS_PER_YEAR);
    var monthIdx = Math.floor(rem / DAYS_PER_MONTH);
    return {
      day: (rem % DAYS_PER_MONTH) + 1,
      monthIndex: monthIdx,
      month: MONTH_NAMES[monthIdx],
      year: (startYear || 1995) + yearsIn,
      weekday: WEEKDAYS[d % 7],
      isSunday: (d % 7) === 6
    };
  }
  function formatDate(day, startYear) {
    var t = dateFromDay(day, startYear);
    return t.weekday + ', ' + t.month + ' ' + t.day + ', ' + t.year;
  }

  /* ---------- article scoring ---------- */

  /* Raw editorial worth of a story before it is placed anywhere. */
  function storyScore(story) {
    return round(story.importance * 0.5 + story.interest * 0.5
      + (story.exclusive ? 12 : 0)
      + (story.photo ? story.photo.quality * 0.15 : 0), 1);
  }

  /* How much a reader group enjoys one story. -100..100 */
  function groupAffinity(story, group) {
    var v = 0;
    if (group.likes.indexOf(story.category) >= 0) v += 55;
    if (group.dislikes.indexOf(story.category) >= 0) v -= 45;
    v += (story.interest - 50) * 0.45;
    v += (story.importance - 50) * 0.2 * (group.seriousness || 1);
    if (story.photo && story.photo.quality >= 70) v += 8;
    if (group.trustSensitive && story.truth < 55) v -= (55 - story.truth) * 0.9;
    return clamp(v, -100, 100);
  }

  /* Satisfaction of one group with the whole edition. 0..100 */
  function groupSatisfaction(placedStories, group, opts) {
    opts = opts || {};
    if (!placedStories.length) return 5;
    var weights = placedStories.map(function (p) { return p.slotWeight || 1; });
    var total = sum(weights) || 1;
    var score = 0;
    for (var i = 0; i < placedStories.length; i++) {
      score += groupAffinity(placedStories[i].story, group) * weights[i];
    }
    score = score / total;                       // -100..100
    var sat = 50 + score * 0.5;                  // 0..100
    sat -= (opts.adLoad || 0) * 22;              // ads annoy everyone
    /* Unfilled slots are the loudest signal a reader gets that the paper was
     * thrown together. Without this term an editor can print one story, leave
     * ten holes, and readers shrug — which kills the "limited space" fantasy
     * the whole game is built on. */
    sat -= (opts.emptyRatio || 0) * 34;
    sat += (opts.varietyBonus || 0) * 0.15;
    return clamp(round(sat, 1), 0, 100);
  }

  /* ---------- layout ---------- */

  /* Does a story sit well in this slot? 0..100 */
  function slotFit(story, slot) {
    var fit = 55;
    if (slot.wants && slot.wants.length) {
      fit += slot.wants.indexOf(story.category) >= 0 ? 25 : -18;
    }
    if (slot.size) {
      var lengths = { short: 1, medium: 2, long: 3 };
      var diff = Math.abs((lengths[story.length] || 2) - (lengths[slot.size] || 2));
      fit -= diff * 14;
    }
    if (slot.role === 'lead') {
      fit += (story.importance - 55) * 0.35 + (story.interest - 55) * 0.25;
      if (story.exclusive) fit += 12;
    }
    if (slot.role === 'photo' && story.photo) fit += (story.photo.quality - 50) * 0.4;
    if (slot.role === 'photo' && !story.photo) fit -= 30;
    return clamp(round(fit, 1), 0, 100);
  }

  /* Whole-edition layout score: fit + fill + balance. 0..100 */
  function layoutScore(placements, slots) {
    if (!slots.length) return 0;
    var filled = placements.filter(function (p) { return !!p.story; });
    var fillRatio = filled.length / slots.length;
    var fitAvg = filled.length ? avg(filled, function (p) { return slotFit(p.story, p.slot); }) : 0;
    var pages = {};
    filled.forEach(function (p) { pages[p.slot.page] = (pages[p.slot.page] || 0) + 1; });
    var pageCounts = Object.keys(pages).map(function (k) { return pages[k]; });
    var spread = pageCounts.length ? 1 - (stdev(pageCounts) / (avg(pageCounts) || 1)) : 0;
    return clamp(round(fitAvg * 0.6 + fillRatio * 100 * 0.3 + clamp(spread, 0, 1) * 100 * 0.1, 1), 0, 100);
  }

  function stdev(arr) {
    if (arr.length < 2) return 0;
    var m = avg(arr);
    return Math.sqrt(avg(arr, function (v) { return (v - m) * (v - m); }));
  }

  /* How many distinct categories made it in. 0..100 */
  function varietyScore(stories) {
    if (!stories.length) return 0;
    var seen = {};
    stories.forEach(function (s) { seen[s.category] = 1; });
    var distinct = Object.keys(seen).length;
    return clamp(round((distinct / Math.min(stories.length, 8)) * 100, 1), 0, 100);
  }

  /* ---------- headline ---------- */

  /* Headline strength blends the writer's craft with how well the chosen
   * tone suits the story. Sensational tone on a tragedy costs trust. */
  function headlineScore(story, style, staffCreativity) {
    if (!story || !style) return 0;
    var base = 45 + (staffCreativity || 40) * 0.35;
    base += style.punch * 0.3;
    var suits = style.suits.indexOf(story.category) >= 0;
    base += suits ? 14 : -6;
    base += (story.interest - 50) * 0.12;
    return clamp(round(base, 1), 0, 100);
  }

  /* ---------- quality ---------- */

  /* THE formula. Every printed edition goes through exactly this.
   * Weights sum to 1.0 before penalties so `quality` stays 0..100. */
  function editionQuality(parts) {
    var q =
      (parts.articleQuality || 0) * 0.30 +
      (parts.layout || 0) * 0.22 +
      (parts.headline || 0) * 0.20 +
      (parts.variety || 0) * 0.13 +
      (parts.photo || 0) * 0.15;
    q -= (parts.typos || 0) * 2.5;
    q -= (parts.lateArticles || 0) * 4;
    q -= (parts.emptySlots || 0) * 3.5;
    q += (parts.paperBonus || 0);
    return clamp(round(q, 1), 0, 100);
  }

  /* Typos are a fact of the newsroom: fewer with a proofreader on staff. */
  function expectedTypos(storyCount, accuracy, r) {
    var chance = clamp(0.42 - (accuracy / 100) * 0.4, 0.02, 0.5);
    var n = 0;
    for (var i = 0; i < storyCount; i++) if (r.chance(chance)) n++;
    return n;
  }

  /* ---------- economy ---------- */

  /* Copies sold today. Circulation has momentum — a single bad day dents
   * it, it does not erase it. */
  /* Reference price the elasticity curve is centred on. Change this and every
   * balance test that pins a price will move with it. */
  var REFERENCE_PRICE = 0.65;

  /* How much demand a price changes. Returns a multiplier around 1.0.
   * `sensitivity` is per reader group (students flee, business shrugs). */
  function priceDemand(coverPrice, sensitivity) {
    var delta = (coverPrice === undefined ? REFERENCE_PRICE : coverPrice) - REFERENCE_PRICE;
    return clamp(1 - delta * 1.15 * (sensitivity === undefined ? 1 : sensitivity), 0.20, 1.30);
  }

  /* THE ceiling. A city of 46,000 cannot buy 500,000 papers. Without this the
   * reader-growth loop compounds without bound: a 500-day simulation reached
   * a circulation of 541 billion. Everything downstream (ad rates, awards,
   * market share) reads circulation, so an uncapped figure breaks all of it. */
  function circulationCeiling(population, reputationAvg) {
    return Math.max(300, Math.round(population * (0.16 + clamp(reputationAvg, 0, 100) / 640)));
  }

  function copiesSold(prev) {
    var quality = prev.quality, satisfaction = prev.satisfaction;
    var pull = (quality - 45) * 0.011 + (satisfaction - 45) * 0.009;
    var trend = clamp(1 + pull, 0.72, 1.34);
    var base = prev.circulation * trend;
    /* THE fix for the free-money slider: price must move demand, or $1.25 is
     * strictly better than $0.45 and the control is decoration. */
    base *= priceDemand(prev.coverPrice, prev.priceSensitivity);
    base *= 1 + (prev.reputationAvg - 50) / 340;
    base *= 1 + (prev.cityPopulation - 20000) / 900000;
    if (prev.frontPageExclusive) base *= 1.13;
    if (prev.breakingCovered) base *= 1.09;
    base *= clamp(1 - (prev.rivalPressure || 0) * 0.09, 0.7, 1);
    base += prev.subscribers * 0.12;
    var ceiling = circulationCeiling(prev.cityPopulation || 46000, prev.reputationAvg || 50);
    return clamp(Math.round(base), 120, ceiling);
  }

  /* Newsstands and couriers keep a cut of every cover price. Without this the
   * paper is a money printer: circulation x price dwarfs every cost in the
   * game and no editorial decision has a downside. */
  var DISTRIBUTION_CUT = 0.45;
  function salesRevenue(copies, coverPrice) {
    return round(copies * coverPrice * (1 - DISTRIBUTION_CUT), 2);
  }

  /* Advertisers pay for reach and for a paper whose readers match them. */
  function adRevenue(placedAds, circulation, identityTags) {
    return round(sum(placedAds, function (ad) {
      var reach = clamp(circulation / 3000, 0.35, 3.2);
      var match = 1 + ((identityTags && identityTags[ad.wants]) ? 0.28 : 0);
      return ad.rate * reach * match;
    }), 2);
  }

  function dailyExpenses(opts) {
    var payroll = sum(opts.staff || [], function (s) { return s.salary; });
    /* paperCost is per copy PER PAGE, so a 24-page run genuinely hurts. */
    var paper = opts.pageCount * opts.paperCost * opts.printRun;
    var overhead = opts.overhead || 0;
    return round(payroll + paper + overhead, 2);
  }

  /* ---------- staff energy ----------
   * Energy must be able to RECOVER or every newsroom empties itself. A bigger
   * paper and more open investigations drain faster; a fuller staff and a
   * quiet day let people catch up. Found by a 500-day simulation in which
   * every member of staff had resigned by day 40. */
  function energyChange(person, load) {
    var drain = 3 + (load.pages || 8) * 0.28 + (load.investigations || 0) * 1.6;
    drain /= Math.max(1, load.staffCount || 1) * 0.55;
    var recovery = 5 + (load.coffee ? 3 : 0) + (load.plants ? 1.5 : 0);
    if (load.restDay) recovery += 9;
    return round(recovery - drain, 2);
  }

  /* Somebody only burns out after sustained overwork, not one hard week. */
  function burnoutRisk(person) {
    if (person.energy > 30) return 0;
    return round(clamp((30 - person.energy) / 140, 0, 0.16), 3);
  }

  /* ---------- reputation ---------- */

  /* Reputation moves slowly and asymmetrically: trust is lost faster than
   * it is earned, which is the whole moral of the game. */
  function reputationDelta(edition) {
    var d = { truth: 0, entertainment: 0, professionalism: 0, localTrust: 0, investigation: 0, humor: 0 };
    var stories = edition.stories || [];
    if (!stories.length) return d;
    var truthAvg = avg(stories, function (s) { return s.truth; });
    d.truth = round((truthAvg - 62) * 0.09, 2);
    if (truthAvg < 50) d.truth *= 1.8;
    d.entertainment = round((avg(stories, function (s) { return s.interest; }) - 55) * 0.06, 2);
    d.professionalism = round(((edition.quality - 55) * 0.05) - (edition.typos * 0.5), 2);
    var localCount = stories.filter(function (s) { return s.local; }).length;
    d.localTrust = round((localCount / stories.length - 0.35) * 6, 2);
    d.investigation = round((edition.investigationPublished ? 4.5 : -0.15), 2);
    d.humor = round((stories.filter(function (s) { return s.category === 'Comic' || s.tone === 'funny'; }).length * 1.4) - 0.2, 2);
    return d;
  }

  function applyReputation(rep, delta) {
    var out = {};
    Object.keys(rep).forEach(function (k) {

<script>
/* ===========================================================================
 * app_core.js — the App object itself: boot screen, starting a paper,
 * save/load, screen routing, shared DOM + sprite helpers, and the morning
 * story generator that every other screen depends on.
 * ======================================================================== */
var App = (function () {
  'use strict';

  var App = {};
  App.VERSION = 8;
  App.SAVE_KEY = 'frontpage.save.v8';
  App.state = null;
  App.screens = {};        /* filled in by app_office / app_desk / app_extras */
  App.current = null;

  /* ---------- storage adapter ----------
   * INVARIANT: nothing in the game touches localStorage directly. Sandboxed
   * frames throw on access, so every read/write goes through here and falls
   * back to an in-memory map. The game must stay playable without storage. */
  var memoryStore = {};
  App.storage = {
    available: (function () {
      try { window.localStorage.setItem('__fp', '1'); window.localStorage.removeItem('__fp'); return true; }
      catch (e) { return false; }
    })(),
    get: function (k) {
      try { return App.storage.available ? window.localStorage.getItem(k) : (memoryStore[k] || null); }
      catch (e) { return memoryStore[k] || null; }
    },
    set: function (k, v) {
      try { if (App.storage.available) window.localStorage.setItem(k, v); else memoryStore[k] = v; }
      catch (e) { memoryStore[k] = v; }
    },
    remove: function (k) {
      try { if (App.storage.available) window.localStorage.removeItem(k); delete memoryStore[k]; }
      catch (e) { delete memoryStore[k]; }
    }
  };

  /* ---------- tiny DOM helper ---------- */
  function h(tag, props, children) {
    var parts = tag.split('.');
    var el = document.createElement(parts[0] || 'div');
    if (parts.length > 1) el.className = parts.slice(1).join(' ');
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = (el.className ? el.className + ' ' : '') + v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
    return el;
  }
  App.h = h;

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  App.clear = clear;

  /* ---------- pixel sprite renderer ----------
   * Draws a Data.SPRITES map as an inline SVG of 1x1 rects. Cheap, crisp at
   * any scale, and no image assets to ship. */
  App.sprite = function (name, px, opts) {
    opts = opts || {};
    var map = Data.SPRITES[name];
    var size = 16;
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('width', (px || 16) * 1);
    svg.setAttribute('height', (px || 16) * 1);
    svg.setAttribute('class', 'sprite' + (opts.class ? ' ' + opts.class : ''));
    svg.setAttribute('aria-hidden', 'true');
    if (!map) return svg;
    for (var y = 0; y < map.length; y++) {
      for (var x = 0; x < map[y].length; x++) {
        var ch = map[y][x];
        if (ch === '.') continue;
        var color = Data.PALETTE[ch];
        if (!color) continue;
        var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', 1); rect.setAttribute('height', 1);
        rect.setAttribute('fill', color);
        svg.appendChild(rect);
      }
    }
    return svg;
  };

  /* ---------- formatting ---------- */
  App.money = function (n) {
    var neg = n < 0;

   * otherwise a reload replays the same "random" day forever. */
  App.roll = function (fn) {
    var r = Engine.rng(App.state.rngCursor);
    var out = fn(r);
    App.state.rngCursor = r.cursor >>> 0;
    return out;
  };

  /* ---------- routing ---------- */
  App.go = function (name, params) {

     * awards are waiting. Both are one-time, both must not be skippable by
     * clicking a tab. */
    if (App.state) {

      else if (App.state.pendingCeremony && name !== 'ceremony' && name !== 'boot') name = 'ceremony';
      if (App.applyTheme) App.applyTheme();
    }

    if (!screen) { console.error('[app] unknown screen: ' + name); return; }

    var root = document.getElementById('app');
    clear(root);
    root.setAttribute('data-screen', name);
    root.appendChild(screen.render(params || {}));
    window.scrollTo(0, 0);
    document.body.setAttribute('data-screen', name);

      tagCounts: {},
      identity: { name: 'The New Paper', tag: null, share: 0 },
      staff: [],
      upgrades: [],

      rivals: [],

      letters: [],
      investigations: [],
      archive: [],
      lastEdition: null,

      scenario: 'standard',

        threadsFollowed: 0, threadsDropped: 0, weatherRight: 0, weatherWrong: 0
      },

      awardsWon: [],           /* {year, awardId, name} */
      lastCeremonyYear: 0,

      wireService: false,

      threads: [],             /* {id,name,category,step,lastCoveredDay,status} */
      coveredThreads: [],      /* thread ids this paper has run at least once */
      corrections: [],         /* owed tomorrow, from Engine.correctionsOwed */
      adRelations: {},         /* clientId -> {loyalty, cooldownUntil} */
      paperShock: null,        /* {id,multiplier,untilDay} */
      editorialStances: {},    /* axis -> net support (-n..+n) */
      inserts: [],             /* insert ids running in tonight's paper */

      scoopRace: null,         /* {investigationId, rivalId, deadlineDay} */
      heatMap: {},             /* page number -> rolling attention 0..1 */
      subscriptionSpend: 0,

      generation: 1,

      subjects: [],            /* consequence people: {name,role,day,harm,storyTitle,resolved} */
      rivalEditors: {},        /* rivalId -> {reaction, day} */
      satisfactionHistory: [], /* rolling, for Engine.perceivedTrust */
      profitHistory: [],       /* rolling, for union demands */
      adContracts: {},         /* clientId -> {type, untilDay, rate} */
      blocMood: {},            /* blocId -> 0..100 */
      classifieds: 0,          /* steady unglamorous revenue floor */
      typography: {},          /* slotId -> {size, leading} */
      redesign: 'trad',
      era: 'offset',
      election: null,          /* {day, candidates, coverage, result} */
      obituaries: [],

  App.gen = {};

  App.gen.photo = function (r, cameraTier, hasPhotographer) {
    var kinds = Data.PHOTO_KINDS;
    var pick = r.weighted(kinds, function (k) {
      var w = k.weight;
      if (hasPhotographer && k.quality >= 50) w *= 1.9;
      if (cameraTier >= 2 && k.quality >= 50) w *= 1.5;
      if (cameraTier >= 3 && k.quality >= 80) w *= 2.2;
      if (k.id === 'none') w *= hasPhotographer ? 0.45 : 1;
      return w;
    });
    if (pick.id === 'none') return null;
    var jitter = r.int(-6, 6);
    return { kind: pick.id, label: pick.label, quality: Engine.clamp(pick.quality + jitter, 5, 100) };

      importance: r.int(12, 34), interest: r.int(12, 38), truth: r.int(30, 55),
      length: 'short', urgency: 20, exclusive: false,
      pressRelease: true, photo: null, source: 'Press release'
    };
  };

  /* A freelance story you can buy outright, priced above its worth. */
  App.gen.stringerOffer = function (r, state) {
    var story = App.gen.story(r, { n: 900, cameraTier: App.tierOf('camera'), hasPhotographer: true });
    story.id = 'str-' + story.id;
    story.source = 'Freelance';
    story.stringer = true;
    story.price = Math.round(Engine.storyScore(story) * Data.STRINGER_MARKUP);
    return story;
  };

  /* An anniversary piece built from your OWN back issues. This is the archive
   * paying rent instead of being a scrapbook. */
  App.gen.anniversaryStory = function (r, state) {
    var hits = Engine.anniversaries(state.archive, state.day,
      Engine.DAYS_PER_MONTH * Engine.MONTHS_PER_YEAR);
    if (!hits.length) return null;
    var pick = hits[0];
    var ed = pick.edition;
    return {
      id: 'anniv-' + ed.day,
      title: pick.years + ' Years Since ' + (ed.leadTitle || ed.headlineText),
      category: ed.leadCategory || 'Community',
      section: Data.SECTION_OF[ed.leadCategory] || 'Local',
      local: true,
      importance: Engine.clamp(38 + pick.years * 4, 0, 82),
      interest: Engine.clamp(52 + pick.years * 3, 0, 92),
      truth: 95,
      length: 'medium', urgency: 30, exclusive: false,
      anniversary: { years: pick.years, day: ed.day, headline: ed.headlineText },
      photo: App.gen.photo(r, App.tierOf('camera'), true),
      source: 'Our archive'
    };
  };

  /* A source hands you something before the rivals get it — if trust is high. */
  App.gen.sourceStory = function (r, state) {
    var candidates = Data.SOURCES.filter(function (src) {
      return (state.sources[src.id] || 0) >= 55;
    });
    if (!candidates.length) return null;
    var src = r.weighted(candidates, function (c) { return state.sources[c.id]; });
    if (!r.chance(Engine.clamp((state.sources[src.id] - 45) / 130, 0, 0.55))) return null;
    var cat = r.pick(src.feeds);
    var tpls = Data.STORY_TEMPLATES.filter(function (t) { return t.cat === cat; });
    var tpl = tpls.length ? r.pick(tpls) : r.pick(Data.STORY_TEMPLATES);
    return {
      id: 'src-' + src.id + '-' + state.day,
      title: Data.fillTemplate(r.pick(tpl.t), r),
      category: cat, section: Data.SECTION_OF[cat] || 'News', local: true,
      importance: Engine.clamp(r.int(tpl.imp[0], tpl.imp[1]) + 10, 0, 100),
      interest: Engine.clamp(r.int(tpl.int[0], tpl.int[1]) + 8, 0, 100),
      truth: Engine.clamp(r.int(tpl.truth[0], tpl.truth[1]) + 8, 0, 100),
      length: 'medium', urgency: 80, exclusive: true,
      sourceId: src.id,
      photo: App.gen.photo(r, App.tierOf('camera'), true),
      source: src.name
    };
  };

  /* Advance the running sagas. Threads open, step forward and close. */
  App.gen.tickThreads = function (r, state) {
    var out = [];
    state.threads.forEach(function (t) {
      if (t.status !== 'open') return;
      var def = Data.THREADS.filter(function (d) { return d.id === t.id; })[0];
      if (!def) { t.status = 'closed'; return; }
      t.stepTitles = def.steps;
      if (t.step >= def.steps.length) { t.status = 'closed'; return; }
      out.push(App.gen.threadStory(r, t, state));
    });
    /* Open a new saga now and then, but never more than two at once. */
    var open = state.threads.filter(function (t) { return t.status === 'open'; });
    if (open.length < 2 && state.day > 4 && r.chance(0.22)) {
      var unused = Data.THREADS.filter(function (d) {
        return !state.threads.some(function (t) { return t.id === d.id; });
      });
      if (unused.length) {
        var def2 = r.pick(unused);
        var t2 = {
          id: def2.id, name: def2.name, category: def2.category,
          step: 0, stepTitles: def2.steps, lastCoveredDay: 0, status: 'open'
        };
        state.threads.push(t2);
        out.push(App.gen.threadStory(r, t2, state));
      }
    }
    return out;
  };


  /* ---------- v7 generators ---------- */

  /* Whistleblower stories are worth a lot and cost a source if you name them. */
  App.gen.whistleblower = function (r, state) {
    if (state.day < 8 || !r.chance(0.12)) return null;
    var cat = r.pick(['Politics', 'Business', 'Health', 'Environment']);
    var tpls = Data.STORY_TEMPLATES.filter(function (t) { return t.cat === cat; });
    var tpl = tpls.length ? r.pick(tpls) : Data.STORY_TEMPLATES[0];
    return {
      id: 'wb-' + state.day,
      title: Data.fillTemplate(r.pick(tpl.t), r),
      category: cat, section: Data.SECTION_OF[cat] || 'News', local: true,
      importance: r.int(78, 96), interest: r.int(60, 88), truth: r.int(62, 92),
      length: 'long', urgency: 85, exclusive: true,
      whistleblower: { who: r.pick(Data.WHISTLEBLOWER_NAMES), protected: true },
      photo: null, source: 'Confidential source'
    };
  };

  /* An embargoed story: print early for the scoop, lose the source for good. */
  App.gen.embargoed = function (r, state) {
    if (state.day < 6 || !r.chance(0.14)) return null;
    var story = App.gen.story(r, { n: 800, cameraTier: App.tierOf('camera') });
    story.id = 'emb-' + state.day;
    story.embargo = { untilDay: state.day + r.int(1, 3), line: r.pick(Data.EMBARGO_LINES) };
    story.importance = Engine.clamp(story.importance + 14, 0, 100);
    story.source = 'Under embargo';
    return story;
  };

  /* A rival occasionally prints one of your exclusives because somebody talked. */
  App.gen.poachedExclusive = function (r, state) {
    if (!state.today || !r.chance(0.1)) return null;
    var mine = (state.today.stories || []).filter(function (st) { return st.exclusive; });
    if (!mine.length || !state.rivals || !state.rivals.length) return null;
    var story = r.pick(mine);
    var rival = r.pick(state.rivals);
    return { storyId: story.id, title: story.title, rival: rival.name };
  };

  /* The recurring cast: the same names across decades, one arc step at a time. */
  App.gen.figureStory = function (r, state) {
    if (state.day < 12 || !r.chance(0.16)) return null;
    var fig = r.pick(Data.FIGURES);
    var step = state.figures[fig.id] || 0;
    if (step >= fig.arc.length) return null;
    state.figures[fig.id] = step + 1;
    var cat = fig.role === 'striker' ? 'Sports' : (fig.role === 'developer' ? 'Business' : 'Politics');
    return {
      id: 'fig-' + fig.id + '-' + step,
      title: fig.name + ' ' + fig.arc[step],
      category: cat, section: Data.SECTION_OF[cat] || 'News', local: true,
      importance: Engine.clamp(48 + step * 7 + r.int(-6, 8), 0, 100),
      interest: Engine.clamp(52 + step * 5 + r.int(-6, 10), 0, 100),
      truth: r.int(70, 95), length: 'medium', urgency: 55, exclusive: false,
      figureId: fig.id, figureStep: step,
      photo: App.gen.photo(r, App.tierOf('camera'), true),
      source: 'City desk'
    };
  };

  /* Cascading events: today's disaster seeds next season's corruption story. */
  App.gen.tickCascades = function (state) {
    var due = state.cascadePending.filter(function (c) { return c.day <= state.day; });
    state.cascadePending = state.cascadePending.filter(function (c) { return c.day > state.day; });
    return due.length ? due[0] : null;
  };
  App.gen.seedCascade = function (state, fromEventId) {
    Data.CASCADES.filter(function (c) { return c.from === fromEventId; }).forEach(function (c) {
      if (state.cascadePending.some(function (p) { return p.id === c.to; })) return;
      state.cascadePending.push({ id: c.to, name: c.name, boosts: c.boosts, blurb: c.blurb, day: state.day + c.delay });
    });
  };


  /* ---------- v8 generators ---------- */

  /* About one story in five is about a named person who will still be there
   * in a month. This is what makes accuracy cost something. */
  App.gen.attachSubject = function (r, story) {
    if (story.correction || story.letter || story.wire || story.pressRelease) return story;
    if (!r.chance(0.2)) return story;
    story.subject = {
      name: r.pick(Data.SUBJECT_FIRST) + ' ' + r.pick(Data.SUBJECT_LAST),
      role: r.pick(Data.SUBJECT_ROLES)
    };
    return story;
  };

  /* A subject you wronged comes back: a letter, a claim, or an obituary. */
  App.gen.subjectReturns = function (r, state) {
    var out = [];
    state.subjects.forEach(function (sub) {
      if (sub.resolved) return;
      var kind = Engine.subjectReturn(sub, state.day);
      if (!kind) return;
      sub.resolved = kind;
      var line = Data.SUBJECT_RETURNS[kind]
        .replace('{name}', sub.name).replace('{role}', sub.role).replace('{age}', String(r.int(64, 94)));
      if (kind === 'lawsuit') {
        state.lawsuits.push({
          id: 'law-sub-' + state.day + '-' + out.length, title: sub.storyTitle,
          claim: 1200 + Math.round(sub.harm * 3600), evidence: Math.round(sub.truth || 60),
          day: state.day, status: 'open', subject: sub.name
        });
        App.toast(line, 'bad');
      } else if (kind === 'letter') {
        state.letters.push({ id: 'lsub-' + state.day + '-' + out.length, kind: 'complaint', text: line, day: state.day, handled: false });
      } else if (kind === 'obituary') {
        state.obituaries.push({ name: sub.name, role: sub.role, day: state.day, line: r.pick(Data.OBITUARY_LINES) });
      }
      out.push({ kind: kind, line: line });
    });
    return out;
  };

  /* Obituaries are a slot type with real weight: quiet, local, and trusted. */
  App.gen.obituaryStory = function (state) {
    var ob = state.obituaries.filter(function (o) { return !o.printed; })[0];
    if (!ob) return null;
    return {
      id: 'obit-' + ob.day + '-' + ob.name.replace(/\W/g, ''),
      title: ob.name + ', ' + ob.role,
      body: ob.name + ' ' + ob.line + '. They are survived by a street that noticed.',
      category: 'Community', section: 'Local', local: true,
      importance: 30, interest: 46, truth: 98, length: 'short', urgency: 40,
      exclusive: false, obituary: ob, photo: null, source: 'Obituaries'
    };
  };

  /* Classified advertising: small, steady, and the first thing the web takes. */
  App.gen.classifieds = function (r, state) {
    var era = Engine.eraFor(Engine.dateFromDay(state.day, state.startYear).year, Data.ERAS);
    var lines = [];
    var n = r.int(2, 5);
    for (var i = 0; i < n; i++) lines.push(r.pick(Data.CLASSIFIED_LINES));
    /* Classified revenue must scale with readership. As a flat floor it
     * propped up a deliberately terrible paper into profit and removed the
     * punishment for bad editing — nobody places a small ad in a paper
     * nobody reads. */
    var reach = Engine.clamp((state.circulation || 1400) / 2500, 0.25, 2.5);
    var rate = 26 * (era.adPressure === undefined ? 1 : era.adPressure) * reach;
    return { lines: lines, revenue: Engine.round(n * rate, 2) };
  };

  /* A local election you cover, whose result your coverage moves. */
  App.gen.maybeElection = function (state) {
    var t = Engine.dateFromDay(state.day, state.startYear);
    if (state.election && state.election.resultDay > state.day) return state.election;
    if (state.election && state.election.result) return state.election;
    if (t.monthIndex !== 10 || t.day !== 1) return state.election;
    state.election = {
      startDay: state.day, resultDay: state.day + 20,
      candidates: Data.CANDIDATES.map(function (c) { return c; }),
      coverage: {}, result: null
    };
    return state.election;
  };

  /* Build today's newsroom. Called exactly once per game day. */
  App.gen.day = function () {
    var s = App.state;
    var event = App.gen.cityEvent(s);
    s.city.event = event;
    var reporters = s.staff.filter(function (st) { return st.role === 'reporter'; });
    var hasPhotographer = s.staff.some(function (st) { return st.role === 'photographer'; });
    var cameraTier = App.tierOf('camera');
    var count = Engine.clamp(9 + reporters.length * 3 + Math.floor(s.day / 12), 9, 26);
    /* Specialist beats: a reporter put on a beat lifts that category all day. */
    var beats = {};
    reporters.forEach(function (rep) {
      if (rep.beat) beats[rep.beat] = (beats[rep.beat] || 0) + 1;
    });

    App.roll(function (r) {
      var stories = [];
      for (var i = 0; i < count; i++) {
        stories.push(App.gen.story(r, {
          n: i,
          boosts: (event ? event.boosts : []).concat(s.regionBoosts || []),
          cameraTier: cameraTier,
          hasPhotographer: hasPhotographer,
          exclusiveChance: 0.04 + reporters.length * 0.03,
          byline: reporters.length ? r.pick(reporters).name : null,
          beats: beats
        }));
      }
      var breaking = null;
      if (s.day > 2 && r.chance(0.22)) {
        var b = r.pick(Data.BREAKING);
        breaking = {
          id: 'brk-' + s.day, title: b.headline, category: b.cat,
          section: Data.SECTION_OF[b.cat] || 'News', local: true,
          importance: b.imp, interest: b.int, truth: b.truth,
          length: 'long', urgency: 100, exclusive: false, breaking: true,
          photo: App.gen.photo(r, cameraTier, hasPhotographer),
          source: 'Newsdesk'
        };
      }
      var rumour = null;
      if (s.day > 3 && s.investigations.filter(function (i) { return i.status === 'open'; }).length < 2 && r.chance(0.3)) {
        var rm = r.pick(Data.RUMOURS);
        rumour = {
          id: 'inv-' + s.day, title: rm.title, category: rm.cat,
          credibility: Engine.clamp(rm.credibility + r.int(-12, 12), 5, 95),
          shown: rm.credibility >= 65 ? 'sounds solid' : (rm.credibility >= 45 ? 'hard to say' : 'probably nonsense'),
          reward: rm.reward, evidence: 0, days: 0, assigned: [], status: 'offered'
        };
      }
      /* Threads, wire, releases, archive and sources all feed the same spike.
       * Order matters only for presentation: running stories sit on top. */
      var threadStories = App.gen.tickThreads(r, s);
      var extras = [];
      if (s.wireService) {
        for (var w = 0; w < Data.WIRE_SERVICE.perDay; w++) extras.push(App.gen.wireStory(r, w));
      }
      var prCount = r.int(1, 2);
      for (var pr = 0; pr < prCount; pr++) extras.push(App.gen.pressRelease(r, pr));
      var anniv = App.gen.anniversaryStory(r, s);
      if (anniv) extras.push(anniv);
      var srcStory = App.gen.sourceStory(r, s);
      if (srcStory) extras.push(srcStory);
      var wb = App.gen.whistleblower(r, s);
      if (wb) extras.push(wb);
      var emb = App.gen.embargoed(r, s);
      if (emb) extras.push(emb);
      var fig = App.gen.figureStory(r, s);
      if (fig) extras.push(fig);
      var obit = App.gen.obituaryStory(s);
      if (obit) extras.push(obit);
      App.gen.subjectReturns(r, s);
      App.gen.maybeElection(s);

      /* Stories you passed on can come back bigger, with a pointed reminder. */
      var returning = [];
      s.passedOn = (s.passedOn || []).filter(function (p) {
        if (s.day - p.day < 3) return true;
        if (r.chance(0.3)) {
          p.story.importance = Engine.clamp(p.story.importance + 18, 0, 100);
          p.story.interest = Engine.clamp(p.story.interest + 14, 0, 100);
          p.story.returned = true;
          p.story.id = p.story.id + '-r';
          returning.push(p.story);
          return false;
        }
        return s.day - p.day < 14;
      });

      stories = threadStories.concat(returning, extras, stories);
      stories.forEach(function (st) { App.gen.attachSubject(r, st); });
      /* The era shapes what the newsroom can do and what advertising is worth. */
      s.era = Engine.eraFor(Engine.dateFromDay(s.day, s.startYear).year, Data.ERAS).id;

      /* Slow news day: everything is weak and you must pad. */
      var slowDay = r.chance(0.1) && s.day > 5;
      if (slowDay) {
        stories.forEach(function (st) {
          if (st.threadId || st.investigationId) return;
          st.importance = Engine.clamp(st.importance - 26, 3, 100);
          st.interest = Engine.clamp(st.interest - 20, 3, 100);
        });
      }

      var forecast = r.pick(Data.WEATHER_KINDS);
      /* A cascade that has come due replaces today's calendar event. */
      var cascade = App.gen.tickCascades(s);
      if (cascade) {
        s.city.event = { id: cascade.id, name: cascade.name, boosts: cascade.boosts, blurb: cascade.blurb };
      } else if (event) {
        App.gen.seedCascade(s, event.id);
      }
      var poached = App.gen.poachedExclusive(r, s);

      s.today = {
        stories: stories,
        slowDay: slowDay,
        forecast: forecast,
        horoscope: r.pick(Data.HOROSCOPES),
        stringer: (s.day > 3 && r.chance(0.35)) ? App.gen.stringerOffer(r, s) : null,
        editorial: r.shuffle(Data.EDITORIAL_TOPICS).slice(0, 1)[0],
        editorialDone: false,
        corrections: (s.corrections || []).slice(),
        correctionsPrinted: 0,
        spikeOffer: null,
        adFallout: null,
        printRun: null,
        pressFailure: null,
        poached: poached,
        classifieds: App.gen.classifieds(r, s),
        interview: null,
        ledger: null,
        ads: App.gen.ads(r, s),
        assignments: {},
        headline: null,
        headlineStyle: null,
        breaking: breaking,
        breakingOffered: false,
        rumour: rumour,
        weather: forecast.line,
        rivals: App.gen.rivalDay(r, s),
        phase: 'select',
        published: false
      };
    });
    return s.today;
  };

  /* ---------- derived lookups used everywhere ---------- */
  App.tierOf = function (group) {
    var best = 1;
    App.state.upgrades.forEach(function (id) {
      var up = Data.UPGRADES.filter(function (u) { return u.id === id; })[0];
      if (up && up.group === group && up.tier > best) best = up.tier;
    });
    return best;
  };
  App.hasUpgrade = function (id) { return App.state.upgrades.indexOf(id) >= 0; };
  App.stock = function () {
    return Data.PAPER_STOCKS.filter(function (p) { return p.id === App.state.paperStock; })[0] || Data.PAPER_STOCKS[1];
  };
  App.officeTier = function () {
    return Data.OFFICE_TIERS.filter(function (t) { return t.id === App.state.officeTier; })[0] || Data.OFFICE_TIERS[0];
  };
  App.slots = function () { return Data.slotsForPageCount(App.state.pageCount); };
  /* Paper cost per copy per page, including any active newsprint shock.
   * INVARIANT: every expense calculation must go through this, not
   * App.stock().cost, or price shocks silently do nothing. */
  App.paperCost = function () {
    var base = App.stock().cost;
    var shock = App.state.paperShock;
    /* Owning the print works makes every page cheaper, for ever. */
    var works = (App.state.properties || []).indexOf('works') >= 0
      ? (Data.PROPERTIES.filter(function (p) { return p.id === 'works'; })[0].paperDiscount || 0) : 0;
    var era = Data.ERAS.filter(function (e) { return e.id === App.state.era; })[0];
    return Engine.round(base * (shock ? shock.multiplier : 1) * (1 - works)
      * (era ? era.paperMult : 1), 5);
  };
  App.mastheadCss = function () {
    var m = Data.MASTHEAD_STYLES.filter(function (x) { return x.id === App.state.masthead; })[0];
    return m ? m.css : '';
  };

  /* ---------- sound ----------
   * Synthesised on the fly with WebAudio; no audio files ship. Fails silently
   * where AudioContext is unavailable (which includes most headless tests). */
  var audioCtx = null;
  App.sound = function (name) {
    if (!App.state || !App.state.sound) return;
    var def = Data.SOUNDS[name];
    if (!def) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = audioCtx || new Ctx();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = def.type;
      osc.frequency.value = def.freq;
      gain.gain.value = def.gain;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + def.dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + def.dur);
    } catch (e) { /* sound is never load-bearing */ }
  };

  App.theme = function () {
    return Data.THEMES.filter(function (t) { return t.id === App.state.theme; })[0] || Data.THEMES[0];
  };
  App.storyById = function (id) {
    var t = App.state.today;
    if (!t) return null;
    if (t.breaking && t.breaking.id === id) return t.breaking;
    return t.stories.filter(function (s) { return s.id === id; })[0] || null;
  };
  App.adById = function (id) {
    var t = App.state.today;
    return t ? (t.ads.filter(function (a) { return a.id === id; })[0] || null) : null;
  };
  App.dateLine = function (day) {
    return Engine.formatDate(day === undefined ? App.state.day : day, App.state.startYear);
  };

  /* Staff stat aggregate for a role, 0 when nobody holds it. */
  App.roleStat = function (role, stat) {
    var crew = App.state.staff.filter(function (s) { return s.role === role; });
    if (!crew.length) return 0;
    return Engine.round(Engine.avg(crew, function (s) { return s[stat] * (0.55 + s.energy / 200); }), 1);
  };

  /* =========================================================================
   * SAVE / LOAD
   * ====================================================================== */
  App.save = function (quiet) {
    try {
      App.storage.set(App.SAVE_KEY, JSON.stringify(App.state));
      if (!quiet) App.toast('Saved.');
      return true;
    } catch (e) {
      console.warn('[app] save failed', e);
      if (!quiet) App.toast('Could not save.', 'bad');
      return false;
    }
  };

  App.hasSave = function () { return !!App.storage.get(App.SAVE_KEY); };

  App.load = function () {
    var raw = App.storage.get(App.SAVE_KEY);
    if (!raw) return false;
    try {
      var parsed = JSON.parse(raw);
      if (parsed.version !== App.VERSION) { App.storage.remove(App.SAVE_KEY); return false; }
      App.state = parsed;
      return true;
    } catch (e) {
      console.warn('[app] save was unreadable, starting fresh', e);
      App.storage.remove(App.SAVE_KEY);
      return false;
    }
  };

  App.wipe = function () { App.storage.remove(App.SAVE_KEY); App.state = null; };

  /* =========================================================================
   * NEW GAME
   * ====================================================================== */
  App.startGame = function (paperName, seed, scenarioId, opts) {
    opts = opts || {};
    var s = App.newState(paperName, seed === undefined ? (Date.now() >>> 0) : seed);
    var scen = Data.SCENARIOS.filter(function (x) { return x.id === scenarioId; })[0] || Data.SCENARIOS[0];
    s.scenario = scen.id;
    s.money = scen.money;
    s.circulation = scen.circulation;
    s.city.population = scen.population;
    App.state = s;
    /* Two starting hires so the first day is not lonely. */
    App.roll(function (r) {
      var names = r.shuffle(Data.STAFF_NAMES);
      /* INVARIANT: every staff member carries a non-zero salary. Engine
       * .dailyExpenses sums this field directly, so a zero here is a person
       * who works for nothing forever and quietly breaks the economy. */
      [['reporter', names[0]], ['photographer', names[1]]].forEach(function (pair) {
        var person = App.makeStaff(r, pair[0], pair[1]);
        person.salary = App.salaryFor(person);
        s.staff.push(person);
      });
      Data.READER_GROUPS.forEach(function (g) {
        s.readers[g.id] = { loyalty: 45 + r.int(-6, 6), readers: Math.round(g.base * 0.25) };
      });
      Data.SOURCES.forEach(function (src) { s.sources[src.id] = 35 + r.int(-8, 8); });
      Data.DISTRICTS.forEach(function (dd) {
        s.districts[dd.id] = { loyalty: 42 + r.int(-6, 6), readers: Engine.districtReaders(dd, 42) };
      });
      s.comic.stripId = r.pick(Data.COMIC_STRIPS).id;
      Object.keys(Data.AD_BLOCS).forEach(function (b) { s.blocMood[b] = 50; });
      /* Staff have politics; some of them will resign over an editorial line. */
      s.staff.forEach(function (st) {
        st.politics = { axis: r.pick(['order', 'community', 'business', 'environment', 'labour']), lean: r.chance(0.5) ? 1 : -1 };
      });
      Data.AD_CLIENTS.forEach(function (c) { s.adRelations[c.id] = { loyalty: 50, cooldownUntil: 0 }; });
      /* Rivals now carry persistent standing, so competing is a race rather
       * than one-directional pressure on your circulation. */
      s.rivals = Data.RIVALS.map(function (rv) {
        return {
          id: rv.id, name: rv.name, strength: rv.strength, taste: rv.taste.slice(),
          circulation: Math.round(1600 * rv.strength) + r.int(-200, 200),
          quality: 55 + r.int(-6, 6), reputation: 50, headline: null, leadScore: 0,
          yearEditions: []
        };
      });
    });
    /* Scenario circulation is the target; scale the seeded groups to match it
     * so state.circulation and the reader table never disagree at turn one. */
    var seeded = Engine.sum(Object.keys(s.readers), function (k) { return s.readers[k].readers; }) || 1;
    var scale = s.circulation / seeded;
    Object.keys(s.readers).forEach(function (k) {
      s.readers[k].readers = Math.max(20, Math.round(s.readers[k].readers * scale));
    });
    s.circulation = Engine.sum(Object.keys(s.readers), function (k) { return s.readers[k].readers; });
    /* Region, historical start and difficulty modifiers are applied AFTER the
     * base scenario so they layer on top of it rather than fighting it. */
    var region = Data.REGIONS.filter(function (x) { return x.id === opts.region; })[0];
    if (region) {
      s.region = region.id;
      s.city.population = region.population;
      s.regionBoosts = region.boosts;
    }
    var hist = Data.HISTORICAL.filter(function (x) { return x.id === opts.historical; })[0];
    if (hist) {
      s.startYear = hist.year;
      s.historical = hist.id;
      s.regionBoosts = (s.regionBoosts || []).concat(hist.boosts);
    }
    s.era = Engine.eraFor(s.startYear, Data.ERAS).id;
    (opts.difficulty || []).forEach(function (id) {
      var mod = Data.DIFFICULTY_MODIFIERS.filter(function (x) { return x.id === id; })[0];
      if (mod) { s.difficulty.push(id); mod.apply(s); }
    });
    App.gen.day();
    App.save(true);
  };

  /* One formula, used by starting staff and by everyone who walks in the
   * door, so a hire never costs less than the people already on the books. */
  App.salaryFor = function (person) {
    return Math.round(58 + (person.speed + person.accuracy + person.creativity) / 6);
  };

  App.makeStaff = function (r, role, name) {
    return {
      id: 'st-' + r.int(10000, 99999),
      name: name || r.pick(Data.STAFF_NAMES),
      role: role,
      speed: r.int(35, 80),
      accuracy: r.int(35, 82),
      creativity: r.int(30, 85),
      energy: 100,
      experience: 0,
      specialty: r.pick(Data.SPECIALTIES),
      beat: null,
      salary: 0,
      mood: 'settled'
    };
  };

  /* =========================================================================
   * BOOT SCREEN
   * ====================================================================== */
  App.screens.boot = {
    render: function () {
      var nameInput;
      var wrap = h('div.boot', {}, [
        h('div.boot__masthead', {}, [
          h('div.boot__kicker', { text: 'Est. 1995 · Price 65¢ · Weather: hopeful' }),
          h('h1.boot__title', { text: 'FRONT PAGE' }),
          h('div.boot__rule'),
          h('p.boot__sub', { text: 'You are the editor. Twenty stories arrive. Eleven slots exist. Whatever you print becomes what the city talks about — and, eventually, what the city remembers.' })
        ]),
        h('div.boot__shelf', {}, ['typewriter', 'coffee', 'newspapers', 'plant'].map(function (n) {
          return h('div.boot__prop', {}, [App.sprite(n, 48)]);
        })),
        h('div.boot__panel', {}, [
          h('label.field', {}, [
            h('span.field__label', { text: 'Name your paper' }),
            (nameInput = h('input.field__input', {
              type: 'text', maxlength: '30', 'data-testid': 'paper-name',
              value: '', placeholder: 'The Riverside Herald'
            }))
          ]),
          h('div.press__row', {}, [
            h('span.press__label', { text: 'Where' }),
            h('div.chips', { 'data-testid': 'region-chips' }, Data.REGIONS.map(function (rg) {
              return h('button.chip' + (App.bootRegion === rg.id ? '.chip--on' : ''), {
                'data-testid': 'region-' + rg.id, text: rg.name, title: rg.blurb,
                onclick: function () { App.bootRegion = rg.id; App.go('boot'); }
              });
            }))
          ]),
          h('div.press__row', {}, [
            h('span.press__label', { text: 'Start' }),
            h('div.chips', { 'data-testid': 'start-chips' }, Data.SCENARIOS.map(function (sc) {
              return h('button.chip' + (App.bootScenario === sc.id ? '.chip--on' : ''), {
                'data-testid': 'scenario-' + sc.id, text: sc.name, title: sc.blurb,
                onclick: function () { App.bootScenario = sc.id; App.go('boot'); }
              });
            }).concat(Data.HISTORICAL.map(function (hs) {
              return h('button.chip' + (App.bootHistorical === hs.id ? '.chip--on' : ''), {
                'data-testid': 'historical-' + hs.id, text: hs.name, title: hs.blurb,
                onclick: function () { App.bootHistorical = App.bootHistorical === hs.id ? null : hs.id; App.go('boot'); }
              });
            })))
          ]),
          h('div.press__row', {}, [
