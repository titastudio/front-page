      App.morgueQuery = App.morgueQuery || '';
      var hits = App.hasUpgrade('archive') ? Engine.searchArchive(s.archive, App.morgueQuery) : [];
      var contradictions = Engine.findContradictions(hits);
      var input;

      return h('div.screen', {}, [
        App.topbar('archive'),
        h('div.two', {}, [
          App.panel('The morgue', [
            !App.hasUpgrade('archive')
              ? h('p.daycard__empty', { text: 'Searching the back issues needs the Archive Room. The shop sells one.' })
              : h('div', {}, [
                h('p.panel__note', { text: s.archive.length + ' editions on the shelf. Search by name, subject or category.' }),
                h('div.press__row', {}, [
                  (input = h('input.field__input', {
                    'data-testid': 'morgue-query', type: 'text', value: App.morgueQuery,
                    placeholder: 'Vera Salt, flood, Politics…'
                  })),
                  h('button.btn.btn--small', {
                    'data-testid': 'morgue-search', text: 'Search',
                    onclick: function () { App.morgueQuery = input.value; App.go('morgue'); }
                  })
                ]),
                hits.length
                  ? h('div.volumes', { 'data-testid': 'morgue-hits' }, hits.slice(0, 40).map(function (hit) {
                    return h('div.volume', {}, [
                      h('span.volume__date', { text: hit.edition.dateLine }),
                      h('span.volume__head', { text: hit.edition.headlineText }),
                      h('span.volume__meta', {
                        text: hit.stories.length
                          ? hit.stories.map(function (x) { return x.title; }).join(' · ')
                          : 'front page match'
                      })
                    ]);
                  }))
                  : h('p.daycard__empty', {
                    text: App.morgueQuery ? 'Nothing in the archive matches that.' : 'Type something and search.'
                  })
              ])
          ], { testid: 'panel-morgue', aside: hits.length ? hits.length + ' hits' : '' }),

          h('div', {}, [
            App.panel('Where you contradicted yourself', [
              contradictions.length
                ? h('div', { 'data-testid': 'contradictions' }, contradictions.slice(0, 6).map(function (c) {
                  return h('div.letter.letter--complaint', {}, [
                    h('p.letter__body', {
                      text: 'On ' + c.earlier.dateLine + ' this paper took one line on ' + c.axis
                        + '. On ' + c.later.dateLine + ' it took the opposite one.'
                    })
                  ]);
                }))
                : h('p.daycard__empty', { text: 'No contradictions found — on this search, at least.' })
            ], { testid: 'panel-contradictions' }),
            renderEthics()
          ])
        ])
      ]);
    }
  };

  /* ---------- ethics ledger ----------
   * Never a score. A quiet list of what was traded away. */
  function renderEthics() {
    var s = App.state;
    var ledger = Engine.ethicsLedger(s.stats);
    return App.panel('The ledger nobody sees', [
      ledger.clean
        ? h('p.daycard__empty', { text: 'Nothing to record. That is rarer than you might think.' })
        : h('div', { 'data-testid': 'ethics' }, ledger.entries.filter(function (e) { return e.n > 0; }).map(function (e) {
          return h('div.kv', {}, [
            h('span.kv__k', { text: e.label }),
            h('span.kv__v', { text: String(e.n) })
          ]);
        })),
      h('p.press__cost', { text: 'This is not a score and nobody will ever show it to your readers.' })
    ], { testid: 'panel-ethics' });
  }

  /* =========================================================================
   * INTERVIEW — choose questions. Hostile ones get more and burn the source.
   * ====================================================================== */
  App.startInterview = function (inv) {
    var s = App.state;
    s.today.interview = {
      investigationId: inv.id,
      sourceId: inv.category,
      openness: App.roll(function (r) { return r.int(30, 80); }),
      asked: [], gained: 0, closed: false
    };
    App.go('interview');
  };

  App.screens.interview = {
    render: function () {
      var s = App.state;
      var iv = s.today && s.today.interview;
      if (!iv) { App.go('office'); return h('div'); }
      var inv = s.investigations.filter(function (i) { return i.id === iv.investigationId; })[0];

      return h('div.screen', {}, [
        App.topbar('office'),
        h('div.one', {}, [
          App.panel('The interview', [
            h('p.panel__note', {
              text: inv ? inv.title : 'A conversation' + ' · they are '
                + (iv.openness > 60 ? 'talkative' : (iv.openness > 40 ? 'guarded' : 'hostile'))
            }),
            h('div.grid2', {}, [
              kv('Evidence gained', String(Math.round(iv.gained))),
              kv('Questions asked', String(iv.asked.length))
            ]),
            iv.closed
              ? h('p.inv__warn', { 'data-testid': 'interview-closed', text: 'They have stopped talking. That is the end of it.' })
              : h('div.spike', { 'data-testid': 'questions' }, Data.INTERVIEW_QUESTIONS.map(function (q) {
                var used = iv.asked.indexOf(q.id) >= 0;
                return h('article.card', {}, [
                  h('h3.card__title', { text: q.text }),
                  h('div.card__foot', { text: 'pressure ' + q.pressure }),
                  h('button.chip', {
                    'data-testid': 'ask-' + q.id,
                    disabled: used,
                    text: used ? 'Asked' : 'Ask it',
                    onclick: function () {
                      var out = Engine.interviewOutcome(q, { openness: iv.openness });
                      iv.asked.push(q.id);
                      iv.gained += out.evidence;
                      if (inv) {
                        inv.evidence = Engine.clamp(inv.evidence + out.evidence, 0,
                          Engine.evidenceCeiling(inv.sourceCount || 1));
                      }
                      if (out.trustCost) {
                        Object.keys(s.sources).forEach(function (k) {
                          s.sources[k] = Engine.clamp(s.sources[k] - out.trustCost / 6, 0, 100);
                        });
                      }
                      if (out.closed) iv.closed = true;
                      App.save(true);
                      App.go('interview');
                    }
                  })
                ]);
              })),
            h('button.btn.btn--go', {
              'data-testid': 'end-interview', text: 'End the interview',
              onclick: function () {
                if (inv) { inv.sourceCount = (inv.sourceCount || 1) + (iv.gained > 8 ? 1 : 0); }
                s.today.interview = null;
                App.save(true);
                App.go('office');
              }
            })
          ], { testid: 'panel-interview' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * DOCUMENT REVIEW — find the row that does not belong.
   * ====================================================================== */
  App.startLedgerReview = function (inv) {
    var s = App.state;
    s.today.ledger = {
      investigationId: inv.id,
      rows: App.roll(function (r) { return Engine.buildLedger(r, 10); }),
      found: false, guesses: 0
    };
    App.go('ledger');
  };

  App.screens.ledger = {
    render: function () {
      var s = App.state;
      var lg = s.today && s.today.ledger;
      if (!lg) { App.go('office'); return h('div'); }
      var inv = s.investigations.filter(function (i) { return i.id === lg.investigationId; })[0];

      return h('div.screen', {}, [
        App.topbar('office'),
        h('div.one', {}, [
          App.panel('The documents', [
            h('p.panel__note', { text: 'One of these does not belong. Two wrong guesses and the trail goes cold.' }),
            h('div.ledger', { 'data-testid': 'ledger-rows' }, lg.rows.map(function (row) {
              return h('div.ledger__line', {}, [
                h('span', { text: row.ref + ' · ' + row.vendor + ' · ' + App.money(row.amount) }),
                lg.found
                  ? h('span', { text: row.suspicious ? row.note : '' })
                  : h('button.chip', {
                    'data-testid': 'row-' + row.id,
                    disabled: lg.guesses >= 2,
                    text: 'Flag',
                    onclick: function () {
                      if (row.suspicious) {
                        lg.found = true;
                        if (inv) {
                          inv.evidence = Engine.clamp(inv.evidence + 22, 0, Engine.evidenceCeiling(inv.sourceCount || 1));
                          inv.sourceCount = (inv.sourceCount || 1) + 1;
                        }
                        App.toast('There it is — ' + row.note + '.', 'good');
                      } else {
                        lg.guesses += 1;
                        App.toast('Nothing wrong with that one.', 'bad');
                      }
                      App.save(true);
                      App.go('ledger');
                    }
                  })
              ]);
            })),
            h('button.btn.btn--go', {
              'data-testid': 'close-ledger', text: 'Close the file',
              onclick: function () { s.today.ledger = null; App.go('office'); }
            })
          ], { testid: 'panel-ledger' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * PHOTO CROP
   * ====================================================================== */
  App.screens.crop = {
    render: function (params) {
      var s = App.state;
      var story = App.storyById(params.storyId) || (s.today.stories || [])[0];
      if (!story || !story.photo) { App.go('newsroom'); return h('div'); }
      story.photo.subjectAt = story.photo.subjectAt === undefined ? 0.5 : story.photo.subjectAt;
      App.cropState = App.cropState || { x: 0.1, w: 0.8 };
      var score = Engine.cropScore(App.cropState, story.photo);

      return h('div.screen', {}, [
        App.topbar('newsroom'),
        h('div.one', {}, [
          App.panel('Crop the photograph', [
            h('p.panel__note', { text: story.title }),
            h('div.crop', { 'data-testid': 'crop-strip' }, Array.apply(null, Array(10)).map(function (_, i) {
              var pos = i / 10;
              var inCrop = pos >= App.cropState.x && pos < App.cropState.x + App.cropState.w;
              var isSubject = Math.abs(pos + 0.05 - story.photo.subjectAt) < 0.06;
              return h('div.crop__cell' + (inCrop ? '.crop__cell--in' : '') + (isSubject ? '.crop__cell--subject' : ''), {
                'data-testid': 'crop-' + i,
                onclick: function () { App.cropState = { x: Math.max(0, pos - 0.15), w: App.cropState.w }; App.go('crop', params); }
              }, [isSubject ? App.sprite('reporter', 22) : null]);
            })),
            h('div.chips', {}, [0.4, 0.6, 0.8, 1].map(function (w) {
              return h('button.chip' + (App.cropState.w === w ? '.chip--on' : ''), {
                'data-testid': 'width-' + String(w).replace('.', '-'),
                text: Math.round(w * 100) + '% wide',
                onclick: function () { App.cropState = { x: App.cropState.x, w: w }; App.go('crop', params); }
              });
            })),
            h('div.mark', { 'data-testid': 'crop-score' }, [
              h('span.mark__v', { text: String(Math.round(score)) }),
              h('span.mark__l', { text: 'composition' })
            ]),
            h('button.btn.btn--go', {
              'data-testid': 'apply-crop', text: 'Use this crop',
              onclick: function () {
                story.photo.quality = Engine.clamp(story.photo.quality * 0.6 + score * 0.4, 0, 100);
                story.photo.label = score > 75 ? 'Well-cropped print' : story.photo.label;
                story.photo.cropped = true;
                App.toast('Cropped.', score > 70 ? 'good' : undefined);
                App.save(true);
                App.go('newsroom');
              }
            })
          ], { testid: 'panel-crop' })
        ])
      ]);
    }
  };

  /* =========================================================================
   * PEOPLE — consequence subjects, focus groups, union, election
   * ====================================================================== */
  App.screens.people = {
    render: function () {
      return h('div.screen', {}, [
        App.topbar('readers'),
        h('div.two', {}, [
          h('div', {}, [renderSubjects(), renderObituaries()]),
          h('div', {}, [renderFocusGroup(), renderUnion(), renderElection(), renderRivalEditors()])
        ])
      ]);
    }
  };

  function renderSubjects() {
    var s = App.state;
    var recent = s.subjects.slice(-14).reverse();
    return App.panel('People you named', [
      h('p.panel__note', { text: s.subjects.length + ' named in print. They do not forget.' }),
      recent.length
        ? h('div', { 'data-testid': 'subjects' }, recent.map(function (sub) {
          return h('div.reprow', {}, [
            h('span.reprow__k', { text: sub.name + ', ' + sub.role }),
            h('span.meter__track', {}, [
              h('span.meter__fill', { style: 'width:' + Math.round(Engine.clamp(sub.harm * 62, 0, 100)) + '%' })
            ]),
            h('span.reprow__v', { text: sub.resolved || '—' })
          ]);
        }))
        : h('p.daycard__empty', { text: 'Nobody yet. Most of your stories are about nobody in particular.' })
    ], { testid: 'panel-subjects' });
  }

  function renderObituaries() {
    var s = App.state;
    return App.panel('Obituaries', s.obituaries.length
      ? s.obituaries.slice(-6).reverse().map(function (o) {
        return h('div.letter', {}, [
          h('p.letter__body', { text: o.name + ', ' + o.role + ', ' + o.line + '.' }),
          h('span.card__foot', { text: o.printed ? 'printed' : 'waiting for a slot' })
        ]);
      })
      : [h('p.daycard__empty', { text: 'Nobody has died yet. Give it time.' })],
      { testid: 'panel-obituaries' });
  }

  /* Focus groups cost money and are sometimes simply wrong. */
  function renderFocusGroup() {
    var s = App.state;
    var truth = Engine.perceivedTrust(Engine.reputationAverage(s.reputation), s.satisfactionHistory);
    return App.panel('Focus group', [
      s.focusGroup
        ? h('div', { 'data-testid': 'focus-result' }, [
          h('div.mark', {}, [
            h('span.mark__v', { text: String(Math.round(s.focusGroup.reported)) }),
            h('span.mark__l', { text: 'they say readers trust you' })
          ]),
          h('p.press__cost', { text: 'Commissioned on day ' + s.focusGroup.day + '. They are not always right.' })
        ])
        : h('p.daycard__empty', { text: 'No research commissioned.' }),
      h('button.btn.btn--small', {
        'data-testid': 'run-focus-group',
        disabled: s.money < 400,
        text: 'Commission one · ' + App.money(400),
        onclick: function () {
          s.money -= 400;
          s.focusGroup = App.roll(function (r) {
            var reading = Engine.focusGroupReading(truth, r);
            return { reported: reading.reported, error: reading.error, day: s.day };
          });
          App.save(true);
          App.go('people');
        }
      })
    ], { testid: 'panel-focus' });
  }

  function renderUnion() {
    var s = App.state;
    if (!s.union || s.union.status !== 'open') {
      return App.panel('The staff', [
        h('p.daycard__empty', { text: 'No pay claim outstanding.' })
      ], { testid: 'panel-union' });
    }
    return App.panel('The staff', [
      h('p.rumour__title', { text: 'A ' + s.union.risePercent + '% rise is being asked for.' }),
      h('p.card__copy', { text: 'It would cost about ' + App.money(s.union.cost) + ' a day.' }),
      h('div.rumour__actions', {}, [
        h('button.btn.btn--small', {
          'data-testid': 'union-accept', text: 'Agree to it',
          onclick: function () {
            s.staff.forEach(function (st) { st.salary = Math.round(st.salary * (1 + s.union.risePercent / 100)); });
            s.staff.forEach(function (st) { st.energy = Engine.clamp(st.energy + 12, 0, 100); });
            s.union.status = 'agreed';
            App.toast('Agreed. The newsroom is noticeably warmer.', 'good');
            App.save(true); App.go('people');
          }
        }),
        h('button.btn.btn--ghost.btn--small', {
          'data-testid': 'union-counter', text: 'Offer half',
          onclick: function () {
            var half = s.union.risePercent / 2;
            s.staff.forEach(function (st) { st.salary = Math.round(st.salary * (1 + half / 100)); });
            s.union.status = 'settled';
            s.staff.forEach(function (st) { st.energy = Engine.clamp(st.energy - 4, 0, 100); });
            App.toast('Half was accepted, grudgingly.');
            App.save(true); App.go('people');
          }
        }),
        h('button.btn.btn--ghost.btn--small', {
          'data-testid': 'union-refuse', text: 'Refuse',
          onclick: function () {
            s.union.status = 'refused';
            s.staff.forEach(function (st) { st.energy = Engine.clamp(st.energy - 16, 0, 100); });
            s.reputation.professionalism = Engine.clamp(s.reputation.professionalism - 3, 0, 100);
            App.toast('Refused. Nobody is speaking to you.', 'bad');
            App.save(true); App.go('people');
          }
        })
      ])
    ], { testid: 'panel-union' });
  }

  function renderElection() {
    var s = App.state;
    if (!s.election) {
      return App.panel('The election', [
        h('p.daycard__empty', { text: 'No election running. There is one every November.' })
      ], { testid: 'panel-election' });
    }
    var e = s.election;
    return App.panel('The election', [
      e.result
        ? h('div', { 'data-testid': 'election-result' }, e.result.map(function (c, i) {
          return h('div.ledger__line' + (i === 0 ? '.ledger__line--good' : ''), {}, [
            h('span', { text: c.name }), h('span', { text: String(Math.round(c.score)) })
          ]);
        }))
        : h('div', { 'data-testid': 'election-coverage' }, e.candidates.map(function (c) {
          return h('div.kv', {}, [
            h('span.kv__k', { text: c.name + (c.incumbent ? ' (incumbent)' : '') }),
            h('span.kv__v', { text: (e.coverage[c.id] || 0) + ' mentions' })
          ]);
        })),
      h('p.press__cost', {
        text: e.result ? 'Decided on day ' + e.resultDay + '.'
          : 'Result on day ' + e.resultDay + '. What you print moves it.'
      })
    ], { testid: 'panel-election' });
  }

  function renderRivalEditors() {
    var s = App.state;
    var reactions = Object.keys(s.rivalEditors || {}).map(function (k) { return s.rivalEditors[k]; })
      .sort(function (a, b) { return b.day - a.day; }).slice(0, 4);
    return App.panel('The other editors', reactions.length
      ? reactions.map(function (r) {
        return h('div.letter.letter--idea', { 'data-testid': 'rival-reaction' }, [
          h('p.letter__body', { text: r.line }),
          h('span.card__foot', { text: r.editor + ' · day ' + r.day })
        ]);
      })
      : [h('p.daycard__empty', { text: 'Nobody has said anything about you yet.' })],
      { testid: 'panel-rival-editors' });
  }

  function kv(label, value) {
    return h('div.kv', {}, [h('span.kv__k', { text: label }), h('span.kv__v', { text: value })]);
  }
})();

</script>
<script>App.boot();</script>
</body>
</html>
